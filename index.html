/* ─── HOME PAGE: League-Wide Edge Scanner ────── */
/* ─────────────────────────────────────────────── */
function HomePage({games, onSelectGame, onScanComplete, allEdges, allWhiffScores, allPitchScores, allGameTotals, ppLines, goblinLines, scanState, onStartScan}){
  var topEdges = allEdges.filter(function(m){return m.edgeScore>=55;}).sort(function(a,b){return b.edgeScore-a.edgeScore;});
  var topWhiffs = allWhiffScores.filter(function(w){return w.score>=55;}).sort(function(a,b){return b.score-a.score;});

  // Pitches thrown: if PP lines available, rank by discrepancy; otherwise fallback to top 10 by grade
  var hasPPLines = ppLines && Object.keys(ppLines).length > 0;
  var topPitches = (function(){
    if(!hasPPLines){
      // Fallback: top 10 by confidence grade
      return allPitchScores.filter(function(p){return p.pitchScore>=55;})
        .sort(function(a,b){return b.pitchScore-a.pitchScore;}).slice(0,10)
        .map(function(p){return Object.assign({},p,{ppLine:null,gap:null});});
    }
    var merged=[];
    for(var pi=0;pi<allPitchScores.length;pi++){
      var p=allPitchScores[pi];
      // Match pitcher name to PP lines (fuzzy: last name match)
      var pName=p.pitcher.fullName;
      var ppLine=null;
      if(ppLines[pName]!=null){ ppLine=ppLines[pName]; }
      else{
        // Try last-name matching
        var lastName=pName.split(" ").slice(-1)[0].toLowerCase();
        for(var key in ppLines){
          if(key.toLowerCase().split(" ").slice(-1)[0]===lastName){
            ppLine=ppLines[key]; break;
          }
        }
      }
      if(ppLine==null) continue; // skip if no PP line
      var gap=Math.abs(p.line-ppLine);
      if(gap<3) continue; // only show gap of 3+
      var overUnder=p.line>ppLine?"OVER":"UNDER";
      merged.push(Object.assign({},p,{ppLine:ppLine,gap:gap,overUnder:overUnder}));
    }
    merged.sort(function(a,b){return b.gap-a.gap;});
    return merged;
  })();

  // Goblin OVER picks: rank pitchers where our projection is above the goblin line
  var hasGoblinLines = goblinLines && Object.keys(goblinLines).length > 0;
  var goblinPicks = (function(){
    if(!hasGoblinLines || allPitchScores.length===0) return [];
    var picks=[];
    for(var gi=0;gi<allPitchScores.length;gi++){
      var p=allPitchScores[gi];
      var pName=p.pitcher.fullName;
      var gLine=null;
      if(goblinLines[pName]!=null){ gLine=goblinLines[pName]; }
      else{
        var lastName=pName.split(" ").slice(-1)[0].toLowerCase();
        for(var key in goblinLines){
          if(key.toLowerCase().split(" ").slice(-1)[0]===lastName){
            gLine=goblinLines[key]; break;
          }
        }
      }
      if(gLine==null) continue;
      var gap=p.line-gLine; // positive = OVER
      if(gap<5.5) continue; // only show gaps of 5.5+
      // Also get standard PP line for reference
      var stdLine=null;
      if(ppLines&&ppLines[pName]!=null) stdLine=ppLines[pName];
      else if(ppLines){
        var ln2=pName.split(" ").slice(-1)[0].toLowerCase();
        for(var k2 in ppLines){if(k2.toLowerCase().split(" ").slice(-1)[0]===ln2){stdLine=ppLines[k2];break;}}
      }
      picks.push(Object.assign({},p,{goblinLine:gLine,gap:Math.round(gap*10)/10,ppLine:stdLine,overUnder:"OVER"}));
    }
    picks.sort(function(a,b){return b.gap-a.gap;});
    return picks;
  })();

  return(
    <div style={{padding:24,overflowY:"auto",height:"100%"}}>

        {scanState==="idle"&&(

      {/* Scan Progress */}
      {scanState==="scanning"&&(
        <div className="fade-in" style={{maxWidth:500,margin:"0 auto 24px"}}>
          <ScanProgress games={games} allEdges={allEdges}/>
        </div>

      {/* Top Edges (B grade and above, 55+) */}
      {topEdges.length>0&&(

            <div style={{

                      <td style={{padding:"10px 8px",textAlign:"center",fontWeight:700,color:pickColor}}>{p.overUnder}</td>
                      {hasPPLines&&(

                      <td style={{padding:"10px 8px",textAlign:"center",fontWeight:600,color:C.gold}}>{p.line}</td>
                      <td style={{padding:"10px 8px",textAlign:"center",color:C.blue}}>{p.seasonAvgPC!=null?p.seasonAvgPC:"—"}</td>

              </thead>
              <tbody>
                {goblinPicks.map(function(p,idx){
                  return(
                    <tr key={idx} style={{borderBottom:"1px solid "+C.border,cursor:"pointer",transition:"background 0.1s"}}
                      onMouseOver={function(e){e.currentTarget.style.background="#1a2234";}}
                      onMouseOut={function(e){e.currentTarget.style.background="transparent";}}

                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}



      {/* Pitcher K Projections Table */}
      {allWhiffScores.length>0&&(
        <div className="fade-in" style={{marginBottom:32}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:22,letterSpacing:3,color:C.purple}}>🔮 PITCHER K PROJECTIONS</div>
            <div style={{fontSize:10,color:C.muted,letterSpacing:1}}>ALL STARTERS TODAY</div>

              var home=g.teams.home.team.abbreviation;
              var awayP=g.teams.away.probablePitcher?g.teams.away.probablePitcher.fullName:"TBD";
              var homeP=g.teams.home.probablePitcher?g.teams.home.probablePitcher.fullName:"TBD";
              var time=new Date(g.gameDate).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
              var gameEdges=allEdges.filter(function(e){return e.gamePk===g.gamePk&&e.edgeScore>=55;});
              return(
                <button key={g.gamePk} className="home-card" onClick={function(){onSelectGame(g.gamePk);}}
                  style={{background:C.card,border:"1px solid "+C.border,borderRadius:8,padding:12,
                    cursor:"pointer",textAlign:"left",color:C.text,fontFamily:"'DM Mono',monospace",transition:"all 0.15s"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:14,fontWeight:600,letterSpacing:1}}>{away} @ {home}</span>
                    {gameEdges.length>0&&(
                      <span style={{fontSize:10,color:C.green,fontWeight:600}}>{gameEdges.length} edges</span>
                    )}
                  </div>
                  <div style={{fontSize:10,color:C.muted,marginTop:4}}>{time}</div>
                  <div style={{fontSize:9,color:C.subtext,marginTop:2}}>{awayP.split(" ").pop()} / {homeP.split(" ").pop()}</div>
                </button>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function ScanProgress({games, allEdges}){
  var gamesWithPitchers = games.filter(function(g){return g.teams.home.probablePitcher||g.teams.away.probablePitcher;});
  var scannedGames = {};
  allEdges.forEach(function(e){scannedGames[e.gamePk]=true;});
  var scannedCount = Object.keys(scannedGames).length;
  var total = gamesWithPitchers.length||1;
  var pct = Math.round(scannedCount/total*100);
  var topCount = allEdges.filter(function(e){return e.edgeScore>=55;}).length;

  return(
    <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:10,padding:16}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:C.muted,marginBottom:8}}>
        <span>Scanning {scannedCount}/{total} games</span>
        <span style={{color:C.green}}>{topCount} edges found so far</span>
      </div>
      <div style={{height:6,background:C.border,borderRadius:3,overflow:"hidden"}}>
        <div style={{height:"100%",width:pct+"%",background:"linear-gradient(90deg,"+C.gold+","+C.green+")",
          borderRadius:3,transition:"width 0.4s ease-out"}}/>
      </div>
    </div>
  );
}

  useEffect(function(){

  // Build season history entirely from cloud results on startup (universal for all users)

    (async function(){
      try{
        var idxResp = await fetch("./results/index.json");
        if(!idxResp.ok) return;
        var resultDates = await idxResp.json();
        if(!Array.isArray(resultDates)||resultDates.length===0) return;

        // Fetch all cloud results and build complete season history
        var cloudHistory = [];

          try{
            var r = await fetch("./results/"+resultDates[mi]+".json");
            if(!r.ok) continue;

              date:rd.date,

              pitchesCount:rd.summary.bGradePitches||0,
              regularOURate:rd.summary.regularOURate||0,
              goblinHitRate:rd.summary.goblinHitRate||0
            });

        cloudHistory.sort(function(a,b){return a.date.localeCompare(b.date);});
        setSeasonHistory(cloudHistory);
      }catch(e){}
    })();
  },[]);

  /* ─── Full Slate Scanner ─── */
  async function scanAllGames(){
    scanAbort.current=false;
    setScanState("scanning");
    setAllEdges([]);
    setAllWhiffScores([]);
    setAllPitchScores([]);
    var accumulated=[];
    var whiffAccum=[];
    var pitchAccum=[];
    var totalAccum=[];

    for(var gi=0;gi<games.length;gi++){
      if(scanAbort.current) break;
      var game=games[gi];
      var homeId=game.teams.home.team.id;
      var awayId=game.teams.away.team.id;
      var homePitcher=game.teams.home.probablePitcher;
      var awayPitcher=game.teams.away.probablePitcher;
      if(!homePitcher&&!awayPitcher) continue;

      var awayAbbr=game.teams.away.team.abbreviation;
      var homeAbbr=game.teams.home.team.abbreviation;
      var gameLabel=awayAbbr+" @ "+homeAbbr;

      try{
        var rosters=await Promise.all([getRoster(homeId),getRoster(awayId)]);
        var homeRoster=rosters[0];
        var awayRoster=rosters[1];

        // Fetch team K rates for whiff scores
        var teamKRatesLocal={};
        var tkFetches=[
          getTeamSeasonStats(homeId).then(function(s){if(s) teamKRatesLocal[homeId]=s;}),
          getTeamSeasonStats(awayId).then(function(s){if(s) teamKRatesLocal[awayId]=s;})
        ];
        await Promise.all(tkFetches);

        // Pre-fetch pitcher hands and season stats (once per pitcher, not per batter)
        var homePitcherHand=null, awayPitcherHand=null;
        var homePitcherStat=null, awayPitcherStat=null;
        var handFetches=[];
        if(homePitcher){
          handFetches.push(getPitcherHand(homePitcher.id).then(function(h){homePitcherHand=h;}));
          handFetches.push(getSeasonStats(homePitcher.id,"pitching").then(function(s){homePitcherStat=s;}));
        }
        if(awayPitcher){
          handFetches.push(getPitcherHand(awayPitcher.id).then(function(h){awayPitcherHand=h;}));
          handFetches.push(getSeasonStats(awayPitcher.id,"pitching").then(function(s){awayPitcherStat=s;}));
        }
        await Promise.all(handFetches);

        var homeMatchupsForWhiff=[];
        var awayMatchupsForWhiff=[];

        // Helper: race a promise against a hard timeout
        function withTimeout(promise,ms){
          return Promise.race([promise,new Promise(function(_,rej){setTimeout(function(){rej(new Error("timeout"));},ms);})]);
        }
        // Helper: yield to browser event loop to prevent connection pool starvation
        function yieldThread(){return new Promise(function(r){setTimeout(r,0);});}
        // Helper: process a single batter's edge (core + optional extras)
        async function processBatter(batter,pitcher,pitcherStat,pitcherHand,teamAbbr,side,venueId,teamGP){
          // Phase 1: core fetches only (BvP + season stats) — 8s timeout
          var coreResults=await withTimeout(Promise.all([
            getBvPSplits(batter.person.id,pitcher.id),
            getSeasonStats(batter.person.id,"hitting")
          ]),8000);
          var stat=coreResults[0];
          var seasonStat=coreResults[1];
          if(!stat||(parseInt(stat.plateAppearances)||0)<5) return null;
          // Phase 2: optional extras (recentForm + platoon) — 5s timeout, failures are OK
          var recentForm=null, platoonSplit={vsLeft:null,vsRight:null};
          try{
            var extraResults=await withTimeout(Promise.all([
              getBatterRecentForm(batter.person.id).catch(function(){return null;}),
              getBatterPlatoonSplits(batter.person.id).catch(function(){return {vsLeft:null,vsRight:null};})
            ]),5000);
            recentForm=extraResults[0];
            platoonSplit=extraResults[1]||{vsLeft:null,vsRight:null};
          }catch(e){/* extras timed out, proceed without them */}
          var parkRunFactor=getParkRunFactor(venueId);
          var playingTimeRisk=getPlayingTimeRisk(seasonStat,teamGP);
          var extras={pitcherStat:pitcherStat,recentForm:recentForm,platoonSplit:platoonSplit,pitcherHand:pitcherHand,parkRunFactor:parkRunFactor.factor,playingTimeRisk:playingTimeRisk};
          var esr=computeEdgeScore(stat,seasonStat,stat.plateAppearances,null,null,extras);
          return {batter:batter.person,pitcher:pitcher,stat:stat,seasonStat:seasonStat,edgeScore:esr.score,
            pitcherTeam:side==="away"?game.teams.home.team.name:game.teams.away.team.name,
            batterTeam:teamAbbr,side:side,parkDelta:0,gamePk:game.gamePk,gameLabel:gameLabel};
        }
        // Helper: process an array of batters in batches of BATCH_SIZE
        var BATCH_SIZE=3;
        async function processBatterBatch(roster,pitcher,pitcherStat,pitcherHand,teamAbbr,side,venueId,teamGP,whiffArr){
          for(var bi=0;bi<roster.length;bi+=BATCH_SIZE){
            if(scanAbort.current) break;
            var batch=roster.slice(bi,bi+BATCH_SIZE);
            var batchPromises=batch.map(function(b){
              return processBatter(b,pitcher,pitcherStat,pitcherHand,teamAbbr,side,venueId,teamGP).catch(function(){return null;});
            });
            var batchResults=await Promise.all(batchPromises);
            for(var ri=0;ri<batchResults.length;ri++){
              var res=batchResults[ri];
              if(res){
                accumulated.push(res);
                whiffArr.push({stat:res.stat,batter:res.batter});
              }
            }
            await yieldThread(); // let browser flush pending connections
          }
        }

        // Game-level timeout: 45 seconds per game max
        var gameStart=Date.now();
        var GAME_TIMEOUT=45000;

        if(homePitcher&&(Date.now()-gameStart)<GAME_TIMEOUT){
          var hVenueId=game.venue?game.venue.id:null;
          var hTeamGP=game.teams.away.gamesPlayed||162;
          await processBatterBatch(awayRoster,homePitcher,homePitcherStat,homePitcherHand,awayAbbr,"away",hVenueId,hTeamGP,homeMatchupsForWhiff);
        }
        if(awayPitcher&&(Date.now()-gameStart)<GAME_TIMEOUT){
          var aVenueId=game.venue?game.venue.id:null;
          var aTeamGP=game.teams.home.gamesPlayed||162;
          await processBatterBatch(homeRoster,awayPitcher,awayPitcherStat,awayPitcherHand,homeAbbr,"home",aVenueId,aTeamGP,awayMatchupsForWhiff);
        }

        // Compute whiff scores for this game's pitchers (without extras, just basics)
        if(homePitcher && homeMatchupsForWhiff.length > 0){
          var homeSeasonStat=await getSeasonStats(homePitcher.id,"pitching");
          var oppKRate=teamKRatesLocal[awayId] ? teamKRatesLocal[awayId].kRate : 0.200;
          var homeWhiffResult=computeWhiffScore(homePitcher, homeSeasonStat, null, oppKRate, homeMatchupsForWhiff);
          var hK9=homeSeasonStat?parseFloat(homeSeasonStat.strikeoutsPer9Inn)||0:0;
          var hExpIP=homeSeasonStat&&homeSeasonStat.inningsPitched&&homeSeasonStat.gamesStarted?(parseFloat(homeSeasonStat.inningsPitched)/Math.max(parseInt(homeSeasonStat.gamesStarted),1)):5.5;
          var hProjK=floorHalf((hK9*hExpIP/9)*0.88);
          whiffAccum.push({pitcher:homePitcher, score:homeWhiffResult.score, gamePk:game.gamePk, gameLabel:gameLabel,
            team:homeAbbr, oppTeam:awayAbbr, k9:hK9, projectedIP:hExpIP, projectedK:hProjK, seasonStat:homeSeasonStat});
        }
        if(awayPitcher && awayMatchupsForWhiff.length > 0){
          var awaySeasonStat=await getSeasonStats(awayPitcher.id,"pitching");
          var oppKRate2=teamKRatesLocal[homeId] ? teamKRatesLocal[homeId].kRate : 0.200;
          var awayWhiffResult=computeWhiffScore(awayPitcher, awaySeasonStat, null, oppKRate2, awayMatchupsForWhiff);
          var aK9=awaySeasonStat?parseFloat(awaySeasonStat.strikeoutsPer9Inn)||0:0;
          var aExpIP=awaySeasonStat&&awaySeasonStat.inningsPitched&&awaySeasonStat.gamesStarted?(parseFloat(awaySeasonStat.inningsPitched)/Math.max(parseInt(awaySeasonStat.gamesStarted),1)):5.5;
          var aProjK=floorHalf((aK9*aExpIP/9)*0.88);
          whiffAccum.push({pitcher:awayPitcher, score:awayWhiffResult.score, gamePk:game.gamePk, gameLabel:gameLabel,
            team:awayAbbr, oppTeam:homeAbbr, k9:aK9, projectedIP:aExpIP, projectedK:aProjK, seasonStat:awaySeasonStat});
        }

        // V5.3: Quick game total estimate for pitch count cross-reference
        // Uses already-fetched season stats to estimate if this is a high-scoring game
        var quickGameTotal=null;
        try{
          var hERAq=homePitcherStat?parseFloat(homePitcherStat.era)||4.50:4.50;
          var aERAq=awayPitcherStat?parseFloat(awayPitcherStat.era)||4.50:4.50;
          // Quick estimate: league avg is 9.0 total, adjust by starter ERA differential
          quickGameTotal=9.0+(hERAq-4.50)*0.45+(aERAq-4.50)*0.45;
          // Clamp to reasonable range
          quickGameTotal=Math.max(5.0,Math.min(14.0,quickGameTotal));
        }catch(e){}

        // Pitches-thrown scanning for this game (V5.3 PP-anchored model)
        try{
          var venueId=game.venue?game.venue.id:null;
          var parkFactor=getParkRunFactor(venueId);

          // Match pitcher names to PP lines (read directly from localStorage for reliability)
          var _ppScanLines=ppLines;
          if(!_ppScanLines){
            try{var _ppTd=new Date().toISOString().slice(0,10);var _ppR=localStorage.getItem("de_pp_lines_"+_ppTd);if(_ppR){var _ppD=JSON.parse(_ppR);if(_ppD&&_ppD.lines)_ppScanLines=_ppD.lines;}}catch(e){}
          }
          function matchPPLine(pitcherName){
            if(!_ppScanLines||!pitcherName) return null;
            if(_ppScanLines[pitcherName]!=null) return _ppScanLines[pitcherName];
            var last=pitcherName.split(" ").slice(-1)[0].toLowerCase();
            for(var k in _ppScanLines){
              if(k.toLowerCase().split(" ").slice(-1)[0]===last) return _ppScanLines[k];
            }
            return null;
          }

          if(homePitcher){
            var hpFetches=await Promise.all([
              getPitcher2YrPitchAvg(homePitcher.id),
              getPitcherRecent5PitchAvg(homePitcher.id),
              getPitcherEfficiency(homePitcher.id),
              getTeamPPAFaced(awayId),
              getBullpenFatigue(homeId),
              getPitcherHand(homePitcher.id),
              getPitcherPitchProfile(homePitcher.id)
            ]);
            var hp2yr=hpFetches[0], hpRecent5=hpFetches[1], hpEff=hpFetches[2];
            var hOppTeamPPA=hpFetches[3], hBpFatigue=hpFetches[4], hPitchHand=hpFetches[5];
            var hProfile=hpFetches[6];
            var hBvpAdj=computeLineupBvPPitchAdj(homeMatchupsForWhiff);
            var hHandAdj=computeHandednessAdj(hPitchHand, awayRoster);
            var hPPLine=matchPPLine(homePitcher.fullName);
            var hParams={twoYr:hp2yr, recent5:hpRecent5, bvpAdj:hBvpAdj, pitcherEff:hpEff,
              teamPPA:hOppTeamPPA, bullpenFatigue:hBpFatigue, parkFactor:parkFactor,
              handednessAdj:hHandAdj, matchupsCount:homeMatchupsForWhiff.length,
              ppLine:hPPLine, pitchProfile:hProfile, gameTotal:quickGameTotal};
            var hLine=computePitchLine(hParams);
            if(hLine!=null&&!isNaN(hLine)){
              var hOU=computeOverUnder(hLine, hParams);
              var hPs=computePitchScore(hParams);
              pitchAccum.push({
                pitcher:homePitcher, team:homeAbbr, oppTeam:awayAbbr,
                line:hLine, overUnder:hOU, pitchScore:hPs,
                recent5Avg:hpRecent5?Math.round(hpRecent5.avg*10)/10:null,
                twoYrAvg:hp2yr?Math.round(hp2yr.avg*10)/10:null,
                bvpAdj:hBvpAdj, seasonAvgPC:hProfile?Math.round(hProfile.seasonAvgPC):null,
                gamePk:game.gamePk, gameLabel:gameLabel
              });
            }
          }
          if(awayPitcher){
            var apFetches=await Promise.all([
              getPitcher2YrPitchAvg(awayPitcher.id),
              getPitcherRecent5PitchAvg(awayPitcher.id),
              getPitcherEfficiency(awayPitcher.id),
              getTeamPPAFaced(homeId),
              getBullpenFatigue(awayId),
              getPitcherHand(awayPitcher.id),
              getPitcherPitchProfile(awayPitcher.id)
            ]);
            var ap2yr=apFetches[0], apRecent5=apFetches[1], apEff=apFetches[2];
            var aOppTeamPPA=apFetches[3], aBpFatigue=apFetches[4], aPitchHand=apFetches[5];
            var aProfile=apFetches[6];
            var aBvpAdj=computeLineupBvPPitchAdj(awayMatchupsForWhiff);
            var aHandAdj=computeHandednessAdj(aPitchHand, homeRoster);
            var aPPLine=matchPPLine(awayPitcher.fullName);
            var aParams={twoYr:ap2yr, recent5:apRecent5, bvpAdj:aBvpAdj, pitcherEff:apEff,
              teamPPA:aOppTeamPPA, bullpenFatigue:aBpFatigue, parkFactor:parkFactor,
              handednessAdj:aHandAdj, matchupsCount:awayMatchupsForWhiff.length,
              ppLine:aPPLine, pitchProfile:aProfile, gameTotal:quickGameTotal};
            var aLine=computePitchLine(aParams);
            if(aLine!=null&&!isNaN(aLine)){
              var aOU=computeOverUnder(aLine, aParams);
              var aPs=computePitchScore(aParams);
              pitchAccum.push({
                pitcher:awayPitcher, team:awayAbbr, oppTeam:homeAbbr,
                line:aLine, overUnder:aOU, pitchScore:aPs,
                recent5Avg:apRecent5?Math.round(apRecent5.avg*10)/10:null,
                twoYrAvg:ap2yr?Math.round(ap2yr.avg*10)/10:null,
                bvpAdj:aBvpAdj, seasonAvgPC:aProfile?Math.round(aProfile.seasonAvgPC):null,
                gamePk:game.gamePk, gameLabel:gameLabel
              });
            }
          }
        }catch(pitchErr){}

      }catch(e){
        // skip game on error, continue scanning
      }
      // Update state after each game so user sees progress
      setAllEdges(accumulated.slice());
      setAllWhiffScores(whiffAccum.slice());
      setAllPitchScores(pitchAccum.slice());
      // Yield between games to let browser flush connection pool
      await new Promise(function(r){setTimeout(r,50);});
    }
    setAllEdges(accumulated.slice());
    setAllWhiffScores(whiffAccum.slice());
    setAllPitchScores(pitchAccum.slice());
    setAllGameTotals(totalAccum.slice());
    setScanState("done");

    // ── Snapshot: freeze today's pre-game scores for results comparison ──
    try{
      var today = new Date().toISOString().slice(0,10);
      // Top 15 batter edges
      var sortedEdges = accumulated.slice().sort(function(a,b){return b.edgeScore-a.edgeScore;});
      var top15Snap = sortedEdges.slice(0,15).map(function(e){
        return {
          batterId: e.batter.id, batterName: e.batter.fullName,
          pitcherId: e.pitcher.id, pitcherName: e.pitcher.fullName,
          batterTeam: e.batterTeam, pitcherTeam: e.pitcherTeam||"",
          edgeScore: e.edgeScore, gamePk: e.gamePk, gameLabel: e.gameLabel,
          bvpAvg: e.stat ? e.stat.avg : null, bvpOps: e.stat ? e.stat.ops : null
        };
      });
      // All pitcher whiff scores
      var pitcherSnap = whiffAccum.map(function(w){
        return {
          pitcherId: w.pitcher.id, pitcherName: w.pitcher.fullName,
          whiffScore: w.score, gamePk: w.gamePk, gameLabel: w.gameLabel,
          team: w.team||"", oppTeam: w.oppTeam||"",
          k9: w.k9||0, projectedIP: w.projectedIP||5.5, projectedK: w.projectedK||0
        };
      });
      // All pitches-thrown picks (with PP line + goblin line data if available)
      var ppRaw2=null; try{var td2=new Date().toISOString().slice(0,10); var pr2=localStorage.getItem("de_pp_lines_"+td2); if(pr2) ppRaw2=JSON.parse(pr2);}catch(e){}
      var ppL2=ppRaw2&&ppRaw2.lines?ppRaw2.lines:{};
      var gL2=ppRaw2&&ppRaw2.goblinLines?ppRaw2.goblinLines:{};
      var pitchSnap = pitchAccum.map(function(p){
        var pName=p.pitcher.fullName;
        var ppVal=ppL2[pName]||null;
        var gVal=gL2[pName]||null;
        if(!gVal){
          var ln=pName.split(" ").slice(-1)[0].toLowerCase();
          for(var gk in gL2){if(gk.toLowerCase().split(" ").slice(-1)[0]===ln){gVal=gL2[gk];break;}}
        }
        if(!ppVal){
          var ln2=pName.split(" ").slice(-1)[0].toLowerCase();
          for(var pk in ppL2){if(pk.toLowerCase().split(" ").slice(-1)[0]===ln2){ppVal=ppL2[pk];break;}}
        }
        return {
          pitcherId:p.pitcher.id, pitcherName:p.pitcher.fullName,
          team:p.team, oppTeam:p.oppTeam,
          line:p.line, ppLine:ppVal, goblinLine:gVal, overUnder:p.overUnder, pitchScore:p.pitchScore,
          recent5Avg:p.recent5Avg, twoYrAvg:p.twoYrAvg, bvpAdj:p.bvpAdj,
          gamePk:p.gamePk, gameLabel:p.gameLabel
        };
      });
      var snapshot = {date:today, batters:top15Snap, pitchers:pitcherSnap, pitches:pitchSnap, savedAt:new Date().toISOString()};
      localStorage.setItem("de_snapshot_"+today, JSON.stringify(snapshot));
      // Clean up old snapshots (keep last 30 days)
      for(var si=0;si<localStorage.length;si++){
        var lsKey=localStorage.key(si);
        if(lsKey&&lsKey.startsWith("de_snapshot_")&&lsKey<"de_snapshot_"+new Date(Date.now()-30*86400000).toISOString().slice(0,10)){
          localStorage.removeItem(lsKey);
        }
      }
    }catch(snapErr){ /* localStorage may be unavailable, silently skip */ }
  }

  // ── K Predictor Independent Scan ──
  async function scanKPredictor(){
    setKScanState("scanning");
    setKPredictions([]);
    setKScanProgress("Loading today's games...");
    try{
      var todayGames = games.length > 0 ? games : await getTodayGames();
      var kResults = [];
      for(var gi=0; gi<todayGames.length; gi++){
        var game = todayGames[gi];
        var gamePk = game.gamePk;
        var awayTeam = game.teams.away.team;
        var homeTeam = game.teams.home.team;
        var awayP = game.teams.away.probablePitcher;
        var homeP = game.teams.home.probablePitcher;
        if(!awayP || !homeP) continue;
        setKScanProgress("Game " + (gi+1) + "/" + todayGames.length + ": " + awayTeam.abbreviation + " @ " + homeTeam.abbreviation);

        // Fetch pitcher season stats and hand
        var awayPStat, homePStat, awayPHand, homePHand;
        try{
          var pFetches = await Promise.all([
            getSeasonStats(awayP.id, "pitching"),
            getSeasonStats(homeP.id, "pitching"),
            getPitcherHand(awayP.id),
            getPitcherHand(homeP.id)
          ]);
          awayPStat = pFetches[0];
          homePStat = pFetches[1];
          awayPHand = pFetches[2];
          homePHand = pFetches[3];
        }catch(e){ continue; }

        // Fetch rosters
        var awayRoster, homeRoster;
        try{
          var rFetches = await Promise.all([
            getRoster(awayTeam.id),
            getRoster(homeTeam.id)
          ]);
          awayRoster = rFetches[0] || [];
          homeRoster = rFetches[1] || [];
        }catch(e){ continue; }

        // Get team K rates
        var awayTeamKRate = 0.22, homeTeamKRate = 0.22;
        try{
          var tkFetches = await Promise.all([
            getSeasonStats(awayTeam.id, "hitting"),
            getSeasonStats(homeTeam.id, "hitting")
          ]);
          if(tkFetches[0]){
            var tkAB = parseInt(tkFetches[0].atBats)||0;
            var tkK = parseInt(tkFetches[0].strikeOuts)||0;
            if(tkAB > 100) awayTeamKRate = tkK / tkAB;
          }
          if(tkFetches[1]){
            var tkAB2 = parseInt(tkFetches[1].atBats)||0;
            var tkK2 = parseInt(tkFetches[1].strikeOuts)||0;
            if(tkAB2 > 100) homeTeamKRate = tkK2 / tkAB2;
          }
        }catch(e){}

        // Process each side: away batters vs home pitcher, home batters vs away pitcher
        var sides = [
          {roster: awayRoster, pitcher: homeP, pitcherStat: homePStat, pitcherHand: homePHand, teamKRate: awayTeamKRate, batterTeamAbbr: awayTeam.abbreviation, pitcherTeamAbbr: homeTeam.abbreviation},
          {roster: homeRoster, pitcher: awayP, pitcherStat: awayPStat, pitcherHand: awayPHand, teamKRate: homeTeamKRate, batterTeamAbbr: homeTeam.abbreviation, pitcherTeamAbbr: awayTeam.abbreviation}
        ];

        for(var si=0; si<sides.length; si++){
          var side = sides[si];
          // Process top ~9 batters (lineup positions)
          var batterList = side.roster.filter(function(p){
            return p.position && p.position.abbreviation !== "P";
          }).slice(0, 13);

          for(var bi=0; bi<batterList.length; bi++){
            var batter = batterList[bi];
            try{
              // Fetch batter data in parallel
              var bFetches = await Promise.all([
                getSeasonStats(batter.person.id, "hitting"),
                getBvPSplits(batter.person.id, side.pitcher.id),
                getBatterRecentForm(batter.person.id),
                getBatterPlatoonSplits(batter.person.id)
              ]);
              var batterSeason = bFetches[0];
              var bvpStat = bFetches[1];
              var batterRecent = bFetches[2];
              var platoonData = bFetches[3];

              // Skip batters with too few AB
              if(!batterSeason || (parseInt(batterSeason.atBats)||0) < 20) continue;

              // Get the right platoon split
              var batterSplit = null;
              if(platoonData){
                batterSplit = side.pitcherHand === "L" ? platoonData.vsLeft : platoonData.vsRight;
              }

              var kResult = computeBatterKConfidence({
                batterSeason: batterSeason,
                batterSplit: batterSplit,
                pitcherSeason: side.pitcherStat,
                bvpStat: bvpStat,
                batterRecent: batterRecent,
                pitcherHand: side.pitcherHand,
                teamKRate: side.teamKRate
              });

              kResults.push({
                batter: {id: batter.person.id, fullName: batter.person.fullName},
                pitcher: {id: side.pitcher.id, fullName: side.pitcher.fullName},
                batterTeam: side.batterTeamAbbr,
                pitcherTeam: side.pitcherTeamAbbr,
                pitcherHand: side.pitcherHand,
                gamePk: gamePk,
                gameLabel: awayTeam.abbreviation + " @ " + homeTeam.abbreviation,
                conf1K: kResult.conf1K,
                conf2K: kResult.conf2K,
                composite: kResult.composite,
                factors: kResult.factors,
                batterKRate: kResult.factors.batterK ? kResult.factors.batterK.rate : 0.22,
                pitcherK9: kResult.factors.pitcherK9 ? kResult.factors.pitcherK9.k9 : 8.5
              });
            }catch(e){ /* skip batter on error */ }
          }
        }
        // Update state incrementally
        setKPredictions(kResults.slice());
        await new Promise(function(r){setTimeout(r,50);});
      }
      setKPredictions(kResults.slice());
      setKScanState("done");
      setKScanProgress("");
    }catch(e){
      setKScanProgress("Error: " + e.message);
      setKScanState("idle");
    }
  }

  async function loadResults(dateStr){
    setResultsLoading(true);
    setResultsProgress("Loading cloud results...");
    setResultsData(null);
    try{
      // ── Cloud results only — universal for all users ──
      var cloudResults = null;
      try{
        var cloudRes = await fetch("./results/"+dateStr+".json");
        if(cloudRes.ok) cloudResults = await cloudRes.json();
      }catch(e){}

      if(cloudResults && cloudResults.batters && cloudResults.batters.length > 0){
        setResultsProgress("Processing results...");

        var crPicks = cloudResults.batters.map(function(b){
          return {
            batter:{id:b.batterId, fullName:b.batterName},
            pitcher:{id:b.pitcherId||0, fullName:b.pitcherName||""},
            batterTeam:b.batterTeam, pitcherTeam:b.pitcherTeam||"",
            edgeScore:b.edgeScore, bvpStat:b.bvpAvg?{avg:b.bvpAvg,ops:b.bvpOps}:null,
            gamePk:b.gamePk, gameLabel:b.gameLabel,
            actualStats:b.actualStats||null,
            fantasyScore:b.fantasyScore||0
          };
        });
        var crPitchers = (cloudResults.pitchers||[]).map(function(p){
          return {
            pitcher:{id:p.pitcherId, fullName:p.pitcherName},
            team:p.team, oppTeam:p.oppTeam,
            whiffScore:p.whiffScore, seasonStat:null,
            projectedK:p.projectedK, k9:p.k9||0,
            gamePk:p.gamePk, gameLabel:p.gameLabel,
            actualStats:p.actualK!==undefined?{}:null,
            actualK:p.actualK||0, actualIP:p.actualIP||"0",
            actualER:p.actualER||0, actualH:p.actualH||0,
            actualBB:p.actualBB||0,
            hitOver:p.hitProj||false
          };
        });
        // V2 Fix: backfill actualK from boxscore if cloud results have actualK=0
        var pitchersNeedingK = crPitchers.filter(function(p){return p.gamePk && p.actualK===0 && p.pitcher.id;});
        if(pitchersNeedingK.length > 0){
          var boxscoreCache = {};
          for(var bki=0; bki<pitchersNeedingK.length; bki++){
            var bp = pitchersNeedingK[bki];
            try{
              if(!boxscoreCache[bp.gamePk]){
                var bxData = await fetchJSON(BASE+"/game/"+bp.gamePk+"/boxscore");
                boxscoreCache[bp.gamePk] = bxData;
              }
              var bx = boxscoreCache[bp.gamePk];
              if(bx && bx.teams){
                var sides = ["home","away"];
                for(var si=0;si<sides.length;si++){
                  var teamData = bx.teams[sides[si]];
                  if(!teamData||!teamData.players) continue;
                  var playerKeys = Object.keys(teamData.players);
                  for(var pk=0;pk<playerKeys.length;pk++){
                    var pl = teamData.players[playerKeys[pk]];
                    if(pl.person && pl.person.id === bp.pitcher.id && pl.stats && pl.stats.pitching && pl.stats.pitching.strikeOuts !== undefined){
                      bp.actualK = parseInt(pl.stats.pitching.strikeOuts)||0;
                      bp.actualIP = pl.stats.pitching.inningsPitched||"0";
                      bp.actualER = parseInt(pl.stats.pitching.earnedRuns)||0;
                      bp.actualH = parseInt(pl.stats.pitching.hits)||0;
                      bp.actualBB = parseInt(pl.stats.pitching.baseOnBalls)||0;
                      bp.actualStats = {};
                    }
                  }
                }
              }
            }catch(e){}
          }
        }
        // Backfill ppLine/goblinLine from localStorage if missing in cloud results
        var ppLinesForDate = null;
        try{
          var ppRaw = localStorage.getItem("de_pp_lines_"+dateStr);
          if(ppRaw) ppLinesForDate = JSON.parse(ppRaw);
        }catch(e){}

        // If cloud results have fewer pitches than localStorage snapshot, use snapshot pitches instead
        var pitchesSource = cloudResults.pitches||[];
        var usedSnapshot = false;
        try{
          var snapRaw = localStorage.getItem("de_snapshot_"+dateStr);
          if(snapRaw){
            var snapData = JSON.parse(snapRaw);
            if(snapData.pitches && snapData.pitches.length > pitchesSource.length){
              pitchesSource = snapData.pitches;
              usedSnapshot = true;
            }
          }
        }catch(e){}

        // If we used snapshot data, backfill actualPitches from boxscores
        if(usedSnapshot){
          setResultsProgress("Fetching boxscores for actual pitch counts...");
          var bxCache2 = {};
          for(var ps2=0;ps2<pitchesSource.length;ps2++){
            var pick2 = pitchesSource[ps2];
            if(pick2.actualPitches>0) continue; // already has actuals
            try{
              if(!bxCache2[pick2.gamePk]){
                bxCache2[pick2.gamePk] = await fetchJSON(BASE+"/game/"+pick2.gamePk+"/boxscore");
              }
              var bx2 = bxCache2[pick2.gamePk];
              if(bx2 && bx2.teams){
                var sides2=["home","away"];
                for(var s2=0;s2<sides2.length;s2++){
                  var td2=bx2.teams[sides2[s2]];
                  if(!td2||!td2.players) continue;
                  var pKeys2=Object.keys(td2.players);
                  for(var pk2=0;pk2<pKeys2.length;pk2++){
                    var pl2=td2.players[pKeys2[pk2]];
                    if(pl2.person && pl2.person.id===pick2.pitcherId && pl2.stats && pl2.stats.pitching){
                      var pitchStats=pl2.stats.pitching;
                      pick2.actualPitches=parseInt(pitchStats.numberOfPitches||pitchStats.pitchesThrown)||0;
                      pick2.actualStats=pick2.actualPitches>0?true:null;
                    }
                  }
                }
              }
            }catch(e){}
          }
        }

        var crPitches = pitchesSource.map(function(p){
          var ap=p.actualPitches||0;
          var played=p.actualStats&&ap>0;
          var computedProjHit=played?Math.abs(ap-p.line)<=2.5:false;
          // Backfill ppLine from localStorage if null
          var ppLine=p.ppLine||null;
          if(ppLine==null && ppLinesForDate && ppLinesForDate.lines){
            var pLast = (p.pitcherName||"").split(" ").pop().toLowerCase();
            var lineKeys = Object.keys(ppLinesForDate.lines);
            for(var lk=0;lk<lineKeys.length;lk++){
              var keyLast = lineKeys[lk].split(" ").pop().toLowerCase();
              if(keyLast===pLast && pLast.length>1){ ppLine=ppLinesForDate.lines[lineKeys[lk]]; break; }
            }
          }
          // Backfill goblinLine from localStorage if missing
          var gLine=p.goblinLine||null;
          if(gLine==null && ppLinesForDate && ppLinesForDate.goblinLines){
            var gLast = (p.pitcherName||"").split(" ").pop().toLowerCase();
            var gKeys = Object.keys(ppLinesForDate.goblinLines);
            for(var gk=0;gk<gKeys.length;gk++){
              var gKeyLast = gKeys[gk].split(" ").pop().toLowerCase();
              if(gKeyLast===gLast && gLast.length>1){ gLine=ppLinesForDate.goblinLines[gKeys[gk]]; break; }
            }
          }
          // Compute O/U hit vs regular PP line
          var ouHit=false;
          if(played && ppLine!=null){
            if(p.overUnder==="OVER") ouHit = ap > ppLine;
            else ouHit = ap < ppLine;
          }
          // Compute goblin OVER hit
          var goblinHit=false;
          if(played && gLine!=null){
            goblinHit = ap > gLine;
          }
          return {
            pitcher:{id:p.pitcherId, fullName:p.pitcherName},
            team:p.team, oppTeam:p.oppTeam,
            line:p.line, ppLine:ppLine, goblinLine:gLine, overUnder:p.overUnder,
            pitchScore:p.pitchScore, grade:p.grade,
            recent5Avg:p.recent5Avg, twoYrAvg:p.twoYrAvg, bvpAdj:p.bvpAdj||0,
            gamePk:p.gamePk, gameLabel:p.gameLabel,
            actualPitches:ap,
            actualStats:p.actualStats||null,
            hit:p.hit||false,
            ouHit:ouHit,
            projHit:computedProjHit,
            goblinHit:goblinHit
          };
        });

        // Compute summaries — only count players who actually played (have actualStats)
        var crTotalFantasy=0, crHitCount=0, crBGradeBatters=0;
        for(var ci=0;ci<crPicks.length;ci++){
          crTotalFantasy+=crPicks[ci].fantasyScore;
          if(crPicks[ci].edgeScore>=55&&crPicks[ci].actualStats){
            crBGradeBatters++;
            if((parseInt(crPicks[ci].actualStats.hits)||0)>0) crHitCount++;
          }
        }
        var crPitcherOver=0, crPitchersWithStats=0, crTotalK=0;
        for(var cpi=0;cpi<crPitchers.length;cpi++){
          if(crPitchers[cpi].whiffScore>=55&&crPitchers[cpi].actualStats){
            crPitchersWithStats++;
            crTotalK+=crPitchers[cpi].actualK;
            if(crPitchers[cpi].hitOver) crPitcherOver++;
          }
        }
        // PP O/U picks: pitchers where |proj - ppLine| >= 3 (sorted by gap desc)
        var crTop10Regular = crPitches.filter(function(p){
          return p.ppLine!=null && Math.abs(p.line - p.ppLine) >= 3;
        }).sort(function(a,b){return Math.abs(b.line-b.ppLine)-Math.abs(a.line-a.ppLine);});
        var crRegularOUHit=0, crRegularOUTotal=0;
        for(var ri=0;ri<crTop10Regular.length;ri++){
          if(crTop10Regular[ri].actualStats && crTop10Regular[ri].ppLine!=null){
            crRegularOUTotal++;
            if(crTop10Regular[ri].ouHit) crRegularOUHit++;
          }
        }
        // Goblin OVER picks: pitchers where proj - goblinLine >= 5.5 (sorted by gap desc)
        var crGoblinPicks = crPitches.filter(function(p){
          return p.goblinLine!=null && (p.line - p.goblinLine) >= 5.5;
        }).sort(function(a,b){return (b.line-b.goblinLine)-(a.line-a.goblinLine);});
        var crGoblinHit=0, crGoblinTotal=0;
        for(var gi=0;gi<crGoblinPicks.length;gi++){
          if(crGoblinPicks[gi].actualStats){
            crGoblinTotal++;
            if(crGoblinPicks[gi].goblinHit) crGoblinHit++;
          }
        }
        // Legacy pitch summaries for season tracking
        var crPitchesHit=0, crPitchesProjHit=0, crBGradePitches=0;
        for(var cpi2=0;cpi2<crPitches.length;cpi2++){
          if(crPitches[cpi2].actualStats){
            crBGradePitches++;
            if(crPitches[cpi2].hit) crPitchesHit++;
            if(crPitches[cpi2].projHit) crPitchesProjHit++;
          }
        }

        setResultsData({
          picks:crPicks, pitcherPicks:crPitchers, date:dateStr, usedSnapshot:true, snapshotSource:"cloud-results",
          avgFantasy:crPicks.length>0?(crTotalFantasy/crPicks.length).toFixed(1):"0",
          totalFantasy:crTotalFantasy,
          hitRate:crBGradeBatters>0?((crHitCount/crBGradeBatters)*100).toFixed(0):"0",
          pitcherOverRate:crPitchersWithStats>0?((crPitcherOver/crPitchersWithStats)*100).toFixed(0):"0",
          avgPitcherK:crPitchersWithStats>0?(crTotalK/crPitchersWithStats).toFixed(1):"0",
          totalPitcherK:crTotalK, pitchersWithStats:crPitchersWithStats, pitcherOverCount:crPitcherOver,
          pitchPicks:crPitches,
          top10Regular:crTop10Regular,
          regularOUHit:crRegularOUHit, regularOUTotal:crRegularOUTotal,
          regularOURate:crRegularOUTotal>0?((crRegularOUHit/crRegularOUTotal)*100).toFixed(0):"0",
          goblinPicks:crGoblinPicks,
          goblinHit:crGoblinHit, goblinTotal:crGoblinTotal,
          goblinHitRate:crGoblinTotal>0?((crGoblinHit/crGoblinTotal)*100).toFixed(0):"0",
          pitchesHitRate:crBGradePitches>0?((crPitchesHit/crBGradePitches)*100).toFixed(0):"0",
          pitchesProjHitRate:crBGradePitches>0?((crPitchesProjHit/crBGradePitches)*100).toFixed(0):"0",
          pitchesHitCount:crPitchesHit,
          pitchesProjHitCount:crPitchesProjHit,
          bGradePitches:crBGradePitches
        });

        setResultsProgress("");
        setResultsLoading(false);
        return;
      }

      // No cloud results available for this date
      setResultsData({picks:[], pitcherPicks:[], pitchPicks:[], date:dateStr, noCloudData:true});
      setResultsProgress("");
    }catch(e){
      setResultsProgress("Error: " + e.message);
    }
    setResultsLoading(false);
  }

  async function loadMatchups(game){

    setMatchups([]);
    setPitcherSeasonStats({});
    setPitcherExtras({});
    setGameWeather(null);
    setLoading(true);
    setError(null);

      var awayId=game.teams.away.team.id;
      var homePitcher=game.teams.home.probablePitcher;
      var awayPitcher=game.teams.away.probablePitcher;

      // Determine if day game
      var gameHour=new Date(game.gameDate).getHours();
      var isDayGame=gameHour<17;

      var both=await Promise.all([getRoster(homeId),getRoster(awayId)]);
      var homeRoster=both[0];
      var awayRoster=both[1];

      // Fetch pitcher season stats + extras (including venue) + team K rates in parallel

      var pExtras={};
      var tkRates={};

        pf.push(getSeasonStats(homePitcher.id,"pitching").then(function(s){pitcherStats[homePitcher.id]=s;}));
        pf.push(fetchAllPitcherExtras(homePitcher.id,true,isDayGame,homeId).then(function(e){pExtras[homePitcher.id]=e;}));
      }
      if(awayPitcher){
        pf.push(getSeasonStats(awayPitcher.id,"pitching").then(function(s){pitcherStats[awayPitcher.id]=s;}));
        pf.push(fetchAllPitcherExtras(awayPitcher.id,false,isDayGame,homeId).then(function(e){pExtras[awayPitcher.id]=e;}));

      setPitcherSeasonStats(pitcherStats);
      setPitcherExtras(pExtras);
      setTeamKRates(tkRates);
      setGameWeather(weatherData);

      var results=[];

            if(pitcherStats[homePitcher.id]) extras.pitcherStat=pitcherStats[homePitcher.id];
            var esResult=computeEdgeScore(r[0],r[1],r[0].plateAppearances,r[2],weatherData,extras);
            results.push({batter:batter.person,pitcher:homePitcher,pitcherTeam:game.teams.home.team.name,
              batterTeam:game.teams.away.team.abbreviation||game.teams.away.team.name,
              side:"away",stat:r[0],seasonStat:r[1],venueStat:r[2],
              edgeScore:esResult.score,parkDelta:esResult.parkDelta,weatherDelta:esResult.weatherDelta,batterKHistory:r[3]});
          }
        }
      }
      if(awayPitcher){
        for(var j=0;j<homeRoster.length;j++){
          var batter2=homeRoster[j];
          var r2=await Promise.all([
            getBvPSplits(batter2.person.id,awayPitcher.id),
            getSeasonStats(batter2.person.id,"hitting"),
            safeVenueStat(batter2.person.id,homeId,true,"hitting"),
            getBatterKRateHistory(batter2.person.id),
            getBatterRecentForm(batter2.person.id),
            getBatterPlatoonSplits(batter2.person.id)
          ]);
          done++;
          setProgress("Querying "+done+"/"+total+" matchups...");
          if(r2[0]&&(r2[0].plateAppearances||0)>=1){
            var parkRunFactor2=getParkRunFactor(venueId);
            var teamGP2=game.teams.home.gamesPlayed||162;
            var playingTimeRisk2=getPlayingTimeRisk(r2[1],teamGP2);
            var extras2={pitcherStat:pitcherStats[awayPitcher.id],recentForm:r2[4],platoonSplit:r2[5],pitcherHand:null,parkRunFactor:parkRunFactor2.factor,playingTimeRisk:playingTimeRisk2};
            if(pitcherStats[awayPitcher.id]) extras2.pitcherStat=pitcherStats[awayPitcher.id];
            var esResult2=computeEdgeScore(r2[0],r2[1],r2[0].plateAppearances,r2[2],weatherData,extras2);
            results.push({batter:batter2.person,pitcher:awayPitcher,pitcherTeam:game.teams.away.team.name,
              batterTeam:game.teams.home.team.abbreviation||game.teams.home.team.name,
              side:"home",stat:r2[0],seasonStat:r2[1],venueStat:r2[2],
              edgeScore:esResult2.score,parkDelta:esResult2.parkDelta,weatherDelta:esResult2.weatherDelta,batterKHistory:r2[3]});
          }
        }
      }
      setMatchups(results);

      // Compute whiff scores for both pitchers
      var whiffResults = {};
      if(homePitcher && results.length > 0){
        var homeMatchups = results.filter(function(m){return m.pitcher.id === homePitcher.id;});
        var oppKRate = tkRates[awayId] ? tkRates[awayId].kRate : 0.200;
        var whiffRes = computeWhiffScore(homePitcher, pitcherStats[homePitcher.id], pExtras[homePitcher.id], oppKRate, homeMatchups);
        whiffRes.oppTeamKRate = oppKRate;
        whiffResults[homePitcher.id] = whiffRes;
      }
      if(awayPitcher && results.length > 0){
        var awayMatchups = results.filter(function(m){return m.pitcher.id === awayPitcher.id;});
        var oppKRate2 = tkRates[homeId] ? tkRates[homeId].kRate : 0.200;
        var whiffRes2 = computeWhiffScore(awayPitcher, pitcherStats[awayPitcher.id], pExtras[awayPitcher.id], oppKRate2, awayMatchups);
        whiffRes2.oppTeamKRate = oppKRate2;
        whiffResults[awayPitcher.id] = whiffRes2;
      }
      setWhiffScores(whiffResults);

      setProgress("");
    }catch(e){
      setError("Error loading matchup data: "+e.message);
    }
    setLoading(false);
  }

  var filtered = useMemo(function(){
    var f=matchups.filter(function(m){return (m.stat.plateAppearances||0)>=minPA;});
    if(expandedSide!=="both") f=f.filter(function(m){return m.side===expandedSide;});
    f.sort(function(a,b){
      if(sortBy==="edge") return (b.edgeScore||0)-(a.edgeScore||0);
      if(sortBy==="avg") return (parseFloat(b.stat.avg)||0)-(parseFloat(a.stat.avg)||0);
      if(sortBy==="ops") return (parseFloat(b.stat.ops)||0)-(parseFloat(a.stat.ops)||0);
      if(sortBy==="hr") return (b.stat.homeRuns||0)-(a.stat.homeRuns||0);
      if(sortBy==="pa") return (b.stat.plateAppearances||0)-(a.stat.plateAppearances||0);
      return 0;
    });
    return f;
  },[matchups,minPA,expandedSide,sortBy]);

  var coldMatchups=filtered.filter(function(m){return parseFloat(m.stat.avg)<0.200;});

        vsTeam:selectedGame.teams.away.team.name,seasonStat:pitcherSeasonStats[hp.id],

  return(

                    <button className="sort-btn" onClick={function(){setShowSeason(!showSeason);}}
                      style={{padding:"4px 9px",fontSize:10,background:showSeason?C.purple:C.card,color:showSeason?"#000":C.text,border:"1px solid "+(showSeason?C.purple:C.border),borderRadius:4,cursor:"pointer",fontFamily:"'DM Mono',monospace",marginLeft:4}}>
                      {showSeason?"SEASON ✓":"SEASON"}
                    </button>
                    <button className="sort-btn" onClick={function(){setShowPark(!showPark);}}
                      style={{padding:"4px 9px",fontSize:10,background:showPark?C.orange:C.card,color:showPark?"#000":C.text,border:"1px solid "+(showPark?C.orange:C.border),borderRadius:4,cursor:"pointer",fontFamily:"'DM Mono',monospace",marginLeft:4}}>
                      {showPark?"🏟 PARK ✓":"🏟 PARK"}
                    </button>
                  </div>

                  {loading&&(
                    <div style={{textAlign:"center",padding:48,color:C.muted}}>
                      <div style={{fontSize:32,marginBottom:12}} className="loading-pulse">⚙️</div>
                      <div style={{fontSize:13,letterSpacing:2}}>LOADING MATCHUP DATA...</div>
                      <div style={{fontSize:11,marginTop:8,color:C.subtext}}>{progress||"Querying MLB Stats API..."}</div>
                      <div style={{width:200,height:3,background:C.border,borderRadius:2,margin:"12px auto 0",overflow:"hidden"}}>
                        <div style={{height:"100%",background:C.gold,borderRadius:2,transition:"width 0.3s",

                  {!loading&&matchups.length===0&&!error&&(

                      <TopEdgesBanner matchups={filtered}/>

                        <div style={{marginBottom:20}} className="fade-in">
                          <div style={{fontSize:10,letterSpacing:2,color:C.green,marginBottom:8}}>🔥 HOT MATCHUPS <span style={{color:C.muted}}>(.300+ BvP AVG)</span></div>

                  {!loading&&matchups.length>0&&viewMode==="pitcher"&&(
                    <div className="fade-in">

                          <th style={{textAlign:"center",padding:"10px 8px",color:C.blue,fontWeight:500,letterSpacing:1}}>PP O/U %</th>
                          <th style={{textAlign:"center",padding:"10px 8px",color:C.green,fontWeight:500,letterSpacing:1}}>GOBLIN %</th>
                          <th style={{textAlign:"center",padding:"10px 8px",color:C.muted,fontWeight:500,letterSpacing:1}}>BATTERS</th>
                          <th style={{textAlign:"center",padding:"10px 8px",color:C.muted,fontWeight:500,letterSpacing:1}}>PITCHERS</th>
                        </tr>
                      </thead>
                      <tbody>
                        {seasonHistory.slice().reverse().map(function(d,idx){
                          return(
                            <tr key={d.date} style={{borderBottom:"1px solid "+C.border}}>
                              <td style={{padding:"8px",color:C.text}}>{d.date}</td>
                              <td style={{padding:"8px",textAlign:"center",fontWeight:600,color:d.batterHitRate>=60?C.green:d.batterHitRate>=40?C.gold:C.red}}>{d.batterHitRate.toFixed(1)}%</td>
                              <td style={{padding:"8px",textAlign:"center",fontWeight:600,color:d.pitcherOverRate>=60?C.green:d.pitcherOverRate>=40?C.purple:C.red}}>{d.pitcherOverRate.toFixed(1)}%</td>
                              <td style={{padding:"8px",textAlign:"center",fontWeight:600,color:(d.regularOURate||0)>=60?C.green:(d.regularOURate||0)>=40?C.blue:C.red}}>{(d.regularOURate||0).toFixed(1)}%</td>
                              <td style={{padding:"8px",textAlign:"center",fontWeight:600,color:(d.goblinHitRate||0)>=60?C.green:(d.goblinHitRate||0)>=40?C.green+"99":C.red}}>{(d.goblinHitRate||0).toFixed(1)}%</td>
                              <td style={{padding:"8px",textAlign:"center",color:C.muted}}>{d.batterCount}</td>
                              <td style={{padding:"8px",textAlign:"center",color:C.muted}}>{d.pitcherCount}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      </div>

      {/* ── Footer ── */}
      <div style={{borderTop:"1px solid "+C.border,padding:"6px 24px",display:"flex",justifyContent:"space-between",fontSize:9,color:C.muted,background:"#0d1220",flexShrink:0}}>
        <span>Data via MLB Stats API · Career BvP splits + {new Date().getFullYear()} season stats</span>
        <span>Edge scores are weighted composites — not financial advice</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

// Register service worker for PWA
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
