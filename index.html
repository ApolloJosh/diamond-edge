/* ─── Weather Functions ─── */
async function fetchWeather(lat, lon, gameDate){
  try{
    var dateStr = gameDate ? new Date(gameDate).toISOString().slice(0,10) : new Date().toISOString().slice(0,10);
    var url = "https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon
      +"&hourly=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m"
      +"&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FChicago"
      +"&start_date="+dateStr+"&end_date="+dateStr;
    var resp = await fetch(url);
    var data = await resp.json();
    if(!data.hourly) return null;
    // Use ~7pm local (index 19) for night games, ~2pm (index 14) for day
    var gameHour = gameDate ? new Date(gameDate).getHours() : 19;
    var idx = gameHour < 17 ? 14 : 19;
    if(idx >= data.hourly.time.length) idx = data.hourly.time.length - 1;
    return {
      temp: Math.round(data.hourly.temperature_2m[idx]),
      humidity: Math.round(data.hourly.relative_humidity_2m[idx]),
      windSpeed: Math.round(data.hourly.wind_speed_10m[idx]),
      windDir: Math.round(data.hourly.wind_direction_10m[idx])
    };
  }catch(e){ return null; }
}

function computeWindEffect(windDir, windSpeed, stadiumBearing){
  // windDir = meteorological (direction wind comes FROM, in degrees)
  // stadiumBearing = direction from home plate to center field
  // "blowing out" = wind traveling FROM home plate TOWARD center field
  // Wind blows TO = (windDir + 180) % 360
  var windTo = (windDir + 180) % 360;
  var diff = windTo - stadiumBearing;
  // Normalize to -180..180
  if(diff > 180) diff -= 360;
  if(diff < -180) diff += 360;
  var absDiff = Math.abs(diff);

  var direction, factor;
  if(absDiff <= 45){
    direction = "OUT";
    // Scale: 0° diff = full effect, 45° = half
    factor = 1.0 - (absDiff / 90);
  } else if(absDiff >= 135){
    direction = "IN";
    factor = -(1.0 - ((180 - absDiff) / 90));
  } else {
    direction = "CROSS";
    factor = 0;
  }

  // Compute score adjustment: wind speed matters
  // Light wind (<5mph) = minimal effect, strong (>15mph) = big effect
  var magnitude = Math.min(windSpeed / 15, 1.5);
  var scoreAdj = Math.round(factor * magnitude * 8); // max ~±12

  return {direction: direction, scoreAdj: scoreAdj, windSpeed: windSpeed, windDir: windDir};
}

async function getGameWeather(venueId, gameDate){
  var venue = VENUE_DATA[venueId];
  if(!venue) return null;
  var raw = await fetchWeather(venue.lat, venue.lon, gameDate);
  if(!raw) return null;
  var isDome = venue.dome === true;
  var isRetractable = venue.retractable === true;
  var wind = isDome ? {direction:"DOME",scoreAdj:0} : computeWindEffect(raw.windDir, raw.windSpeed, venue.bearing);
  return {
    temp: raw.temp,
    humidity: raw.humidity,
    windSpeed: isDome ? 0 : raw.windSpeed,
    windDirDeg: raw.windDir,
    windLabel: isDome ? "DOME" : (isRetractable ? wind.direction+"*" : wind.direction),
    windScoreAdj: isDome ? 0 : wind.scoreAdj,
    venueName: venue.name,
    isDome: isDome,
    isRetractable: isRetractable
  };
}

/* ─── Helpers ─── */
function statColor(avg){
  if(!avg||avg==="---") return C.subtext;
  const v=parseFloat(avg);
  if(v>=0.350) return "#22c55e";
  if(v>=0.300) return "#86efac";
  if(v>=0.250) return C.text;
  if(v>=0.200) return "#fca5a5";
  return "#ef4444";
}
function fmtAvg(val){
  if(val===null||val===undefined||val==="") return "---";
  const v=parseFloat(val);
  if(isNaN(v)) return "---";
  return v.toFixed(3).replace(/^0/,"");
}
function fmtOps(val){
  if(val===null||val===undefined||val==="") return "---";
  const v=parseFloat(val);
  if(isNaN(v)) return "---";
  return v.toFixed(3);
}
function fmtEra(val){
  if(val===null||val===undefined||val==="") return "---";
  const v=parseFloat(val);
  if(isNaN(v)) return "---";
  return v.toFixed(2);
}
function eraColor(era){
  if(!era||era==="---") return C.subtext;
  const v=parseFloat(era);
  if(v<=2.50) return "#22c55e";
  if(v<=3.50) return "#86efac";
  if(v<=4.50) return C.text;
  if(v<=5.50) return "#fca5a5";
  return "#ef4444";
}

/* ─── Edge Score Engine ─── */
function computeEdgeScore(bvpStat, seasonStat, pa, venueStat, weather, extras){
  // V2 Edge Score — rebalanced to reward "good hitters with BvP history"
  // Old: BvP dominated (~60% of score). New: Hitter quality ~40%, BvP ~30%, context ~30%
  if(!bvpStat) return {score:0, parkDelta:0, weatherDelta:0};

  // ── COMPONENT 1: HITTER QUALITY BASE (up to ~45 pts above baseline) ──
  // V2.1: wider range for more differentiation (was 40 base, ±12/±10 caps)
  // Season stats are the foundation — a .300/.900 hitter starts high, .220/.600 starts low
  var hitterBase = 45; // raised from 40 — gives more room for good hitters to separate
  if(seasonStat){
    var sAvg = parseFloat(seasonStat.avg)||0.240;
    var sOps = parseFloat(seasonStat.ops)||0.700;
    var sSlg = parseFloat(seasonStat.slg)||0.380;
    // AVG component: scale from .200 to .320 → -12 to +15 (widened from ±10/12)
    hitterBase += Math.max(-12, Math.min(15, (sAvg - 0.250) * 190));
    // OPS component: scale from .600 to .900 → -10 to +13 (widened from ±8/10)
    hitterBase += Math.max(-10, Math.min(13, (sOps - 0.720) * 60));
    // SLG bonus for power (doubles/HR hitters are more likely to get a hit+extra bases)
    if(sSlg >= 0.500) hitterBase += 5;
    else if(sSlg >= 0.440) hitterBase += 2;
    else if(sSlg < 0.330) hitterBase -= 4;
  }

  // Recent form: hot/cold streaks (last 7-10 games)
  if(extras && extras.recentForm){
    var rAvg = extras.recentForm.avg;
    var rOPS = extras.recentForm.ops;
    // Stronger weight than V1 — hot hitters stay hot
    if(rOPS >= 1.000) hitterBase += 8;
    else if(rAvg >= 0.330 || rOPS >= 0.900) hitterBase += 6;
    else if(rAvg >= 0.280 || rOPS >= 0.800) hitterBase += 2;
    else if(rAvg < 0.150) hitterBase -= 8;
    else if(rAvg < 0.200) hitterBase -= 5;
  }

  // ── COMPONENT 2: BvP MATCHUP (up to ~25 pts, heavily sample-weighted) ──
  var bvpAvg = parseFloat(bvpStat.avg)||0;
  var bvpOps = parseFloat(bvpStat.ops)||0;
  var bvpPA = parseInt(pa)||parseInt(bvpStat.plateAppearances)||0;

  // Raw BvP signal (before sample dampening)
  var bvpRaw = 0;
  bvpRaw += (bvpAvg - 0.250) * 60;  // was *100 — reduced
  bvpRaw += (bvpOps - 0.700) * 15;  // was *25 — reduced

  var hrs = parseInt(bvpStat.homeRuns)||0;
  if(hrs >= 3) bvpRaw += 6;
  else if(hrs >= 1) bvpRaw += 3;
  var abs = parseInt(bvpStat.atBats)||1;
  var ks = parseInt(bvpStat.strikeOuts)||0;
  var kRate = ks/abs;
  if(kRate > 0.40) bvpRaw -= 6;
  else if(kRate > 0.30) bvpRaw -= 3;

  // Sample size dampening — MUCH harsher on small samples
  // Idea: BvP in <5 PA is nearly noise. 5-10 is suggestive. 15+ is real. 25+ is very real.
  var sampleFactor = 0;
  if(bvpPA < 3) sampleFactor = 0.10;       // 2 PA = basically ignore BvP
  else if(bvpPA < 5) sampleFactor = 0.20;  // 3-4 PA = barely trust it
  else if(bvpPA < 8) sampleFactor = 0.35;  // 5-7 PA = slight signal
  else if(bvpPA < 12) sampleFactor = 0.55; // 8-11 PA = moderate
  else if(bvpPA < 20) sampleFactor = 0.75; // 12-19 PA = solid
  else if(bvpPA < 30) sampleFactor = 0.90; // 20-29 PA = strong
  else sampleFactor = 1.0;                 // 30+ PA = full weight

  var bvpComponent = bvpRaw * sampleFactor;
  // Cap BvP contribution so it can't single-handedly make a bad hitter elite
  bvpComponent = Math.max(-15, Math.min(25, bvpComponent));

  // ── COMPONENT 3: PITCHER QUALITY CONTEXT (up to ±15 pts — widened from ±12) ──
  var pitcherDelta = 0;
  if(extras && extras.pitcherStat){
    var pERA = parseFloat(extras.pitcherStat.era)||4.50;
    var pK9 = parseFloat(extras.pitcherStat.strikeoutsPer9Inn)||8.0;
    var pWHIP = parseFloat(extras.pitcherStat.whip)||1.30;
    if(pERA <= 2.50) pitcherDelta -= 9;      // was -7
    else if(pERA <= 3.25) pitcherDelta -= 5;  // was -4
    else if(pERA <= 3.75) pitcherDelta -= 2;  // was -1
    else if(pERA >= 5.50) pitcherDelta += 9;  // was +7
    else if(pERA >= 4.50) pitcherDelta += 5;  // was +4
    else if(pERA >= 4.00) pitcherDelta += 2;
    if(pK9 >= 11.0) pitcherDelta -= 5;       // was -4
    else if(pK9 >= 9.5) pitcherDelta -= 2;
    if(pWHIP >= 1.50) pitcherDelta += 5;      // was +4
    else if(pWHIP >= 1.35) pitcherDelta += 2;
  }

  // ── COMPONENT 4: PLATOON ADVANTAGE (up to ±6 pts) ──
  var platoonDelta = 0;
  if(extras && extras.platoonSplit && extras.pitcherHand){
    var hand = extras.pitcherHand;
    var relevantSplit = (hand === "L") ? extras.platoonSplit.vsLeft : extras.platoonSplit.vsRight;
    if(relevantSplit){
      var splitOPS = parseFloat(relevantSplit.ops)||0.700;
      if(splitOPS >= 0.900) platoonDelta += 6;
      else if(splitOPS >= 0.800) platoonDelta += 3;
      else if(splitOPS <= 0.550) platoonDelta -= 6;
      else if(splitOPS <= 0.650) platoonDelta -= 3;
    }
  }

  // ── COMPONENT 5: PARK + WEATHER (up to ±8 pts) ──
  var parkFactorDelta = 0;
  if(extras && extras.parkRunFactor){
    var factor = extras.parkRunFactor;
    if(factor >= 1.08) parkFactorDelta = 5;
    else if(factor >= 1.04) parkFactorDelta = 3;
    else if(factor >= 1.02) parkFactorDelta = 1;
    else if(factor <= 0.93) parkFactorDelta = -5;
    else if(factor <= 0.96) parkFactorDelta = -3;
    else if(factor <= 0.98) parkFactorDelta = -1;
  }

  var playingTimeRiskDelta = 0;
  if(extras && extras.playingTimeRisk){
    playingTimeRiskDelta = extras.playingTimeRisk;
  }

  // Venue-specific BvP at park (keep but cap at ±6)
  var parkDelta = 0;
  if(venueStat && venueStat.gamesPlayed >= 5){
    var vOps = parseFloat(venueStat.stat.ops)||0;
    var vFactor = Math.min(venueStat.gamesPlayed / 20, 1.0);
    var raw = 0;
    if(vOps >= 0.900) raw = 8;
    else if(vOps >= 0.800) raw = 5;
    else if(vOps >= 0.720) raw = 2;
    else if(vOps < 0.500) raw = -8;
    else if(vOps < 0.600) raw = -5;
    else if(vOps < 0.660) raw = -2;
    parkDelta = Math.round(raw * vFactor);
    parkDelta = Math.max(-6, Math.min(6, parkDelta));
  }

  var weatherDelta = 0;
  if(weather && weather.windScoreAdj){
    weatherDelta = weather.windScoreAdj;
  }
  if(weather && weather.temp){
    if(weather.temp >= 90) weatherDelta += 3;
    else if(weather.temp >= 80) weatherDelta += 1;
    else if(weather.temp <= 45) weatherDelta -= 3;
    else if(weather.temp <= 55) weatherDelta -= 1;
  }

  // ── COMBINE ALL COMPONENTS ──
  var score = hitterBase + bvpComponent + pitcherDelta + platoonDelta + parkFactorDelta + playingTimeRiskDelta + parkDelta + weatherDelta;
  return {score:Math.max(0, Math.min(99, Math.round(score))), parkDelta:parkDelta, weatherDelta:weatherDelta};
}
function edgeGrade(score){
  if(score >= 80) return {grade:"A+",color:"#22c55e"};
  if(score >= 70) return {grade:"A",color:"#4ade80"};
  if(score >= 62) return {grade:"B+",color:"#86efac"};
  if(score >= 55) return {grade:"B",color:C.text};
  if(score >= 45) return {grade:"C",color:C.subtext};
  if(score >= 35) return {grade:"D",color:"#fca5a5"};
  return {grade:"F",color:"#ef4444"};
}
function pitcherEdgeScore(matchups, extras){
  if(!matchups||matchups.length===0) return 50;
  const totalPA = matchups.reduce((s,m)=>s+(parseInt(m.stat.plateAppearances)||0),0);
  const totalAB = matchups.reduce((s,m)=>s+(parseInt(m.stat.atBats)||0),0);
  const totalH = matchups.reduce((s,m)=>s+(parseInt(m.stat.hits)||0),0);
  const totalK = matchups.reduce((s,m)=>s+(parseInt(m.stat.strikeOuts)||0),0);
  const totalHR = matchups.reduce((s,m)=>s+(parseInt(m.stat.homeRuns)||0),0);
  const totalBB = matchups.reduce((s,m)=>s+(parseInt(m.stat.baseOnBalls)||0),0);
  if(totalAB===0) return 50;
  const avgAgainst = totalH/totalAB;
  const kRate = totalK/totalAB;
  const bbRate = totalBB/totalPA;
  const hrRate = totalHR/totalAB;
  let score = 50;
  score += (0.250 - avgAgainst) * 120;
  score += (kRate - 0.22) * 60;
  score += (0.08 - bbRate) * 40;
  score += (0.03 - hrRate) * 80;
  const sampleFactor = Math.min(totalPA / 60, 1.3);
  score = 50 + (score - 50) * sampleFactor;

  // Home/Road split bonus (extras.splitStat = the relevant home or away split)
  if(extras && extras.splitStat){
    var splitEra = parseFloat(extras.splitStat.era);
    if(!isNaN(splitEra)){
      if(splitEra <= 2.80) score += 6;
      else if(splitEra <= 3.50) score += 3;
      else if(splitEra >= 5.50) score -= 5;
      else if(splitEra >= 4.80) score -= 3;
    }
  }
  // Day/Night split bonus
  if(extras && extras.dayNightStat){
    var dnEra = parseFloat(extras.dayNightStat.era);
    if(!isNaN(dnEra)){
      if(dnEra <= 2.80) score += 4;
      else if(dnEra <= 3.50) score += 2;
      else if(dnEra >= 5.50) score -= 4;
      else if(dnEra >= 4.80) score -= 2;
    }
  }
  // Recent starts trend bonus
  if(extras && extras.lastThree){
    var l3era = parseFloat(extras.lastThree.era);
    if(!isNaN(l3era)){
      if(l3era <= 2.00) score += 7;
      else if(l3era <= 3.00) score += 4;
      else if(l3era <= 3.80) score += 1;
      else if(l3era >= 7.00) score -= 7;
      else if(l3era >= 5.50) score -= 4;
      else if(l3era >= 4.50) score -= 1;
    }
  }
  // Ballpark factor — how does this pitcher perform at this venue?
  var parkDelta = 0;
  if(extras && extras.venueStat && (extras.venueStat.gamesPlayed||0) >= 3){
    var vEra = parseFloat(extras.venueStat.stat.era);
    if(!isNaN(vEra)){
      var vFactor = Math.min((extras.venueStat.gamesPlayed||0) / 10, 1.0);
      var raw = 0;
      if(vEra <= 2.50) raw = 10;
      else if(vEra <= 3.25) raw = 6;
      else if(vEra <= 3.80) raw = 3;
      else if(vEra >= 7.00) raw = -10;
      else if(vEra >= 5.50) raw = -6;
      else if(vEra >= 4.80) raw = -3;
      parkDelta = Math.round(raw * vFactor);
      score += parkDelta;
    }
  }
  return {score:Math.max(0, Math.min(99, Math.round(score))), parkDelta:parkDelta};
}

function computeWhiffScore(pitcher, seasonStat, extras, oppTeamKRate, matchups){
  if(!pitcher) return {score:50, factors:{}};
  var score = 50;
  var factors = {};

  // 1. Pitcher K/9
  var k9 = parseFloat(seasonStat && seasonStat.strikeoutsPer9Inn)||0;
  if(k9 >= 10.0) factors.pitcherK9 = 12;
  else if(k9 >= 9.0) factors.pitcherK9 = 8;
  else if(k9 >= 8.0) factors.pitcherK9 = 4;
  else if(k9 < 6.0) factors.pitcherK9 = -8;
  else if(k9 < 7.0) factors.pitcherK9 = -4;
  else factors.pitcherK9 = 0;
  score += factors.pitcherK9;

  // 2. Opposing team K rate
  if(oppTeamKRate >= 0.260) factors.oppTeamK = 10;
  else if(oppTeamKRate >= 0.240) factors.oppTeamK = 6;
  else if(oppTeamKRate >= 0.220) factors.oppTeamK = 3;
  else if(oppTeamKRate < 0.180) factors.oppTeamK = -8;
  else if(oppTeamKRate < 0.200) factors.oppTeamK = -4;
  else factors.oppTeamK = 0;
  score += factors.oppTeamK;

  // 3. BvP K rate vs this lineup
  var totalAB = 0, totalK = 0;
  if(matchups && Array.isArray(matchups)){
    for(var m of matchups){
      totalAB += parseInt(m.stat.atBats)||0;
      totalK += parseInt(m.stat.strikeOuts)||0;
    }
  }
  var bvpKRate = totalAB > 0 ? (totalK / totalAB) : 0;
  if(bvpKRate >= 0.30) factors.bvpK = 10;
  else if(bvpKRate >= 0.25) factors.bvpK = 6;
  else if(bvpKRate >= 0.20) factors.bvpK = 3;
  else if(bvpKRate < 0.12) factors.bvpK = -8;
  else if(bvpKRate < 0.15) factors.bvpK = -4;
  else factors.bvpK = 0;
  score += factors.bvpK;

  // 4. Park ERA as K-friendliness proxy
  factors.parkK = 0;
  if(extras && extras.venueStat && (extras.venueStat.gamesPlayed||0) >= 3){
    var parkEra = parseFloat(extras.venueStat.stat.era)||0;
    if(parkEra <= 3.00) factors.parkK = 4;
    else if(parkEra >= 5.00) factors.parkK = -4;
  }
  score += factors.parkK;

  // 5. Home/Road split K/9
  factors.splitK = 0;
  if(extras && extras.splitStat){
    var splitK9 = parseFloat(extras.splitStat.strikeoutsPer9Inn)||0;
    if(splitK9 >= 9.5) factors.splitK = 4;
    else if(splitK9 <= 6.5) factors.splitK = -4;
  }
  score += factors.splitK;

  // 6. Recent starts K/9
  factors.recentK = 0;
  if(extras && extras.lastThree){
    var l3K9 = parseFloat(extras.lastThree.kPer9)||0;
    if(l3K9 >= 10.0) factors.recentK = 6;
    else if(l3K9 >= 9.0) factors.recentK = 3;
    else if(l3K9 < 6.0) factors.recentK = -6;
    else if(l3K9 < 7.0) factors.recentK = -3;
  }
  score += factors.recentK;

  return {score:Math.max(0, Math.min(99, Math.round(score))), factors:factors, bvpKRate:bvpKRate};
}

function whiffGrade(score){
  if(score >= 80) return {grade:"A+",color:"#c084fc"};
  if(score >= 70) return {grade:"A",color:"#d8b4fe"};

}

/* ─── Pitches-Thrown Engine v2 — Enhanced Multi-Factor Model ─── */
/*
 * WEIGHT ALLOCATION (total = 1.0):
 *   Recent 5 starts avg        0.28  — most predictive single factor
 *   Pitcher P/PA               0.18  — efficiency fingerprint
 *   Opposing team P/PA faced   0.14  — demand-side efficiency
 *   2-year season avg          0.12  — long-term baseline
 *   BvP lineup adjustment      0.08  — matchup-specific edge
 *   Bullpen fatigue            0.07  — leash extension signal
 *   First-pitch strike %       0.05  — pace proxy
 *   Park run factor            0.04  — environment
 *   Lineup handedness split    0.04  — nibble factor
 */

// ── Data Fetchers ──

async function getPitcherRecent5PitchAvg(pitcherId){
  try{
    var year=new Date().getFullYear();
    var both=await Promise.all([
      fetchJSON(BASE+"/people/"+pitcherId+"/stats?stats=gameLog&group=pitching&season="+year),
      fetchJSON(BASE+"/people/"+pitcherId+"/stats?stats=gameLog&group=pitching&season="+(year-1))
    ]);
    var games=[];
    for(var sg of (both[1].stats||[])){
      if(sg.group&&sg.group.displayName==="pitching"){
        for(var sp of (sg.splits||[])) games.push(sp);
      }
    }
    for(var sg2 of (both[0].stats||[])){
      if(sg2.group&&sg2.group.displayName==="pitching"){
        for(var sp2 of (sg2.splits||[])) games.push(sp2);
      }
    }
    var starts = games.filter(function(g){
      var s=g.stat||{};
      return (parseInt(s.gamesStarted)||0)>=1 && (parseFloat(s.inningsPitched)||0)>0;
    });
    var recent=starts.slice(-5);
    if(recent.length===0) return null;
    var total=0, cnt=0;
    for(var gi=0;gi<recent.length;gi++){
      var s=recent[gi].stat||{};
      var p=parseInt(s.numberOfPitches)||parseInt(s.pitchesThrown)||0;
      if(p>0){ total+=p; cnt++; }
    }
    if(cnt===0) return null;
    return {avg:total/cnt, starts:cnt};
  }catch(e){return null;}
}

// Pitcher season pitch profile: avg PC, ERA, WHIP, last 3 starts avg, short start rate
var _pitchProfileCache={};
async function getPitcherPitchProfile(pitcherId){
  if(_pitchProfileCache[pitcherId]) return _pitchProfileCache[pitcherId];
  try{
    var year=new Date().getFullYear();
    var both=await Promise.all([
      fetchJSON(BASE+"/people/"+pitcherId+"/stats?stats=gameLog&group=pitching&season="+year),
      fetchJSON(BASE+"/people/"+pitcherId+"/stats?stats=season&season="+year+"&group=pitching")
    ]);
    // Season aggregates from season endpoint
    var era=null, whip=null;
    if(both[1].stats&&both[1].stats[0]&&both[1].stats[0].splits&&both[1].stats[0].splits[0]){
      var ss=both[1].stats[0].splits[0].stat;
      era=parseFloat(ss.era)||null;
      whip=parseFloat(ss.whip)||null;
    }
    // Game log for per-start pitch counts AND earned runs (for blowup rate)
    var starts=[];
    var startERs=[]; // earned runs per start
    if(both[0].stats){
      for(var si=0;si<both[0].stats.length;si++){
        var sg=both[0].stats[si];
        if(sg.group&&sg.group.displayName==="pitching"&&sg.splits){
          for(var spi=0;spi<sg.splits.length;spi++){
            var sp=sg.splits[spi];
            if(sp.stat&&(parseInt(sp.stat.gamesStarted)||0)>=1){
              var pc=parseInt(sp.stat.numberOfPitches)||parseInt(sp.stat.pitchesThrown)||0;
              if(pc>0) starts.push(pc);
              var er=parseInt(sp.stat.earnedRuns)||0;
              startERs.push(er);
            }
          }
        }
      }
    }
    if(starts.length===0){_pitchProfileCache[pitcherId]=null;return null;}
    var totalPC=starts.reduce(function(a,b){return a+b;},0);
    var seasonAvgPC=totalPC/starts.length;
    var last3=starts.slice(-3);
    var last3Avg=last3.reduce(function(a,b){return a+b;},0)/last3.length;
    var sub75=starts.filter(function(c){return c<75;}).length;
    var shortStartRate=sub75/starts.length;
    // Blowup rate: % of starts giving up 4+ earned runs
    var blowupStarts=startERs.filter(function(er){return er>=4;}).length;
    var blowupRate=starts.length>0?blowupStarts/starts.length:0;
    var result={seasonAvgPC:seasonAvgPC,last3Avg:last3Avg,era:era,whip:whip,
      starts:starts.length,shortStartRate:shortStartRate,sub75:sub75,
      blowupRate:blowupRate,blowupStarts:blowupStarts};
    _pitchProfileCache[pitcherId]=result;
    return result;
  }catch(e){return null;}
}

// Opposing team's P/PA faced (how many pitches do they see per PA as a lineup)
async function getTeamPPAFaced(teamId){
  try{
    var year=new Date().getFullYear();
    var data=await fetchJSON(BASE+"/teams/"+teamId+"/stats?stats=season&season="+year+"&group=hitting");
    for(var sg of (data.stats||[])){
      if(sg.group&&sg.group.displayName==="hitting"){
        var sp=sg.splits&&sg.splits[0];
        if(sp&&sp.stat){
          var s=sp.stat;
          var pa=parseInt(s.plateAppearances)||0;
          // MLB API doesn't always expose pitchesSeen directly, estimate from AB+BB+HBP+SF+SH
          // We'll use atBats and walks as proxy for plate discipline
          var ab=parseInt(s.atBats)||0;
          var bb=parseInt(s.baseOnBalls)||0;
          var k=parseInt(s.strikeOuts)||0;
          var hits=parseInt(s.hits)||0;
          if(pa<50) return null;
          // Higher K% = fewer pitches per PA (Ks average ~4.5 pitches, walks ~5.5, BIP ~3.5)
          var kRate=ab>0?k/ab:0.20;
          var bbRate=pa>0?bb/pa:0.08;
          // Estimate P/PA: league avg ~3.9. High-K teams see fewer, high-BB teams see more
          var estPPA=3.90 - (kRate-0.22)*1.5 + (bbRate-0.08)*3.0;
          return {ppa:Math.max(3.4,Math.min(4.5,estPPA)), pa:pa, kRate:kRate, bbRate:bbRate};
        }
      }
    }
    return null;
  }catch(e){return null;}
}

// Bullpen usage: total pitches thrown by relievers in last 3 games
async function getBullpenFatigue(teamId){
  try{
    var today=new Date().toISOString().slice(0,10);
    var startDate=new Date();
    startDate.setDate(startDate.getDate()-4);
    var start=startDate.toISOString().slice(0,10);
    var sched=await fetchJSON(BASE+"/schedule?sportId=1&teamId="+teamId+"&startDate="+start+"&endDate="+today+"&gameType=R");
    var recentGames=[];
    for(var d of (sched.dates||[])){
      for(var g of (d.games||[])){
        if(g.status&&g.status.detailedState==="Final") recentGames.push(g.gamePk);
      }
    }
    if(recentGames.length===0) return {totalRelPitches:0, games:0, fatigueLevel:"unknown"};
    var last3=recentGames.slice(-3);
    var totalRelPitches=0, totalRelIP=0;
    for(var gi2=0;gi2<last3.length;gi2++){
      var box=await fetchJSON(BASE+"/game/"+last3[gi2]+"/boxscore");
      if(!box||!box.teams) continue;
      for(var tk in box.teams){
        var team=box.teams[tk];
        if(!team.team||team.team.id!==teamId) continue;
        for(var pk in (team.players||{})){
          var pl=team.players[pk];
          if(!pl.stats||!pl.stats.pitching) continue;
          var ps=pl.stats.pitching;
          var gs=parseInt(ps.gamesStarted)||0;
          if(gs>0) continue; // skip starter
          totalRelPitches+=parseInt(ps.numberOfPitches)||parseInt(ps.pitchesThrown)||0;
          totalRelIP+=parseFloat(ps.inningsPitched)||0;
        }
      }
    }
    // League avg: ~60 reliever pitches/game. High = 75+, Low = 45-
    var avgPerGame=last3.length>0?totalRelPitches/last3.length:60;
    var fatigueLevel=avgPerGame>=75?"high":avgPerGame>=60?"medium":"low";
    return {totalRelPitches:totalRelPitches, games:last3.length, avgPerGame:avgPerGame, fatigueLevel:fatigueLevel};
  }catch(e){return {totalRelPitches:0, games:0, fatigueLevel:"unknown"};}
}

          var sp=splits[si];
          if(sp.position&&(sp.position.abbreviation==="RP"||sp.position.type==="Reliever")){
            reliefERA=parseFloat(sp.stat.era);
            reliefWHIP=parseFloat(sp.stat.whip);
          }
        }
      }
    }catch(e){}
    // Fallback: use team pitching stats with adjustment
    if(!reliefERA||isNaN(reliefERA)){
      var data=await fetchJSON(BASE+"/teams/"+teamId+"/stats?stats=season&group=pitching&season="+year);
      var teamPitching=null;
      for(var sg of (data.stats||[])){
        if(sg.group&&sg.group.displayName==="pitching"){
          teamPitching=sg.splits&&sg.splits[0]&&sg.splits[0].stat;
        }
      }
      if(!teamPitching){_bpCache[teamId]={era:4.50,whip:1.35,quality:"average"};return _bpCache[teamId];}
      var teamERA=parseFloat(teamPitching.era)||4.50;
      var teamWHIP=parseFloat(teamPitching.whip)||1.35;
      reliefERA=Math.round((teamERA+0.30)*100)/100;
      reliefWHIP=Math.round((teamWHIP+0.05)*100)/100;
    }
    var bpERA=reliefERA;
    var bpWHIP=reliefWHIP||1.35;
    var quality=bpERA<=3.00?"elite":bpERA<=3.75?"good":bpERA<=4.50?"average":bpERA<=5.50?"poor":"bad";
    var result={era:Math.round(bpERA*100)/100, whip:Math.round(bpWHIP*100)/100, quality:quality};
    _bpCache[teamId]=result;
    return result;
  }catch(e){return {era:4.50, whip:1.35, quality:"average"};}

// ── Game Total Runs Projector V2 ──
function computeGameTotal(params){
  // V2: rebalanced weights, interaction terms, wider range
  // Pitching quality weighted higher than offense (research shows ERA/WHIP more predictive)
  // Uses run differential thinking: good offense vs bad pitching = amplified
  var p=params;
  var LEAGUE_AVG_RPG=4.50; // per team

  // --- TEAM OFFENSE BASE (30% weight) ---
  // Regress only 15% toward mean (less smoothing = wider range)
  var homeRPG=p.homeOffense?p.homeOffense.rpg:LEAGUE_AVG_RPG;
  var awayRPG=p.awayOffense?p.awayOffense.rpg:LEAGUE_AVG_RPG;
  homeRPG=homeRPG*0.85+LEAGUE_AVG_RPG*0.15;
  awayRPG=awayRPG*0.85+LEAGUE_AVG_RPG*0.15;
  var offenseTotal=homeRPG+awayRPG;

  // --- STARTER PITCHING COMPONENT (40% weight) ---
  // ERA is the primary signal — each run of ERA above/below 4.50 = ~0.5 runs to total
  var starterAdj=0;
  var hERA=4.50, aERA=4.50;
  if(p.homeStarter&&p.homeStarter.era!=null) hERA=parseFloat(p.homeStarter.era)||4.50;
  if(p.awayStarter&&p.awayStarter.era!=null) aERA=parseFloat(p.awayStarter.era)||4.50;

  // ERA adjustment: each full run above 4.50 adds ~0.45 runs to game total
  // (away starter ERA affects home team's run scoring and vice versa)
  starterAdj+=(aERA-4.50)*0.45; // bad away starter → home team scores more
  starterAdj+=(hERA-4.50)*0.45; // bad home starter → away team scores more

  // K/9 modifier: high-K pitchers suppress offense beyond what ERA shows
  // Only apply as a dampener on top of ERA, not as primary signal
  if(p.homeWhiff&&typeof p.homeWhiff.score==="number"){
    starterAdj-=(p.homeWhiff.score-55)*0.02; // smaller coefficient than V1
  }
  if(p.awayWhiff&&typeof p.awayWhiff.score==="number"){
    starterAdj-=(p.awayWhiff.score-55)*0.02;
  }

  // --- INTERACTION TERM: offense quality × opposing starter quality ---
  // Good offense vs bad pitcher = amplified run scoring (non-linear)
  // Bad offense vs good pitcher = suppressed more than linear
  var homeOPS=p.homeOffense&&p.homeOffense.ops?p.homeOffense.ops:0.700;
  var awayOPS=p.awayOffense&&p.awayOffense.ops?p.awayOffense.ops:0.700;
  // Home team OPS vs away starter ERA
  if(homeOPS>=0.760&&aERA>=5.00) starterAdj+=0.8; // mismatch: good hitting vs bad pitching
  else if(homeOPS<=0.680&&aERA<=3.50) starterAdj-=0.8; // mismatch: bad hitting vs good pitching
  // Away team OPS vs home starter ERA
  if(awayOPS>=0.760&&hERA>=5.00) starterAdj+=0.8;
  else if(awayOPS<=0.680&&hERA<=3.50) starterAdj-=0.8;

  // --- DUAL-ACE / DUAL-BAD INTERACTION (V2.1) ---
  // When BOTH starters are elite, bullpens come in late with leads to protect = compounded suppression
  // When BOTH starters are bad, game can spiral early = compounded boost
  // Data: "both good" games on 4/26 averaged proj 7.2 vs actual 5.2 (over-projected every one)
  if(hERA<=3.50&&aERA<=3.50) starterAdj-=1.5;       // dual ace — strong suppression
  else if(hERA<=3.00&&aERA<=4.00) starterAdj-=0.5;   // one elite ace, other decent
  else if(aERA<=3.00&&hERA<=4.00) starterAdj-=0.5;
  if(hERA>=5.50&&aERA>=5.50) starterAdj+=1.0;        // both bad — modest boost (not always a slugfest)
  else if(hERA>=5.00&&aERA>=5.00) starterAdj+=0.5;

  // --- BULLPEN COMPONENT (15% weight) ---
  // League avg bullpen ERA ~4.00. Bad bullpen = more runs
  var bpAdj=0;
  if(p.homeBullpen&&p.homeBullpen.era){
    bpAdj+=(p.homeBullpen.era-4.00)*0.20;
  }
  if(p.awayBullpen&&p.awayBullpen.era){
    bpAdj+=(p.awayBullpen.era-4.00)*0.20;
  }

  // --- PARK FACTOR (15% weight — multiplicative) ---
  var parkMult=1.0;
  if(p.parkFactor&&typeof p.parkFactor.factor==="number"){
    parkMult=p.parkFactor.factor;
  }

  // --- COMBINE ---
  var rawTotal=offenseTotal+starterAdj+bpAdj;
  var projected=rawTotal*parkMult;

  // Wider range (3.0 - 16.0) to capture true bimodal distribution
  projected=Math.max(3.0, Math.min(16.0, projected));
  return Math.round(projected*2)/2; // round to nearest 0.5
}

// ── Game Total Confidence Score V2 ──
function computeTotalConfidence(params){
  var score=45;
  // Starter ERA extremes: both aces or both bad = more predictable
  var hERA=params.homeStarter?parseFloat(params.homeStarter.era)||4.5:4.5;
  var aERA=params.awayStarter?parseFloat(params.awayStarter.era)||4.5:4.5;
  if(hERA<=3.00&&aERA<=3.00) score+=15; // two aces = very confident under
  else if(hERA>=5.50&&aERA>=5.50) score+=15; // two bad = very confident over
  else if(hERA<=3.50||aERA<=3.50) score+=5; // at least one ace
  else if(hERA>=5.50||aERA>=5.50) score+=5; // at least one bad starter

  // K/9 agreement with ERA (consistent signal = more confident)
  if(params.homeWhiff&&params.awayWhiff){
    if(params.homeWhiff.score>=70&&params.awayWhiff.score>=70) score+=8;
    else if(params.homeWhiff.score<=40&&params.awayWhiff.score<=40) score+=8;
  }

  // Interaction mismatch bonus: clear offensive advantage vs bad pitching
  var homeOPS=params.homeOffense&&params.homeOffense.ops?params.homeOffense.ops:0.700;
  var awayOPS=params.awayOffense&&params.awayOffense.ops?params.awayOffense.ops:0.700;
  if((homeOPS>=0.760&&aERA>=5.00)||(awayOPS>=0.760&&hERA>=5.00)) score+=8;

  // Bullpen extremes
  if(params.homeBullpen&&params.awayBullpen){
    if(params.homeBullpen.quality==="elite"&&params.awayBullpen.quality==="elite") score+=6;
    else if(params.homeBullpen.quality==="bad"||params.awayBullpen.quality==="bad") score+=6;
    score+=2;
  }
  // Park factor extreme
  if(params.parkFactor){
    var pf=params.parkFactor.factor;
    if(pf>=1.08||pf<=0.93) score+=5;
  }
  // Sample size
  if(params.homeOffense&&params.homeOffense.gamesPlayed>=15) score+=2;
  if(params.awayOffense&&params.awayOffense.gamesPlayed>=15) score+=2;
  return Math.min(99, score);
}

// ── BvP Lineup Adjustment (enhanced) ──

function computeLineupBvPPitchAdj(matchups){
  if(!matchups||matchups.length===0) return 0;
  var totalPA=0, totalAB=0, totalK=0, totalBB=0, totalH=0;
  for(var mi=0;mi<matchups.length;mi++){
    var s=matchups[mi].stat||{};
    totalPA+=parseInt(s.plateAppearances)||0;
    totalAB+=parseInt(s.atBats)||0;
    totalK+=parseInt(s.strikeOuts)||0;
    totalBB+=parseInt(s.baseOnBalls)||0;
    totalH+=parseInt(s.hits)||0;
  }
  if(totalPA<10) return 0;
  var kRate=totalAB>0?(totalK/totalAB):0;
  var bbRate=totalPA>0?(totalBB/totalPA):0;
  var obp=totalPA>0?((totalH+totalBB)/totalPA):0;
  var adj=0;
  if(kRate>=0.28) adj+=4;
  else if(kRate>=0.23) adj+=2;
  else if(kRate<0.15) adj-=2;
  if(bbRate>=0.12) adj+=3;
  else if(bbRate<0.05) adj-=2;
  if(obp>=0.360) adj+=3;
  else if(obp<0.280) adj-=2;
  var sampleFactor=Math.min(totalPA/60, 1);
  return Math.round(adj*sampleFactor);
}

// Lineup handedness mismatch: returns adjustment in pitches
// Pitchers facing opposite-hand-heavy lineups tend to nibble more → higher pitch count
function computeHandednessAdj(pitcherHand, oppRoster){
  if(!pitcherHand||!oppRoster||oppRoster.length===0) return 0;
  var dominated=0; // batters on the dominated side (same hand as pitcher)
  var advantaged=0; // batters with platoon advantage (opposite hand)
  for(var ri=0;ri<oppRoster.length;ri++){
    var bHand=oppRoster[ri].batSide;
    if(!bHand) continue;
    if(bHand==="S") { advantaged+=0.5; dominated+=0.5; continue; } // switch hitters neutral
    if(pitcherHand==="R"&&bHand==="L") advantaged++;
    else if(pitcherHand==="L"&&bHand==="R") advantaged++;
    else dominated++;
  }
  var total=advantaged+dominated;
  if(total<5) return 0;
  var advPct=advantaged/total;
  // League avg ~55% of PAs have platoon advantage. Deviation = adjustment
  if(advPct>=0.70) return 3;  // very heavy platoon advantage lineup
  if(advPct>=0.60) return 1.5;
  if(advPct<=0.35) return -2; // mostly same-hand = pitcher dominates, fewer pitches
  if(advPct<=0.45) return -1;
  return 0;
}

// ── Core Projection Functions ──

function computePitchLine(params){
  // V5.2 model — PP-anchored with OVER-lean correction
  // Key insight: PP lines are set ~5 pitches above pitcher season averages.
  // V5.1 blended too much season/recent data, dragging projections below PP.
  // V5.2 raises PP weight so projections stay closer to the line.
  // When PP line available: 45% PP + 22% seasonAvgPC + 23% recent5 + 10% league mean
  // + blowup risk penalty + deep starter bonus + trend adjustment
  // Fallback (no PP): 40% seasonAvgPC + 35% recent5 + 15% twoYr + 10% league mean
  var p=params;
  var LEAGUE_MEAN=91.5;
  var recent5Avg=(p.recent5&&p.recent5.avg>0)?p.recent5.avg:0;
  var twoYrAvg=(p.twoYr&&p.twoYr.avg>0)?p.twoYr.avg:0;
  var ppLine=(typeof p.ppLine==="number"&&!isNaN(p.ppLine))?p.ppLine:null;
  var profile=p.pitchProfile||null;
  var seasonAvgPC=(profile&&profile.seasonAvgPC>0)?profile.seasonAvgPC:0;
  var last3Avg=(profile&&profile.last3Avg>0)?profile.last3Avg:0;

  var projected=null;

  if(ppLine&&recent5Avg>0&&seasonAvgPC>0){
    // Full V5.2 mode: PP anchor strengthened to 45%
    projected=ppLine*0.45+seasonAvgPC*0.22+recent5Avg*0.23+LEAGUE_MEAN*0.10;
  } else if(ppLine&&recent5Avg>0){
    // Have PP + recent5 but no season profile
    projected=ppLine*0.55+recent5Avg*0.30+LEAGUE_MEAN*0.15;
  } else if(ppLine&&seasonAvgPC>0){
    // Have PP + season profile but no recent5
    projected=ppLine*0.50+seasonAvgPC*0.35+LEAGUE_MEAN*0.15;
  } else {
    // Fallback: no PP line
    var parts=[];
    if(seasonAvgPC>0) parts.push({w:0.40,v:seasonAvgPC});
    if(recent5Avg>0)  parts.push({w:0.35,v:recent5Avg});
    if(twoYrAvg>0)    parts.push({w:0.15,v:twoYrAvg});
    parts.push({w:0.10,v:LEAGUE_MEAN});
    if(parts.length<2) return null;
    var totalW=0,sum=0;
    for(var pi=0;pi<parts.length;pi++){totalW+=parts[pi].w;sum+=parts[pi].w*parts[pi].v;}
    projected=sum/totalW;
  }
  if(projected==null||isNaN(projected)) return null;

  // ── V5.2 adjustments (same structure, reduced penalties) ──

  // Short start / opener detection: pitchers who rarely go 5+ IP
  if(profile&&profile.starts>=2&&seasonAvgPC<65){
    projected=Math.min(projected, 55);
  }
  // High short start rate: volatile pitcher (reduced from -4/-2 to -3/-1.5)
  if(profile&&profile.shortStartRate>0.40&&profile.starts>=3){
    projected-=3;
  } else if(profile&&profile.shortStartRate>0.25&&profile.starts>=3){
    projected-=1.5;
  }

  // Blowup risk penalty: ERA > 5.0 AND season avgPC < 85
  if(profile&&profile.era>5.0&&seasonAvgPC<85){
    var blowupPenalty=-3;
    if(profile.shortStartRate>0.2) blowupPenalty=-5;
    projected+=blowupPenalty;
  }

  // V5.3: Blowup rate penalty — pitchers with 40%+ starts giving up 4+ ER
  // These guys get pulled early regardless of career pitch count averages
  if(profile&&profile.blowupRate>=0.40&&profile.starts>=3){
    // Compounded with short leash: blowup + short start = very likely under
    if(profile.shortStartRate>=0.40) projected-=4;
    else projected-=2.5;
  } else if(profile&&profile.blowupRate>=0.30&&profile.starts>=4){
    projected-=1.5; // moderate blowup tendency
  }

  // V5.3: Game O/U cross-reference — high-scoring games pull weaker starters early
  // If projected game total is 9+ runs, the bad pitcher in that game gets yanked
  var gameTotal=(p.gameTotal&&typeof p.gameTotal==="number")?p.gameTotal:null;
  if(gameTotal&&gameTotal>=9.5&&profile&&profile.era>4.50){
    // Weaker pitcher in a projected shootout → manager pulls early
    projected-=2;
    if(gameTotal>=11) projected-=1; // extreme blowout risk
  } else if(gameTotal&&gameTotal>=9.5&&profile&&profile.era>4.00){
    projected-=1; // decent pitcher but high-scoring game environment
  }

  // Deep starter bonus: season avgPC >= 94
  if(seasonAvgPC>=94){
    projected+=2;
  } else if(seasonAvgPC>=90){
    projected+=1;
  }

  // Trend adjustment: reduced magnitude
  if(last3Avg>0&&seasonAvgPC>0){
    var trendDiff=last3Avg-seasonAvgPC;
    if(trendDiff<-5) projected-=1.5;      // declining trend (was -2)
    else if(trendDiff>5) projected+=1.5;   // hot streak
  }

  return Math.round(projected*2)/2;
}

function computeOverUnder(line, params){
  var projected=computePitchLine(params);
  if(projected==null||isNaN(projected)||isNaN(line)) return null;

  // ── V5.2 O/U Decision Engine ──
  // Key insight from 4/28 data: PP lines are systematically inflated ~5 pitches
  // above season averages. 61% of pitchers went OVER their PP line that day.
  // V5.1 picked UNDER 22/23 times at 43% accuracy — catastrophic.
  //
  // V5.2 strategy:
  //   - proj >= line → OVER (clear signal)
  //   - proj within [line-4, line) → "PP inflation zone" → lean OVER unless
  //     multiple strong UNDER signals converge
  //   - proj < line-4 → genuine UNDER signal, but still check career overrides
  //   - Default tiebreaker → OVER (since PP lines run high)

  var twoYrAvg=(params.twoYr&&params.twoYr.avg>0)?params.twoYr.avg:0;
  var profile=params.pitchProfile||null;
  var seasonAvgPC=(profile&&profile.seasonAvgPC>0)?profile.seasonAvgPC:0;
  var recent5Avg=(params.recent5&&params.recent5.avg>0)?params.recent5.avg:0;

  // ── CLEAR OVER: projection at or above line ──
  if(projected>=line) return "OVER";

  // ── PP INFLATION ZONE: proj is 0-4 below line ──
  // Default OVER — PP lines are set above true averages
  // Only flip to UNDER if there are multiple converging UNDER signals
  if(projected>=line-4){
    var underSignals=0;
    // Signal 1: season avgPC is well below the line
    if(seasonAvgPC>0&&seasonAvgPC<line-3) underSignals++;
    // Signal 2: recent 5 avg is below the line
    if(recent5Avg>0&&recent5Avg<line-2) underSignals++;
    // Signal 3: two-year avg is below the line
    if(twoYrAvg>0&&twoYrAvg<line-3) underSignals++;
    // Signal 4: declining trend (last 3 well below season)
    var last3Avg=(profile&&profile.last3Avg>0)?profile.last3Avg:0;
    if(last3Avg>0&&seasonAvgPC>0&&(last3Avg-seasonAvgPC)<-5) underSignals++;
    // Signal 5: high short start rate
    if(profile&&profile.shortStartRate>0.35&&profile.starts>=3) underSignals++;
    // Signal 6: blowup risk pitcher (ERA > 5.0 and low season avg)
    if(profile&&profile.era>5.0&&seasonAvgPC<85) underSignals++;
    // Signal 7: high blowup rate (40%+ of starts with 4+ ER)
    if(profile&&profile.blowupRate>=0.40&&profile.starts>=3) underSignals++;
    // Signal 8: projected high-scoring game (pitcher likely to get pulled)
    var gameTotal=(params.gameTotal&&typeof params.gameTotal==="number")?params.gameTotal:null;
    if(gameTotal&&gameTotal>=9.5) underSignals++;

    // Need 3+ converging signals to override the OVER lean
    if(underSignals>=3) return "UNDER";
    return "OVER";
  }

  // ── GENUINE UNDER ZONE: proj is 4+ below line ──
  // Likely a real UNDER, but check career/season overrides
  // EXCEPTION: skip career gates if pitcher has high blowup rate (40%+ starts with 4+ ER)
  // Pitchers like Lauer/Bello have inflated career avgs but current-season blowups
  // mean they're getting pulled early — career gates would wrongly flip to OVER
  var hasBlowupPattern=profile&&profile.blowupRate>=0.40&&profile.starts>=3;
  var hasShortLeash=profile&&profile.shortStartRate>=0.40&&profile.starts>=3;
  if(!hasBlowupPattern&&!hasShortLeash){
    // Gate 1: career avg says OVER
    if(twoYrAvg>0&&twoYrAvg>line+3) return "OVER";
    // Gate 2: season avgPC says OVER
    if(seasonAvgPC>0&&seasonAvgPC>line+2) return "OVER";
    // Gate 3: recent trend is above the line
    if(recent5Avg>line&&twoYrAvg>line) return "OVER";
  }

  return "UNDER";
}

function computePitchScore(params){
  // V5 Confidence score: how reliable is this projection?
  var p=params;
  var score=50;
  var profile=p.pitchProfile||null;

  // Season pitch profile consistency (strongest signal)
  if(profile&&profile.starts>=4){
    score+=8; // good sample of starts this season
    // Low variance = high confidence
    if(profile.shortStartRate===0) score+=4; // never blown up this season
    else if(profile.shortStartRate>0.3) score-=6; // frequently short
  } else if(profile&&profile.starts>=2){
    score+=3;
  }

  // Consistency between season avg and recent5 (agreement = strong signal)
  if(profile&&p.recent5&&profile.seasonAvgPC>0){
    var profileDiff=Math.abs(p.recent5.avg-profile.seasonAvgPC);
    if(profileDiff<3) score+=6; // very consistent pitcher
    else if(profileDiff<6) score+=3;
    else if(profileDiff>10) score-=4; // high variance
  }

  // Consistency between recent and long-term
  if(p.twoYr&&p.recent5){
    var diff=Math.abs(p.recent5.avg-p.twoYr.avg);
    if(diff<3) score+=6;
    else if(diff<6) score+=3;
    else if(diff>12) score-=6;
  }

  // Sample size — more starts = more confidence
  if(p.recent5&&p.recent5.starts>=5) score+=4;
  else if(p.recent5&&p.recent5.starts>=3) score+=2;

  // BvP matchup data available
  if(p.matchupsCount>=6) score+=4;
  else if(p.matchupsCount>=4) score+=2;

  // Strong BvP signal
  var absAdj=Math.abs(p.bvpAdj||0);
  if(absAdj>=5) score+=3;
  else if(absAdj>=3) score+=1;

  // Pitcher efficiency data quality
  if(p.pitcherEff&&p.pitcherEff.battersFaced>=100) score+=3;
  else if(p.pitcherEff&&p.pitcherEff.battersFaced>=50) score+=1;

  // Opposing team P/PA data quality
  if(p.teamPPA&&p.teamPPA.pa>=200) score+=2;

  // Bullpen fatigue signal strength
  if(p.bullpenFatigue&&p.bullpenFatigue.games>=3) score+=2;

  // Blowup risk flag lowers confidence
  if(profile&&profile.era>5.0&&profile.seasonAvgPC<85) score-=5;

  // V5.3: High blowup rate actually INCREASES confidence for UNDER picks
  // Because we know these pitchers are volatile and likely to get pulled
  if(profile&&profile.blowupRate>=0.40&&profile.starts>=3) score+=3;
  else if(profile&&profile.blowupRate>=0.30&&profile.starts>=4) score+=1;

  // Pitcher is in a predictable range
  if(profile&&profile.seasonAvgPC>=85&&profile.seasonAvgPC<=100) score+=3;
  if(p.recent5&&p.recent5.avg<70) score-=4;

  return Math.max(0, Math.min(99, Math.round(score)));
}

/* ─── PrizePicks Fantasy Score Calculator ─── */
function computeFantasyScore(boxStats){
  if(!boxStats) return 0;
  var score = 0;
  var hits = parseInt(boxStats.hits)||0;
  var doubles = parseInt(boxStats.doubles)||0;
  var triples = parseInt(boxStats.triples)||0;
  var homeRuns = parseInt(boxStats.homeRuns)||0;
  var runs = parseInt(boxStats.runs)||0;
  var rbi = parseInt(boxStats.rbi)||0;
  var walks = parseInt(boxStats.baseOnBalls)||0;
  var hbp = parseInt(boxStats.hitByPitch)||0;
  var sb = parseInt(boxStats.stolenBases)||0;

  // Singles = Hits - Doubles - Triples - HomeRuns
  var singles = hits - doubles - triples - homeRuns;
  if(singles < 0) singles = 0;

  score += singles * 3;
  score += doubles * 5;
  score += triples * 8;
  score += homeRuns * 10;
  score += runs * 2;
  score += rbi * 2;
  score += walks * 2;
  score += hbp * 2;
  score += sb * 5;

  return score;
}

// Floor to nearest 0.5 (e.g. 6.7 → 6.5, 5.3 → 5.0)
function floorHalf(n){ return Math.floor(n * 2) / 2; }

/* ─── K Prop Confidence Engine ─── */
function computeKPropConfidence(line, whiffData, seasonStat, extras){
  if(!whiffData) return null;
  // Use last 10 starts K/9 and avg IP as primary source (more reliable early in season)
  var recentStarts = extras ? extras.lastThree : null;
  var k9 = 0;
  var expectedIP = 5.5;
  if(recentStarts && recentStarts.kPer9){
    k9 = parseFloat(recentStarts.kPer9)||0;
  } else if(seasonStat && seasonStat.strikeoutsPer9Inn){
    k9 = parseFloat(seasonStat.strikeoutsPer9Inn)||0;
  }
  if(recentStarts && recentStarts.avgIP){
    expectedIP = parseFloat(recentStarts.avgIP)||5.5;
  } else if(seasonStat && seasonStat.inningsPitched && seasonStat.gamesStarted){
    var totalIP = parseFloat(seasonStat.inningsPitched)||0;
    var gs = parseInt(seasonStat.gamesStarted)||1;
    expectedIP = totalIP / gs;
  }
  if(k9 === 0) return null;
  // Project Ks: k9 * (expectedIP / 9) with regression adjustment
  // K/9 overstates actual Ks because pitcher efficiency drops later in outings
  // and early hooks / pitch counts limit deep-game Ks. Apply 0.92 deflator (V2: raised from 0.88).
  var rawProjectedK = k9 * (expectedIP / 9);
  var projectedK = rawProjectedK * 0.92;

  // Opponent team K-rate adjustment (V2)
  var oppKRate = (whiffData && whiffData.oppTeamKRate) ? whiffData.oppTeamKRate : 0.215;
  var oppKMult = 1.0;
  if(oppKRate >= 0.260) oppKMult = 1.12;
  else if(oppKRate >= 0.240) oppKMult = 1.06;
  else if(oppKRate >= 0.220) oppKMult = 1.02;
  else if(oppKRate < 0.180) oppKMult = 0.88;
  else if(oppKRate < 0.200) oppKMult = 0.94;
  projectedK *= oppKMult;

  // Whiff score modifier: score > 60 = boost, < 40 = drag
  // V2: widened swing to ±20% (was ±15%)
  var whiffMod = (whiffData.score - 50) / 50; // -1 to ~+1
  var adjustedK = projectedK * (1 + whiffMod * 0.20);

  // Blend recent per-game K average to capture "groove" effects (V2)
  var recentL3 = extras ? extras.lastThree : null;
  if(recentL3 && recentL3.k > 0 && recentL3.starts >= 2){
    var recentKPerGame = recentL3.k / recentL3.starts;
    adjustedK = adjustedK * 0.70 + recentKPerGame * 0.30;
  }

  // How far above/below the line
  var margin = adjustedK - line;

  // Convert margin to confidence (stars 1-5)
  // margin >= 2.5 → 5 stars, margin ~1.5 → 4, margin ~0.5 → 3, margin ~-0.5 → 2, below → 1
  var stars;
  if(margin >= 2.0) stars = 5;
  else if(margin >= 1.2) stars = 4.5;
  else if(margin >= 0.7) stars = 4;
  else if(margin >= 0.3) stars = 3.5;
  else if(margin >= -0.2) stars = 3;
  else if(margin >= -0.7) stars = 2.5;
  else if(margin >= -1.2) stars = 2;
  else if(margin >= -2.0) stars = 1.5;
  else stars = 1;

  return {
    stars: stars,
    projectedK: floorHalf(adjustedK),
    rawProjectedK: floorHalf(projectedK),
    expectedIP: expectedIP.toFixed(1),
    margin: margin.toFixed(1),
    line: line
  };
}

function starDisplay(stars){
  var full = Math.floor(stars);
  var half = stars % 1 >= 0.5;
  var empty = 5 - full - (half ? 1 : 0);
  var result = "";
  for(var i=0;i<full;i++) result += "★";
  if(half) result += "½";
  for(var i=0;i<empty;i++) result += "☆";
  return result;
}

function starColor(stars){
  if(stars >= 4.5) return "#22c55e";
  if(stars >= 4) return "#4ade80";
  if(stars >= 3.5) return "#86efac";
  if(stars >= 3) return C.gold;
  if(stars >= 2.5) return C.orange;
  if(stars >= 2) return "#fca5a5";
  return "#ef4444";
}

/* ─── Batter K Predictor Model ─── */
// Estimates probability that a batter will strike out 1+ or 2+ times in a game.
// Uses: batter season K%, batter platoon K% vs pitcher hand, pitcher K/9,
// BvP K history, batter recent form K%, opponent team K-rate.
// Returns {conf1K, conf2K, factors} where conf values are 0-100 percentages.
function computeBatterKConfidence(params){
  var batterSeason = params.batterSeason;    // batter season hitting stats
  var batterSplit = params.batterSplit;       // batter stats vs pitcher's hand (L or R)
  var pitcherSeason = params.pitcherSeason;  // pitcher season pitching stats
  var bvpStat = params.bvpStat;              // head-to-head BvP stats
  var batterRecent = params.batterRecent;    // batter last 10 games
  var pitcherHand = params.pitcherHand;      // "L" or "R"

  var factors = {};

  // ── 1. Batter Season K Rate (weight: 25%) ──
  // League avg K rate ~22%. Higher = more K-prone.
  var batterKRate = 0.22; // default
  if(batterSeason){
    var bAB = parseInt(batterSeason.atBats)||0;
    var bK = parseInt(batterSeason.strikeOuts)||0;
    if(bAB >= 20) batterKRate = bK / bAB;
  }
  // Normalize: 0.15 K rate = -35, 0.22 = 0, 0.30 = +40, 0.35 = +65
  var batterKSignal = (batterKRate - 0.22) * 500;
  batterKSignal = Math.max(-40, Math.min(65, batterKSignal));
  factors.batterK = {rate: batterKRate, signal: Math.round(batterKSignal)};

  // ── 2. Platoon K Rate vs Pitcher Hand (weight: 15%) ──
  // Some batters K way more vs one hand. If split data exists, use it.
  var platoonSignal = 0;
  if(batterSplit){
    var spAB = parseInt(batterSplit.atBats)||0;
    var spK = parseInt(batterSplit.strikeOuts)||0;
    if(spAB >= 10){
      var splitKRate = spK / spAB;
      platoonSignal = (splitKRate - batterKRate) * 400;
      platoonSignal = Math.max(-25, Math.min(30, platoonSignal));
      factors.platoon = {rate: splitKRate, signal: Math.round(platoonSignal)};
    }
  }

  // ── 3. Pitcher K/9 (weight: 25%) ──
  // League avg K/9 ~8.5. Higher = more Ks generated.
  var pitcherK9 = 8.5;
  if(pitcherSeason){
    pitcherK9 = parseFloat(pitcherSeason.strikeoutsPer9Inn)||8.5;
  }
  // Normalize: 7.0 = -25, 8.5 = 0, 10.0 = +25, 12.0 = +58
  var pitcherKSignal = (pitcherK9 - 8.5) * 16.5;
  pitcherKSignal = Math.max(-30, Math.min(60, pitcherKSignal));
  factors.pitcherK9 = {k9: pitcherK9, signal: Math.round(pitcherKSignal)};

  // ── 4. BvP K History (weight: 15%) ──
  // If batter has faced this pitcher before, their K rate in that matchup matters.
  var bvpSignal = 0;
  if(bvpStat){
    var bvpAB = parseInt(bvpStat.atBats)||0;
    var bvpK = parseInt(bvpStat.strikeOuts)||0;
    if(bvpAB >= 3){
      var bvpKRate = bvpK / bvpAB;
      // Weight more heavily with more PA
      var bvpWeight = Math.min(1.0, bvpAB / 15);
      bvpSignal = (bvpKRate - batterKRate) * 300 * bvpWeight;
      bvpSignal = Math.max(-25, Math.min(35, bvpSignal));
      factors.bvp = {rate: bvpKRate, ab: bvpAB, signal: Math.round(bvpSignal)};
    }
  }

  // ── 5. Batter Recent Form (weight: 10%) ──
  // If batter is in a slump, they tend to K more (chasing, expanding zone)
  var recentSignal = 0;
  if(batterRecent && batterRecent.pa >= 15){
    // Low recent avg = pressing = more Ks
    var recentAvg = batterRecent.avg || 0;
    if(recentAvg < 0.180) recentSignal = 12;
    else if(recentAvg < 0.220) recentSignal = 6;
    else if(recentAvg > 0.320) recentSignal = -8;
    else if(recentAvg > 0.280) recentSignal = -4;
    factors.recentForm = {avg: recentAvg, signal: recentSignal};
  }

  // ── 6. Opponent Team K-Rate (weight: 10%) ──
  // Already computed in the main scan — how much this team Ks as a whole
  var teamKSignal = 0;
  var teamKRate = params.teamKRate || 0.22;
  teamKSignal = (teamKRate - 0.22) * 350;
  teamKSignal = Math.max(-20, Math.min(25, teamKSignal));
  factors.teamK = {rate: teamKRate, signal: Math.round(teamKSignal)};

  // ── Composite Score ──
  // Weighted sum → base probability adjustment
  var composite = batterKSignal * 0.25 +
                  platoonSignal * 0.15 +
                  pitcherKSignal * 0.25 +
                  bvpSignal * 0.15 +
                  recentSignal * 0.10 +
                  teamKSignal * 0.10;

  // ── Convert to probabilities ──
  // Base rates from MLB data:
  //   P(1+ K in a game) ≈ 62% for avg hitter (3.8 PA, 22% K rate)
  //   P(2+ K in a game) ≈ 28% for avg hitter
  // We adjust these base rates by the composite score
  var base1K = 62;
  var base2K = 28;

  // Composite range is roughly -40 to +60. Scale to probability adjustment.
  var conf1K = base1K + composite * 0.45;
  var conf2K = base2K + composite * 0.55;

  // Clamp
  conf1K = Math.max(15, Math.min(95, conf1K));
  conf2K = Math.max(5, Math.min(85, conf2K));

  // Ensure 2K is always less than 1K
  if(conf2K >= conf1K) conf2K = conf1K - 10;

  return {
    conf1K: Math.round(conf1K),
    conf2K: Math.round(conf2K),
    composite: Math.round(composite),
    factors: factors
  };
}

// Grade thresholds for K confidence
function kConfGrade(conf){
  if(conf >= 80) return {grade:"A+", color:"#22c55e"};
  if(conf >= 72) return {grade:"A", color:"#4ade80"};
  if(conf >= 65) return {grade:"B+", color:"#86efac"};
  if(conf >= 58) return {grade:"B", color:C.gold};
  if(conf >= 50) return {grade:"C+", color:C.orange};
  if(conf >= 40) return {grade:"C", color:"#fca5a5"};
  return {grade:"D", color:"#ef4444"};
}

/* ─── API Fetchers ─── */
var _fetchCache={};
// Global concurrency limiter: max 4 in-flight fetches at once
var _fetchQueue=[], _fetchActive=0, _FETCH_MAX=4;
function _fetchNext(){
  while(_fetchQueue.length>0 && _fetchActive<_FETCH_MAX){
    _fetchActive++;
    var item=_fetchQueue.shift();
    item();
  }
}
async function fetchJSON(url){
  if(_fetchCache[url]) return _fetchCache[url];
  // Wait in queue until a slot opens
  await new Promise(function(resolve){
    function run(){
      resolve();
    }
    if(_fetchActive<_FETCH_MAX){
      _fetchActive++;
      resolve();
    } else {
      _fetchQueue.push(run);
    }
  });
  var controller=new AbortController();
  var timeout=setTimeout(function(){controller.abort();},12000);
  try{
    var r=await fetch(url,{signal:controller.signal});
    clearTimeout(timeout);
    if(!r.ok) throw new Error("HTTP "+r.status);
    var data=await r.json();
    _fetchCache[url]=data;
    return data;
  }catch(e){
    clearTimeout(timeout);
    throw e;
  }finally{
    _fetchActive--;
    _fetchNext();
  }
}

/* Parse MLB innings pitched notation: "6.2" = 6 and 2/3 innings */
function parseIP(ip){
  var s=String(ip);
  var parts=s.split(".");
  var full=parseInt(parts[0])||0;
  var thirds=parts.length>1?(parseInt(parts[1])||0):0;
  return full+(thirds/3);
}
async function getVenueStat(playerId, homeTeamId, isPlayerHome, group){
  group=group||"hitting";
  if(!homeTeamId) return null;
  try{
    // Fetch career data: last 15 seasons in parallel to cover full career
    var currentYear=new Date().getFullYear();
    var years=[];
    for(var y=currentYear;y>=currentYear-14;y--) years.push(y);
    var fetches=years.map(function(yr){
      return fetch(BASE+"/people/"+playerId+"/stats?stats=gameLog&group="+group+"&season="+yr)
        .then(function(r){return r.ok?r.json():{stats:[]};})
        .catch(function(){return {stats:[]};});
    });
    var allData=await Promise.all(fetches);
    var venueGames=[];
    for(var d=0;d<allData.length;d++){
      var data=allData[d];
      for(var sg of (data.stats||[])){
        if(sg.group&&sg.group.displayName===group){
          for(var sp of (sg.splits||[])){
            var atVenue=false;
            if(isPlayerHome&&sp.isHome) atVenue=true;
            else if(!isPlayerHome&&!sp.isHome){
              var oppId=sp.opponent&&(sp.opponent.id||sp.opponent);
              if(oppId&&String(oppId)===String(homeTeamId)) atVenue=true;
            }
            if(atVenue&&sp.stat) venueGames.push(sp.stat);
          }
        }
      }
    }
    if(venueGames.length===0) return null;
    if(group==="hitting"){
      var tAB=0,tH=0,tHR=0,tBB=0,tK=0,tRBI=0,tPA=0,t2B=0,t3B=0,tHBP=0,tSF=0;
      for(var g of venueGames){
        tAB+=parseInt(g.atBats)||0;
        tH+=parseInt(g.hits)||0;
        tHR+=parseInt(g.homeRuns)||0;
        tBB+=parseInt(g.baseOnBalls)||0;
        tK+=parseInt(g.strikeOuts)||0;
        tRBI+=parseInt(g.rbi)||0;
        tPA+=(parseInt(g.plateAppearances)||parseInt(g.atBats))||0;
        t2B+=parseInt(g.doubles)||0;
        t3B+=parseInt(g.triples)||0;
        tHBP+=parseInt(g.hitByPitch)||0;
        tSF+=parseInt(g.sacFlies)||0;
      }
      var avg=tAB>0?(tH/tAB):0;
      var denom=tAB+tBB+tHBP+tSF;
      var obp=denom>0?((tH+tBB+tHBP)/denom):0;
      var tb=tH+t2B+(t3B*2)+(tHR*3);
      var slg=tAB>0?(tb/tAB):0;
      var ops=obp+slg;
      return {stat:{gamesPlayed:venueGames.length,atBats:tAB,hits:tH,homeRuns:tHR,
        baseOnBalls:tBB,strikeOuts:tK,rbi:tRBI,plateAppearances:tPA,
        avg:avg.toFixed(3),obp:obp.toFixed(3),slg:slg.toFixed(3),ops:ops.toFixed(3)},
        gamesPlayed:venueGames.length};
    }else{
      var tIP=0,tHp=0,tER=0,tBBp=0,tKp=0,tHRp=0;
      for(var g of venueGames){
        tIP+=parseIP(g.inningsPitched);
        tHp+=parseInt(g.hits)||0;
        tER+=parseInt(g.earnedRuns)||0;
        tBBp+=parseInt(g.baseOnBalls)||0;
        tKp+=parseInt(g.strikeOuts)||0;
        tHRp+=parseInt(g.homeRuns)||0;
      }
      var era=tIP>0?((tER/tIP)*9):0;
      var whip=tIP>0?((tHp+tBBp)/tIP):0;
      return {stat:{gamesPlayed:venueGames.length,era:era.toFixed(2),whip:whip.toFixed(2),
        inningsPitched:tIP.toFixed(1),hits:tHp,earnedRuns:tER,
        baseOnBalls:tBBp,strikeOuts:tKp,homeRuns:tHRp},
        gamesPlayed:venueGames.length};
    }
  }catch(e){return null;}
}

async function getBvPSplits(batterId,pitcherId){

        var tPA=0,tAB=0,tH=0,tHR=0,tK=0,tBB=0,tTB=0,t2B=0,t3B=0,tHBP=0,tSF=0,tRBI=0,tGP=0;

        var obpDenom=tAB+tBB+tHBP+tSF;
        var obp=obpDenom>0?((tH+tBB+tHBP)/obpDenom).toFixed(3):".000";
        var slg=tAB>0?(tTB/tAB).toFixed(3):".000";

          sacFlies:tSF,rbi:tRBI,totalBases:tTB,plateAppearances:tPA,
          avg:avg,obp:obp,slg:slg,ops:ops
        };
      }
    }
    return null;
  }catch(e){return null;}
}

async function getPitcherRecentStarts(pitcherId){
  try{
    var year=new Date().getFullYear();
    // Fetch current year + previous year in parallel to get enough starts early in season
    var both=await Promise.all([
      fetchJSON(BASE+"/people/"+pitcherId+"/stats?stats=gameLog&group=pitching&season="+year),
      fetchJSON(BASE+"/people/"+pitcherId+"/stats?stats=gameLog&group=pitching&season="+(year-1))
    ]);
    var games=[];
    // Previous year first (chronologically earlier)
    for(var sg of (both[1].stats||[])){
      if(sg.group&&sg.group.displayName==="pitching"){
        for(var sp of (sg.splits||[])) games.push(sp);
      }
    }
    // Then current year
    for(var sg2 of (both[0].stats||[])){
      if(sg2.group&&sg2.group.displayName==="pitching"){
        for(var sp2 of (sg2.splits||[])) games.push(sp2);
      }
    }
    // Take last 10 starts
    var recent=games.slice(-10);
    if(recent.length===0) return {games:[], agg:null};
    // Aggregate
    var totalIP=0, totalER=0, totalH=0, totalBB=0, totalK=0, totalHR=0;
    for(var g of recent){
      var s=g.stat||{};
      var ip=parseFloat(s.inningsPitched)||0;
      totalIP+=ip;
      totalER+=parseInt(s.earnedRuns)||0;
      totalH+=parseInt(s.hits)||0;
      totalBB+=parseInt(s.baseOnBalls)||0;
      totalK+=parseInt(s.strikeOuts)||0;
      totalHR+=parseInt(s.homeRuns)||0;
    }
    var era=totalIP>0?((totalER/totalIP)*9):0;
    var whip=totalIP>0?((totalH+totalBB)/totalIP):0;
    var kPer9=totalIP>0?((totalK/totalIP)*9):0;
    var avgIP=recent.length>0?(totalIP/recent.length):0;
    return {
      games:recent,
      agg:{era:era.toFixed(2), whip:whip.toFixed(2), kPer9:kPer9.toFixed(1),
           ip:totalIP.toFixed(1), er:totalER, h:totalH, bb:totalBB, k:totalK, hr:totalHR,
           starts:recent.length, avgIP:avgIP.toFixed(1)}
    };
  }catch(e){return {games:[], agg:null};}
}

async function fetchAllPitcherExtras(pitcherId, isHome, isDayGame, homeTeamId){

    homeTeamId ? safeVenueStat(pitcherId, homeTeamId, isHome, "pitching") : Promise.resolve(null)

  var hrSplits=results[0];
  var dnSplits=results[1];
  var l3Data=results[2];
  var venueStat=results[3];
  var splitStat=isHome?hrSplits.home:hrSplits.away;
  var dayNightStat=isDayGame?dnSplits.day:dnSplits.night;
  return {
    splitStat:splitStat,
    dayNightStat:dayNightStat,
    lastThree:l3Data.agg,
    lastThreeGames:l3Data.games,
    homeSplit:hrSplits.home,
    awaySplit:hrSplits.away,
    daySplit:dnSplits.day,
    nightSplit:dnSplits.night,
    venueStat:venueStat
  };
}

/* ─── Shared Components ─── */
function TrendArrow({bvpVal, seasonVal}){
  if(!bvpVal||!seasonVal||bvpVal==="---"||seasonVal==="---") return null;
  const bvp=parseFloat(bvpVal);
  const ssn=parseFloat(seasonVal);
  if(isNaN(bvp)||isNaN(ssn)) return null;
  const diff=ssn-bvp;
  if(Math.abs(diff)<0.020) return <span className="trend-arrow" style={{color:C.muted}}>▸</span>;
  if(diff>0) return <span className="trend-arrow" style={{color:C.green}}>▲</span>;
  return <span className="trend-arrow" style={{color:C.red}}>▼</span>;
}

function EdgeBadge({score}){
  const {grade,color}=edgeGrade(score);
  return(
    <div style={{display:"flex",alignItems:"center",gap:6}}>
      <div style={{
        width:32,height:22,borderRadius:4,display:"flex",alignItems:"center",justifyContent:"center",
        background:color+"18",border:"1px solid "+color+"40",
        fontSize:11,fontWeight:600,color:color,fontFamily:"'Bebas Neue',sans-serif",letterSpacing:1
      }}>{grade}</div>
      <div style={{width:40,height:4,background:C.border,borderRadius:2,overflow:"hidden"}}>
        <div className="edge-bar-fill" style={{height:"100%",width:score+"%",borderRadius:2,

        }}/>
      </div>
      <span style={{fontSize:9,color:C.muted,minWidth:16}}>{score}</span>
    </div>
  );
}

function StatPill({label,value,color}){

    <div style={{background:"#0d1220",borderRadius:6,padding:"6px 12px",minWidth:90}}>

      <div style={{fontSize:14,fontFamily:"'Bebas Neue',sans-serif",letterSpacing:1,color:color}}>{value}</div>

  var s=game.stat;

  var opp=game.opponent&&game.opponent.abbreviation?game.opponent.abbreviation:"";
  var isHome=game.isHome;
  return(
    <div style={{display:"flex",gap:14,alignItems:"center",padding:"3px 0",fontSize:10,borderBottom:"1px solid "+C.border+"60"}}>
      <span style={{color:C.muted,minWidth:70}}>{dateStr}</span>
      <span style={{color:C.subtext,minWidth:50}}>{isHome?"vs":"@"} {opp}</span>

  );
}

function PitcherSummaryCard({pitcher, matchups, seasonStat, side, extras}){
  if(!pitcher) return null;
  const [expanded, setExpanded] = useState(false);
  const totalPA = matchups.reduce(function(s,m){return s+(parseInt(m.stat.plateAppearances)||0);},0);
  const totalAB = matchups.reduce(function(s,m){return s+(parseInt(m.stat.atBats)||0);},0);
  const totalH = matchups.reduce(function(s,m){return s+(parseInt(m.stat.hits)||0);},0);
  const totalK = matchups.reduce(function(s,m){return s+(parseInt(m.stat.strikeOuts)||0);},0);
  const totalBB = matchups.reduce(function(s,m){return s+(parseInt(m.stat.baseOnBalls)||0);},0);
  const totalHR = matchups.reduce(function(s,m){return s+(parseInt(m.stat.homeRuns)||0);},0);
  const avgAgainst = totalAB>0?(totalH/totalAB):0;
  const kRate = totalAB>0?(totalK/totalAB):0;
  const pEdgeResult = pitcherEdgeScore(matchups, extras);
  const pEdge = pEdgeResult.score;
  const pParkDelta = pEdgeResult.parkDelta;
  const eg=edgeGrade(pEdge);
  const label = side==="home" ? "HOME SP" : "AWAY SP";

  // Determine which split is relevant for display
  var relevantSplit = extras ? (side==="home" ? extras.homeSplit : extras.awaySplit) : null;
  var relevantDN = extras ? extras.dayNightStat : null;
  var l3 = extras ? extras.lastThree : null;

    <div className="fade-in" style={{background:C.card,border:"1px solid "+C.border,borderRadius:10,padding:16,marginBottom:16}}>

                <SplitDetailRow label={"At Park ("+venueStatP.gamesPlayed+" GS)"} stat={venueStatP.stat}/>
                {pParkDelta!==0&&(
                  <div style={{fontSize:10,color:pParkDelta>0?C.green:C.red,marginTop:4}}>
                    Score impact: <strong>{pParkDelta>0?"+":""}{pParkDelta} pts</strong>
                    {pParkDelta>0?" — pitches well here":" — struggles at this park"}
                    {venueStatP.gamesPlayed<10&&" (small sample — "+venueStatP.gamesPlayed+" GS)"}
                  </div>
                )}
                {pParkDelta===0&&(
                  <div style={{fontSize:10,color:C.muted,marginTop:4}}>Neutral park factor — not enough differential to adjust score</div>
                )}
              </div>
            ):(
              <div style={{fontSize:10,color:C.muted}}>No venue-specific data for this pitcher</div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* ─────────────────────────────────────────────── */
/* ─── GAME TOTALS PAGE: Separate O/U Scanner ─── */
/* ─────────────────────────────────────────────── */
function GameTotalsPage({games}){
  var [totals,setTotals]=useState([]);
  var [scanning,setScanning]=useState(false);
  var [scanProgress,setScanProgress]=useState("");
  var [scanError,setScanError]=useState("");

  async function scanTotals(){
    setScanning(true);
    setTotals([]);
    setScanError("");
    var results=[];

    try{
      for(var gi=0;gi<games.length;gi++){
        var game=games[gi];
        if(!game||!game.teams||!game.teams.home||!game.teams.away) continue;
        var homeId=game.teams.home.team.id;
        var awayId=game.teams.away.team.id;
        var homePitcher=game.teams.home.probablePitcher;
        var awayPitcher=game.teams.away.probablePitcher;
        var awayAbbr=game.teams.away.team.abbreviation||"???";
        var homeAbbr=game.teams.home.team.abbreviation||"???";
        var gameLabel=awayAbbr+" @ "+homeAbbr;
        setScanProgress(gameLabel+" ("+(gi+1)+"/"+games.length+")");

        // Yield to browser between games
        await new Promise(function(r){setTimeout(r,50);});

        try{
          // Fetch team offense + bullpen in parallel (cached after first call)
          var fetched=await Promise.all([
            getTeamOffense(homeId),
            getTeamOffense(awayId),
            getBullpenQuality(homeId),
            getBullpenQuality(awayId)
          ]);
          var homeOff=fetched[0], awayOff=fetched[1], homeBP=fetched[2], awayBP=fetched[3];

          // Get starter ERA from season stats (sequential to avoid burst)
          var homeStarter=null, awayStarter=null;
          if(homePitcher&&homePitcher.id){
            try{
              var yr=new Date().getFullYear();
              var hpData=await fetchJSON(BASE+"/people/"+homePitcher.id+"/stats?stats=season&group=pitching&season="+yr);
              var hpStats=(hpData&&hpData.stats)||[];
              for(var si=0;si<hpStats.length;si++){
                var sp=hpStats[si].splits;
                if(sp&&sp[0]&&sp[0].stat){
                  homeStarter={era:parseFloat(sp[0].stat.era)||4.50, k9:parseFloat(sp[0].stat.strikeoutsPer9Inn)||7.0, ip:parseFloat(sp[0].stat.inningsPitched)||0};
                  break;
                }
              }
            }catch(e2){}
          }
          if(awayPitcher&&awayPitcher.id){
            try{
              var yr2=new Date().getFullYear();
              var apData=await fetchJSON(BASE+"/people/"+awayPitcher.id+"/stats?stats=season&group=pitching&season="+yr2);
              var apStats=(apData&&apData.stats)||[];
              for(var si2=0;si2<apStats.length;si2++){
                var sp2=apStats[si2].splits;
                if(sp2&&sp2[0]&&sp2[0].stat){
                  awayStarter={era:parseFloat(sp2[0].stat.era)||4.50, k9:parseFloat(sp2[0].stat.strikeoutsPer9Inn)||7.0, ip:parseFloat(sp2[0].stat.inningsPitched)||0};
                  break;
                }
              }
            }catch(e3){}
          }

          // Build whiff proxy from K/9 (K/9 of 9.0 = score 65, 7.0 = 50, 11.0 = 80)
          var hk9=homeStarter?homeStarter.k9:7.0;
          var ak9=awayStarter?awayStarter.k9:7.0;
          var homeWhiffProxy={score:Math.min(95,Math.max(20, 50+(hk9-7.0)*7.5))};
          var awayWhiffProxy={score:Math.min(95,Math.max(20, 50+(ak9-7.0)*7.5))};

          // Park factor
          var venueId=(game.venue&&game.venue.id)?game.venue.id:null;
          var parkFactor=getParkRunFactor(venueId);

          // Compute game total
          var projected=computeGameTotal({
            homeOffense:homeOff, awayOffense:awayOff,
            homeStarter:homeStarter, awayStarter:awayStarter,
            homeBullpen:homeBP, awayBullpen:awayBP,
            parkFactor:parkFactor,
            homeWhiff:homeWhiffProxy, awayWhiff:awayWhiffProxy
          });

          var confidence=computeTotalConfidence({
            homeOffense:homeOff, awayOffense:awayOff,
            homeBullpen:homeBP, awayBullpen:awayBP,
            parkFactor:parkFactor,
            homeWhiff:homeWhiffProxy, awayWhiff:awayWhiffProxy
          });

          // Safety: ensure projected is a valid number
          if(typeof projected!=="number"||isNaN(projected)) projected=8.5;
          if(typeof confidence!=="number"||isNaN(confidence)) confidence=50;

          results.push({
            gamePk:game.gamePk, gameLabel:gameLabel,
            projected:projected, confidence:confidence,
            homeOff:homeOff||{rpg:4.5}, awayOff:awayOff||{rpg:4.5},
            homeBP:homeBP||{era:4.50,quality:"average"}, awayBP:awayBP||{era:4.50,quality:"average"},
            homeStarter:homeStarter, awayStarter:awayStarter,
            homePitcherName:homePitcher?homePitcher.fullName:"TBD",
            awayPitcherName:awayPitcher?awayPitcher.fullName:"TBD",
            parkFactor:parkFactor||{factor:1.0,name:"Unknown"},
            homeWhiff:homeWhiffProxy.score, awayWhiff:awayWhiffProxy.score
          });
        }catch(e){
          console.warn("Totals scan error for "+gameLabel, e);
        }
      }
    }catch(outerErr){
      console.error("Game totals scan crashed:", outerErr);
      setScanError("Scan error: "+(outerErr.message||"unknown"));
    }

    results.sort(function(a,b){return b.projected-a.projected;});
    setTotals(results);
    setScanning(false);
    setScanProgress("");
  }

  // O/U signal: projected vs typical Vegas line (8.5 default)
  function getSignal(projected){
    if(projected>=10.0) return {label:"STRONG OVER",color:C.green};
    if(projected>=9.0) return {label:"LEAN OVER",color:"#86efac"};
    if(projected<=7.0) return {label:"STRONG UNDER",color:C.blue};
    if(projected<=8.0) return {label:"LEAN UNDER",color:"#7dd3fc"};
    return {label:"NEUTRAL",color:C.muted};
  }

  function bpBadge(quality){
    var colors={elite:C.green,good:"#86efac",average:C.muted,poor:C.orange,bad:C.red};
    return {color:colors[quality]||C.muted, label:quality?quality.toUpperCase():"AVG"};
  }

  return(
    <div style={{padding:"32px 24px",maxWidth:1000,margin:"0 auto"}}>
      <div style={{marginBottom:24,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12}}>
        <div>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:28,letterSpacing:3}}>🎯 GAME TOTALS</div>
          <div style={{fontSize:11,color:C.muted,marginTop:4}}>O/U run projections using offense, starters, bullpens & park factors</div>
        </div>
        <button className="scan-btn" onClick={scanTotals} disabled={scanning||games.length===0}
          style={{padding:"10px 24px",fontSize:12,fontWeight:600,letterSpacing:1,
            background:scanning?"#1e2d40":"linear-gradient(135deg,#f0b429,#fb923c)",
            color:scanning?C.muted:"#000",border:"none",borderRadius:8,cursor:scanning?"not-allowed":"pointer",
            fontFamily:"'DM Mono',monospace"}}>
          {scanning?"SCANNING...":"⚡ SCAN TOTALS"}
        </button>
      </div>

      {scanning&&(
        <div style={{textAlign:"center",padding:32,color:C.gold}} className="loading-pulse">
          <div style={{fontSize:13,marginBottom:8}}>Scanning game totals...</div>
          <div style={{fontSize:11,color:C.muted}}>{scanProgress}</div>
        </div>
      )}

      {scanError&&(
        <div style={{padding:16,background:"#2d1215",border:"1px solid "+C.red,borderRadius:6,color:C.red,fontSize:11,marginBottom:16}}>
          {scanError}
        </div>
      )}

      {!scanning&&totals.length===0&&!scanError&&(
        <div style={{textAlign:"center",padding:48,color:C.muted}}>
          <div style={{fontSize:40,marginBottom:16}}>🎯</div>
          <div style={{fontSize:13}}>Hit "Scan Totals" to project O/U for today's games</div>
          <div style={{fontSize:10,marginTop:8,color:C.subtext}}>Uses team offense, starter ERA/K9, bullpen quality, and park factors</div>
        </div>
      )}

      {totals.length>0&&(
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
            <thead>
              <tr style={{borderBottom:"2px solid "+C.border,background:C.card}}>
                <th style={{textAlign:"left",padding:"10px 8px",color:C.muted,fontWeight:500,letterSpacing:1}}>GAME</th>
                <th style={{textAlign:"center",padding:"10px 8px",color:C.gold,fontWeight:500,letterSpacing:1}}>PROJ TOTAL</th>
                <th style={{textAlign:"center",padding:"10px 8px",color:C.green,fontWeight:500,letterSpacing:1}}>SIGNAL</th>
                <th style={{textAlign:"center",padding:"10px 8px",color:C.muted,fontWeight:500,letterSpacing:1}}>CONF</th>
                <th style={{textAlign:"center",padding:"10px 8px",color:C.blue,fontWeight:500,letterSpacing:1}}>HOME SP</th>
                <th style={{textAlign:"center",padding:"10px 8px",color:C.blue,fontWeight:500,letterSpacing:1}}>AWAY SP</th>
                <th style={{textAlign:"center",padding:"10px 8px",color:C.orange,fontWeight:500,letterSpacing:1}}>HOME BP</th>
                <th style={{textAlign:"center",padding:"10px 8px",color:C.orange,fontWeight:500,letterSpacing:1}}>AWAY BP</th>
                <th style={{textAlign:"center",padding:"10px 8px",color:C.purple,fontWeight:500,letterSpacing:1}}>PARK</th>
              </tr>
            </thead>
            <tbody>
              {totals.map(function(t){
                var proj=typeof t.projected==="number"&&!isNaN(t.projected)?t.projected:8.5;
                var conf=typeof t.confidence==="number"&&!isNaN(t.confidence)?t.confidence:50;
                var signal=getSignal(proj);
                var hBP=bpBadge(t.homeBP?t.homeBP.quality:"average");
                var aBP=bpBadge(t.awayBP?t.awayBP.quality:"average");
                var hERA=(t.homeStarter&&typeof t.homeStarter.era==="number")?t.homeStarter.era.toFixed(2):"--";
                var aERA=(t.awayStarter&&typeof t.awayStarter.era==="number")?t.awayStarter.era.toFixed(2):"--";
                var hName=(t.homePitcherName||"TBD").split(" ").pop();
                var aName=(t.awayPitcherName||"TBD").split(" ").pop();
                var pf=(t.parkFactor&&typeof t.parkFactor.factor==="number")?t.parkFactor.factor:1.0;
                var hBPera=(t.homeBP&&t.homeBP.era)?t.homeBP.era:"--";
                var aBPera=(t.awayBP&&t.awayBP.era)?t.awayBP.era:"--";
                return(
                  <tr key={t.gamePk} style={{borderBottom:"1px solid "+C.border}} className="matchup-row">
                    <td style={{padding:"10px 8px",fontWeight:600,color:C.text,whiteSpace:"nowrap"}}>{t.gameLabel}</td>
                    <td style={{padding:"10px 8px",textAlign:"center",fontWeight:700,fontSize:14,color:C.gold}}>{proj.toFixed(1)}</td>
                    <td style={{padding:"10px 8px",textAlign:"center"}}>
                      <span style={{background:signal.color+"20",color:signal.color,padding:"3px 8px",borderRadius:4,fontSize:10,fontWeight:600,letterSpacing:0.5}}>{signal.label}</span>
                    </td>
                    <td style={{padding:"10px 8px",textAlign:"center",color:conf>=70?C.green:conf>=55?C.gold:C.muted,fontWeight:600}}>{conf}</td>
                    <td style={{padding:"10px 8px",textAlign:"center",fontSize:10}}>
                      <div style={{color:C.text}}>{hName}</div>
                      <div style={{color:hERA!=="--"&&parseFloat(hERA)<=3.50?C.green:hERA!=="--"&&parseFloat(hERA)>=4.50?C.red:C.muted,fontSize:9}}>{hERA} ERA</div>
                    </td>
                    <td style={{padding:"10px 8px",textAlign:"center",fontSize:10}}>
                      <div style={{color:C.text}}>{aName}</div>
                      <div style={{color:aERA!=="--"&&parseFloat(aERA)<=3.50?C.green:aERA!=="--"&&parseFloat(aERA)>=4.50?C.red:C.muted,fontSize:9}}>{aERA} ERA</div>
                    </td>
                    <td style={{padding:"10px 8px",textAlign:"center"}}>
                      <span style={{color:hBP.color,fontSize:10,fontWeight:600}}>{hBP.label}</span>
                      <div style={{color:C.muted,fontSize:9}}>{hBPera} ERA</div>
                    </td>
                    <td style={{padding:"10px 8px",textAlign:"center"}}>
                      <span style={{color:aBP.color,fontSize:10,fontWeight:600}}>{aBP.label}</span>
                      <div style={{color:C.muted,fontSize:9}}>{aBPera} ERA</div>
                    </td>
                    <td style={{padding:"10px 8px",textAlign:"center",color:pf>=1.05?C.red:pf<=0.95?C.blue:C.muted,fontWeight:600,fontSize:10}}>
                      {pf.toFixed(2)}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>

          {/* Legend */}
          <div style={{marginTop:16,padding:12,background:C.card,borderRadius:6,border:"1px solid "+C.border,fontSize:10,color:C.muted}}>
            <span style={{color:C.green}}>● STRONG OVER</span>{" = Proj ≥ 10.0 | "}
            <span style={{color:"#86efac"}}>● LEAN OVER</span>{" = Proj 9.0-9.9 | "}
            <span style={{color:C.blue}}>● STRONG UNDER</span>{" = Proj ≤ 7.0 | "}
            <span style={{color:"#7dd3fc"}}>● LEAN UNDER</span>{" = Proj 7.1-8.0 | "}
            <span>● NEUTRAL = 8.1-8.9</span>
          </div>
        </div>
      )}
    </div>
  );
}
