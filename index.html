    setResultsDate(yesterday.toISOString().slice(0, 10));
  },[]);

  // Sync cloud results into season history on startup
  useEffect(function(){
    (async function(){
      try{
        // Try to fetch results index
        var idxResp = await fetch("./results/index.json");
        if(!idxResp.ok) return;
        var resultDates = await idxResp.json(); // ["2026-04-04","2026-04-05",...]
        if(!Array.isArray(resultDates)||resultDates.length===0) return;

        // Check which dates we're missing in season history
        var existing = {};
        try{
          var sh = JSON.parse(localStorage.getItem("de_season_history")||"[]");
          for(var i=0;i<sh.length;i++) existing[sh[i].date]=true;
        }catch(e){}

        var missing = resultDates.filter(function(d){return !existing[d];});
        if(missing.length===0) return;

        // Fetch missing results and add to history
        for(var mi=0;mi<missing.length;mi++){
          try{
            var r = await fetch("./results/"+missing[mi]+".json");
            if(!r.ok) continue;
            var rd = await r.json();
            if(!rd.summary) continue;
            setSeasonHistory(function(prev){
              if(prev.some(function(e){return e.date===rd.date;})) return prev;
              var updated = prev.concat([{
                date:rd.date,
                batterHitRate:rd.summary.hitRate||0,
                pitcherOverRate:rd.summary.pitcherHitProjRate||0,
                batterCount:rd.summary.bGradeBatters||0,
                pitcherCount:rd.summary.bGradePitchers||0
              }]);
              updated.sort(function(a,b){return a.date.localeCompare(b.date);});
              try{localStorage.setItem("de_season_history",JSON.stringify(updated));}catch(e){}
              return updated;
            });
          }catch(e){}
        }
      }catch(e){}
    })();
  },[]);

  /* ─── Full Slate Scanner ─── */
  async function scanAllGames(){
    scanAbort.current=false;
    setScanState("scanning");
    setAllEdges([]);
    setAllWhiffScores([]);
    setAllWalkScores([]);
    var accumulated=[];
    var whiffAccum=[];
    var walkAccum=[];

    for(var gi=0;gi<games.length;gi++){
      if(scanAbort.current) break;
      var game=games[gi];
      var homeId=game.teams.home.team.id;
      var awayId=game.teams.away.team.id;
      var homePitcher=game.teams.home.probablePitcher;
      var awayPitcher=game.teams.away.probablePitcher;
      if(!homePitcher&&!awayPitcher) continue;

      var awayAbbr=game.teams.away.team.abbreviation;
      var homeAbbr=game.teams.home.team.abbreviation;
      var gameLabel=awayAbbr+" @ "+homeAbbr;

      try{
        var rosters=await Promise.all([getRoster(homeId),getRoster(awayId)]);
        var homeRoster=rosters[0];
        var awayRoster=rosters[1];

        // Fetch team K rates for whiff scores
        var teamKRatesLocal={};
        var tkFetches=[
          getTeamSeasonStats(homeId).then(function(s){if(s) teamKRatesLocal[homeId]=s;}),
          getTeamSeasonStats(awayId).then(function(s){if(s) teamKRatesLocal[awayId]=s;})
        ];
        await Promise.all(tkFetches);

        var homeMatchupsForWhiff=[];
        var awayMatchupsForWhiff=[];

        if(homePitcher){
          for(var bi=0;bi<awayRoster.length;bi++){
            if(scanAbort.current) break;
            var batter=awayRoster[bi];
            var results=await Promise.all([
              getBvPSplits(batter.person.id,homePitcher.id),
              getSeasonStats(batter.person.id,"hitting")
            ]);
            var stat=results[0];
            var seasonStat=results[1];
            if(stat&&(parseInt(stat.plateAppearances)||0)>=5){
              var esr=computeEdgeScore(stat,seasonStat,stat.plateAppearances,null);
              accumulated.push({batter:batter.person,pitcher:homePitcher,
                pitcherTeam:game.teams.home.team.name,
                batterTeam:awayAbbr,side:"away",stat:stat,seasonStat:seasonStat,
                edgeScore:esr.score,parkDelta:0,gamePk:game.gamePk,gameLabel:gameLabel});
              homeMatchupsForWhiff.push({stat:stat,batter:batter.person});
            }
          }
        }
        if(awayPitcher){
          for(var bi2=0;bi2<homeRoster.length;bi2++){
            if(scanAbort.current) break;
            var batter2=homeRoster[bi2];
            var results2=await Promise.all([
              getBvPSplits(batter2.person.id,awayPitcher.id),
              getSeasonStats(batter2.person.id,"hitting")
            ]);
            var stat2=results2[0];
            var seasonStat2=results2[1];
            if(stat2&&(parseInt(stat2.plateAppearances)||0)>=5){
              var esr2=computeEdgeScore(stat2,seasonStat2,stat2.plateAppearances,null);
              accumulated.push({batter:batter2.person,pitcher:awayPitcher,
                pitcherTeam:game.teams.away.team.name,
                batterTeam:homeAbbr,side:"home",stat:stat2,seasonStat:seasonStat2,
                edgeScore:esr2.score,parkDelta:0,gamePk:game.gamePk,gameLabel:gameLabel});
              awayMatchupsForWhiff.push({stat:stat2,batter:batter2.person});
            }
          }
        }

        // Compute whiff scores for this game's pitchers (without extras, just basics)
        if(homePitcher && homeMatchupsForWhiff.length > 0){
          var homeSeasonStat=await getSeasonStats(homePitcher.id,"pitching");
          var oppKRate=teamKRatesLocal[awayId] ? teamKRatesLocal[awayId].kRate : 0.200;
          var homeWhiffResult=computeWhiffScore(homePitcher, homeSeasonStat, null, oppKRate, homeMatchupsForWhiff);
          var hK9=homeSeasonStat?parseFloat(homeSeasonStat.strikeoutsPer9Inn)||0:0;
          var hExpIP=homeSeasonStat&&homeSeasonStat.inningsPitched&&homeSeasonStat.gamesStarted?(parseFloat(homeSeasonStat.inningsPitched)/Math.max(parseInt(homeSeasonStat.gamesStarted),1)):5.5;
          var hProjK=floorHalf((hK9*hExpIP/9)*0.88);
          whiffAccum.push({pitcher:homePitcher, score:homeWhiffResult.score, gamePk:game.gamePk, gameLabel:gameLabel,
            team:homeAbbr, oppTeam:awayAbbr, k9:hK9, projectedIP:hExpIP, projectedK:hProjK, seasonStat:homeSeasonStat});
        }
        if(awayPitcher && awayMatchupsForWhiff.length > 0){
          var awaySeasonStat=await getSeasonStats(awayPitcher.id,"pitching");
          var oppKRate2=teamKRatesLocal[homeId] ? teamKRatesLocal[homeId].kRate : 0.200;
          var awayWhiffResult=computeWhiffScore(awayPitcher, awaySeasonStat, null, oppKRate2, awayMatchupsForWhiff);
          var aK9=awaySeasonStat?parseFloat(awaySeasonStat.strikeoutsPer9Inn)||0:0;
          var aExpIP=awaySeasonStat&&awaySeasonStat.inningsPitched&&awaySeasonStat.gamesStarted?(parseFloat(awaySeasonStat.inningsPitched)/Math.max(parseInt(awaySeasonStat.gamesStarted),1)):5.5;
          var aProjK=floorHalf((aK9*aExpIP/9)*0.88);
          whiffAccum.push({pitcher:awayPitcher, score:awayWhiffResult.score, gamePk:game.gamePk, gameLabel:gameLabel,
            team:awayAbbr, oppTeam:homeAbbr, k9:aK9, projectedIP:aExpIP, projectedK:aProjK, seasonStat:awaySeasonStat});
        }

        // Walk scanning for this game
        try{
          // Cache pitcher BB data per game (avoid refetching)
          var pitcherBBCache = {};

          if(homePitcher){
            var hpSeasonForWalk = homeSeasonStat || await getSeasonStats(homePitcher.id,"pitching");
            var hpRecentBB = await getPitcherRecentBBRate(homePitcher.id);
            var hpCareerBB = await getPitcherCareerBBRate(homePitcher.id);

            for(var wi=0;wi<homeMatchupsForWhiff.length;wi++){
              var wBatter = homeMatchupsForWhiff[wi];
              if(!wBatter.stat) continue;
              var wBatterSeason = await getSeasonStats(wBatter.batter.id,"hitting");
              var wBatterRecent = await getBatterRecentBBRate(wBatter.batter.id);
              var wBatterCareer = await getBatterCareerBBRate(wBatter.batter.id);
              var ws = computeWalkScore(wBatter.stat, wBatterSeason, wBatterRecent, wBatterCareer, hpSeasonForWalk, hpRecentBB, hpCareerBB);
              if(ws.score >= 50){
                walkAccum.push({
                  batter:wBatter.batter, pitcher:homePitcher,
                  batterTeam:awayAbbr, pitcherTeam:homeAbbr,
                  walkScore:ws.score, factors:ws.factors, bvpBBRate:ws.bvpBBRate,
                  bvpBB:parseInt(wBatter.stat.baseOnBalls)||0,
                  bvpPA:parseInt(wBatter.stat.plateAppearances)||0,
                  gamePk:game.gamePk, gameLabel:gameLabel
                });
              }
            }
          }

          if(awayPitcher){
            var apSeasonForWalk = awaySeasonStat || await getSeasonStats(awayPitcher.id,"pitching");
            var apRecentBB = await getPitcherRecentBBRate(awayPitcher.id);
            var apCareerBB = await getPitcherCareerBBRate(awayPitcher.id);

            for(var wi2=0;wi2<awayMatchupsForWhiff.length;wi2++){
              var wBatter2 = awayMatchupsForWhiff[wi2];
              if(!wBatter2.stat) continue;
              var wBatterSeason2 = await getSeasonStats(wBatter2.batter.id,"hitting");
              var wBatterRecent2 = await getBatterRecentBBRate(wBatter2.batter.id);
              var wBatterCareer2 = await getBatterCareerBBRate(wBatter2.batter.id);
              var ws2 = computeWalkScore(wBatter2.stat, wBatterSeason2, wBatterRecent2, wBatterCareer2, apSeasonForWalk, apRecentBB, apCareerBB);
              if(ws2.score >= 50){
                walkAccum.push({
                  batter:wBatter2.batter, pitcher:awayPitcher,
                  batterTeam:homeAbbr, pitcherTeam:awayAbbr,
                  walkScore:ws2.score, factors:ws2.factors, bvpBBRate:ws2.bvpBBRate,
                  bvpBB:parseInt(wBatter2.stat.baseOnBalls)||0,
                  bvpPA:parseInt(wBatter2.stat.plateAppearances)||0,
                  gamePk:game.gamePk, gameLabel:gameLabel
                });
              }
            }
          }
        }catch(walkErr){}
      }catch(e){
        // skip game on error, continue scanning
      }
      // Update state after each game so user sees progress
      setAllEdges(accumulated.slice());
      setAllWhiffScores(whiffAccum.slice());
      setAllWalkScores(walkAccum.slice());
    }
    setAllEdges(accumulated.slice());
    setAllWhiffScores(whiffAccum.slice());
    setAllWalkScores(walkAccum.slice());
    setScanState("done");

    // ── Snapshot: freeze today's pre-game scores for results comparison ──
    try{
      var today = new Date().toISOString().slice(0,10);
      // Top 15 batter edges
      var sortedEdges = accumulated.slice().sort(function(a,b){return b.edgeScore-a.edgeScore;});
      var top15Snap = sortedEdges.slice(0,15).map(function(e){
        return {
          batterId: e.batter.id, batterName: e.batter.fullName,
          pitcherId: e.pitcher.id, pitcherName: e.pitcher.fullName,
          batterTeam: e.batterTeam, pitcherTeam: e.pitcherTeam||"",
          edgeScore: e.edgeScore, gamePk: e.gamePk, gameLabel: e.gameLabel,
          bvpAvg: e.stat ? e.stat.avg : null, bvpOps: e.stat ? e.stat.ops : null
        };
      });
      // All pitcher whiff scores
      var pitcherSnap = whiffAccum.map(function(w){
        return {
          pitcherId: w.pitcher.id, pitcherName: w.pitcher.fullName,
          whiffScore: w.score, gamePk: w.gamePk, gameLabel: w.gameLabel,
          team: w.team||"", oppTeam: w.oppTeam||"",
          k9: w.k9||0, projectedIP: w.projectedIP||5.5, projectedK: w.projectedK||0
        };
      });
      // Top walk candidates
      var walkSnap = walkAccum.filter(function(w){return w.walkScore>=55;}).sort(function(a,b){return b.walkScore-a.walkScore;}).map(function(w){
        return {
          batterId:w.batter.id, batterName:w.batter.fullName,
          pitcherId:w.pitcher.id, pitcherName:w.pitcher.fullName,
          batterTeam:w.batterTeam, pitcherTeam:w.pitcherTeam||"",
          walkScore:w.walkScore, bvpBB:w.bvpBB, bvpPA:w.bvpPA, bvpBBRate:w.bvpBBRate,
          gamePk:w.gamePk, gameLabel:w.gameLabel
        };
      });
      var snapshot = {date:today, batters:top15Snap, pitchers:pitcherSnap, walks:walkSnap, savedAt:new Date().toISOString()};
      localStorage.setItem("de_snapshot_"+today, JSON.stringify(snapshot));
      // Clean up old snapshots (keep last 30 days)
      for(var si=0;si<localStorage.length;si++){
        var lsKey=localStorage.key(si);
        if(lsKey&&lsKey.startsWith("de_snapshot_")&&lsKey<"de_snapshot_"+new Date(Date.now()-30*86400000).toISOString().slice(0,10)){
          localStorage.removeItem(lsKey);
        }
      }
    }catch(snapErr){ /* localStorage may be unavailable, silently skip */ }
  }

  function handleSelectGameFromHome(gamePk){
    var game=games.find(function(g){return g.gamePk===gamePk;});
    if(game){
      setPage("game");
      loadMatchups(game);
    }
  }

  function goHome(){
    setPage("home");
    setSelectedGame(null);
    setMatchups([]);
    setError(null);
  }

  async function loadResults(dateStr){
    setResultsLoading(true);
    setResultsProgress("Loading games...");
    setResultsData(null);
    try{
      var dateGames = await getGamesForDate(dateStr);
      if(dateGames.length === 0){ setResultsData({picks:[], date:dateStr}); setResultsLoading(false); return; }

      // ── Check for pre-game snapshot (cloud first, then localStorage) ──
      var snapshot = null;
      var usedSnapshot = false;
      var snapshotSource = "";

      // 1. Try cloud snapshot (GitHub Pages JSON)
      try{
        setResultsProgress("Checking cloud snapshot...");
        var cloudSnap = await fetch("./snapshots/"+dateStr+".json");
        if(cloudSnap.ok){
          snapshot = await cloudSnap.json();
          snapshotSource = "cloud";
        }
      }catch(e){}

      // 2. Try cloud results (already processed by nightly job)
      var cloudResults = null;
      try{
        var cloudRes = await fetch("./results/"+dateStr+".json");
        if(cloudRes.ok) cloudResults = await cloudRes.json();
      }catch(e){}

      // If cloud results exist, use them directly (fastest path — no box score fetching needed)
      if(cloudResults && cloudResults.batters && cloudResults.batters.length > 0){
        usedSnapshot = true;
        snapshotSource = "cloud-results";
        setResultsProgress("Loading cloud results...");

        var crPicks = cloudResults.batters.map(function(b){
          return {
            batter:{id:b.batterId, fullName:b.batterName},
            pitcher:{id:b.pitcherId||0, fullName:b.pitcherName||""},
            batterTeam:b.batterTeam, pitcherTeam:b.pitcherTeam||"",
            edgeScore:b.edgeScore, bvpStat:b.bvpAvg?{avg:b.bvpAvg,ops:b.bvpOps}:null,
            gamePk:b.gamePk, gameLabel:b.gameLabel,
            actualStats:b.actualStats||null,
            fantasyScore:b.fantasyScore||0
          };
        });
        var crPitchers = (cloudResults.pitchers||[]).map(function(p){
          return {
            pitcher:{id:p.pitcherId, fullName:p.pitcherName},
            team:p.team, oppTeam:p.oppTeam,
            whiffScore:p.whiffScore, seasonStat:null,
            projectedK:p.projectedK, k9:p.k9||0,
            gamePk:p.gamePk, gameLabel:p.gameLabel,
            actualStats:p.actualK!==undefined?{}:null,
            actualK:p.actualK||0, actualIP:p.actualIP||"0",
            actualER:p.actualER||0, actualH:p.actualH||0,
            actualBB:p.actualBB||0,
            hitOver:p.hitProj||false
          };
        });
        var crWalks = (cloudResults.walks||[]).map(function(w){
          return {
            batter:{id:w.batterId, fullName:w.batterName},
            pitcher:{id:w.pitcherId||0, fullName:w.pitcherName||""},
            batterTeam:w.batterTeam, pitcherTeam:w.pitcherTeam||"",
            walkScore:w.walkScore, bvpBB:w.bvpBB||0, bvpPA:w.bvpPA||0, bvpBBRate:w.bvpBBRate||0,
            gamePk:w.gamePk, gameLabel:w.gameLabel,
            actualBB:w.actualBB||0, actualStats:w.actualBB!==undefined?{}:null,
            gotWalk:(w.actualBB||0)>=1
          };
        });

        // Compute summaries from cloud results
        var crTotalFantasy=0, crHitCount=0, crBGradeBatters=0;
        for(var ci=0;ci<crPicks.length;ci++){
          crTotalFantasy+=crPicks[ci].fantasyScore;
          if(crPicks[ci].edgeScore>=55){
            crBGradeBatters++;
            if(crPicks[ci].actualStats&&(parseInt(crPicks[ci].actualStats.hits)||0)>0) crHitCount++;
          }
        }
        var crPitcherOver=0, crPitchersWithStats=0, crTotalK=0;
        for(var cpi=0;cpi<crPitchers.length;cpi++){
          if(crPitchers[cpi].whiffScore>=55&&crPitchers[cpi].actualStats){
            crPitchersWithStats++;
            crTotalK+=crPitchers[cpi].actualK;
            if(crPitchers[cpi].hitOver) crPitcherOver++;
          }
        }

        setResultsData({
          picks:crPicks, pitcherPicks:crPitchers, date:dateStr, usedSnapshot:true, snapshotSource:"cloud-results",
          avgFantasy:crPicks.length>0?(crTotalFantasy/crPicks.length).toFixed(1):"0",
          totalFantasy:crTotalFantasy,
          hitRate:crBGradeBatters>0?((crHitCount/crBGradeBatters)*100).toFixed(0):"0",
          pitcherOverRate:crPitchersWithStats>0?((crPitcherOver/crPitchersWithStats)*100).toFixed(0):"0",
          avgPitcherK:crPitchersWithStats>0?(crTotalK/crPitchersWithStats).toFixed(1):"0",
          totalPitcherK:crTotalK, pitchersWithStats:crPitchersWithStats, pitcherOverCount:crPitcherOver,
          walkPicks:crWalks,
          walkHitRate:crWalks.length>0?((crWalks.filter(function(w){return w.walkScore>=55&&w.gotWalk;}).length/Math.max(crWalks.filter(function(w){return w.walkScore>=55&&w.actualStats;}).length,1))*100).toFixed(0):"0",
          walkHitCount:crWalks.filter(function(w){return w.walkScore>=55&&w.gotWalk;}).length,
          bGradeWalks:crWalks.filter(function(w){return w.walkScore>=55&&w.actualStats;}).length
        });

        // Save to season history
        var crEntry={
          date:dateStr,
          batterHitRate:crBGradeBatters>0?parseFloat(((crHitCount/crBGradeBatters)*100).toFixed(1)):0,
          pitcherOverRate:crPitchersWithStats>0?parseFloat(((crPitcherOver/crPitchersWithStats)*100).toFixed(1)):0,
          batterCount:crBGradeBatters, pitcherCount:crPitchersWithStats,
          walkHitRate:crWalks.filter(function(w){return w.walkScore>=55&&w.gotWalk;}).length>0?parseFloat(((crWalks.filter(function(w){return w.walkScore>=55&&w.gotWalk;}).length/crWalks.filter(function(w){return w.walkScore>=55&&w.actualStats;}).length)*100).toFixed(1)):0,
          walkCount:crWalks.filter(function(w){return w.walkScore>=55&&w.actualStats;}).length
        };
        setSeasonHistory(function(prev){
          var filtered=prev.filter(function(e){return e.date!==dateStr;});
          filtered.push(crEntry);
          filtered.sort(function(a,b){return a.date.localeCompare(b.date);});
          try{localStorage.setItem("de_season_history",JSON.stringify(filtered));}catch(e){}
          return filtered;
        });
        setResultsProgress("");
        setResultsLoading(false);
        return;
      }

      // 3. Fall back to localStorage snapshot
      if(!snapshot){
        try{
          var snapJson = localStorage.getItem("de_snapshot_"+dateStr);
          if(snapJson){ snapshot = JSON.parse(snapJson); snapshotSource = "local"; }
        }catch(e){}
      }

      var allPicks = [];
      var allPitcherPicks = [];

      if(snapshot && snapshot.batters && snapshot.batters.length > 0){
        // ═══ USE FROZEN PRE-GAME SCORES ═══
        usedSnapshot = true;
        setResultsProgress("Using saved pre-game snapshot...");

        // Restore batter picks from snapshot
        for(var si=0; si<snapshot.batters.length; si++){
          var sb = snapshot.batters[si];
          allPicks.push({
            batter: {id:sb.batterId, fullName:sb.batterName},
            pitcher: {id:sb.pitcherId, fullName:sb.pitcherName},
            batterTeam: sb.batterTeam,
            pitcherTeam: sb.pitcherTeam,
            edgeScore: sb.edgeScore,
            bvpStat: sb.bvpAvg ? {avg:sb.bvpAvg, ops:sb.bvpOps} : null,
            gamePk: sb.gamePk,
            gameLabel: sb.gameLabel
          });
        }

        // Restore pitcher picks from snapshot (whiff scores frozen)
        // Still need to fetch season stats for K/9 and projected Ks
        if(snapshot.pitchers && snapshot.pitchers.length > 0){
          for(var spi=0; spi<snapshot.pitchers.length; spi++){
            var sp = snapshot.pitchers[spi];
            var spSeason = await getSeasonStats(sp.pitcherId, "pitching");
            var spK9 = spSeason ? parseFloat(spSeason.strikeoutsPer9Inn)||0 : 0;
            var spProjK = floorHalf((spK9 * 5.5 / 9) * 0.88);
            // Find the pitcher's team/opp from the game schedule
            var spGame = dateGames.find(function(g){return g.gamePk===sp.gamePk;});
            var spTeam = "", spOpp = "";
            if(spGame){
              var spHomeP = spGame.teams.home.probablePitcher;
              var spAwayP = spGame.teams.away.probablePitcher;
              var spHomeAbbr = spGame.teams.home.team.abbreviation || spGame.teams.home.team.name || "HOME";
              var spAwayAbbr = spGame.teams.away.team.abbreviation || spGame.teams.away.team.name || "AWAY";
              if(spHomeP && spHomeP.id === sp.pitcherId){ spTeam=spHomeAbbr; spOpp=spAwayAbbr; }
              else{ spTeam=spAwayAbbr; spOpp=spHomeAbbr; }
            }
            allPitcherPicks.push({
              pitcher: {id:sp.pitcherId, fullName:sp.pitcherName},
              team: spTeam, oppTeam: spOpp,
              whiffScore: sp.whiffScore, seasonStat: spSeason,
              projectedK: spProjK,
              gamePk: sp.gamePk, gameLabel: sp.gameLabel
            });
          }
        }

        // Restore walk picks from snapshot
        var allWalkPicks = [];
        if(snapshot.walks && snapshot.walks.length > 0){
          for(var swi=0;swi<snapshot.walks.length;swi++){
            var sw = snapshot.walks[swi];
            allWalkPicks.push({
              batter:{id:sw.batterId, fullName:sw.batterName},
              pitcher:{id:sw.pitcherId, fullName:sw.pitcherName},
              batterTeam:sw.batterTeam, pitcherTeam:sw.pitcherTeam||"",
              walkScore:sw.walkScore, bvpBB:sw.bvpBB||0, bvpPA:sw.bvpPA||0, bvpBBRate:sw.bvpBBRate||0,
              gamePk:sw.gamePk, gameLabel:sw.gameLabel
            });
          }
        }
      } else {
        // ═══ NO SNAPSHOT — RECALCULATE (fallback for older dates) ═══
        var allWalkPicks = [];
        for(var gi=0; gi<dateGames.length; gi++){
          var game = dateGames[gi];
          var homeId = game.teams.home.team.id;
          var awayId = game.teams.away.team.id;
          var homePitcher = game.teams.home.probablePitcher;
          var awayPitcher = game.teams.away.probablePitcher;
          if(!homePitcher && !awayPitcher) continue;

          var awayAbbr = game.teams.away.team.abbreviation || game.teams.away.team.name || "AWAY";
          var homeAbbr = game.teams.home.team.abbreviation || game.teams.home.team.name || "HOME";
          var gameLabel = awayAbbr + " @ " + homeAbbr;
          setResultsProgress("Scanning " + gameLabel + " (" + (gi+1) + "/" + dateGames.length + ")...");

          var rosters = await Promise.all([getRoster(homeId), getRoster(awayId)]);
          var homeRoster = rosters[0];
          var awayRoster = rosters[1];

          if(homePitcher){
            for(var i=0; i<awayRoster.length; i++){
              var batter = awayRoster[i];
              var r = await Promise.all([
                getBvPSplits(batter.person.id, homePitcher.id),
                getSeasonStats(batter.person.id, "hitting")
              ]);
              if(r[0] && (parseInt(r[0].plateAppearances)||0) >= 5){
                var es = computeEdgeScore(r[0], r[1], r[0].plateAppearances, null, null);
                allPicks.push({
                  batter: batter.person, pitcher: homePitcher,
                  batterTeam: awayAbbr, pitcherTeam: homeAbbr,
                  edgeScore: es.score, bvpStat: r[0],
                  gamePk: game.gamePk, gameLabel: gameLabel
                });
              }
            }
          }
          if(awayPitcher){
            for(var j=0; j<homeRoster.length; j++){
              var batter2 = homeRoster[j];
              var r2 = await Promise.all([
                getBvPSplits(batter2.person.id, awayPitcher.id),
                getSeasonStats(batter2.person.id, "hitting")
              ]);
              if(r2[0] && (parseInt(r2[0].plateAppearances)||0) >= 5){
                var es2 = computeEdgeScore(r2[0], r2[1], r2[0].plateAppearances, null, null);
                allPicks.push({
                  batter: batter2.person, pitcher: awayPitcher,
                  batterTeam: homeAbbr, pitcherTeam: awayAbbr,
                  edgeScore: es2.score, bvpStat: r2[0],
                  gamePk: game.gamePk, gameLabel: gameLabel
                });
              }
            }
          }
        }

        // Pitcher scanning (no snapshot)
        for(var pi=0; pi<dateGames.length; pi++){
          var pGame = dateGames[pi];
          var pHomeId = pGame.teams.home.team.id;
          var pAwayId = pGame.teams.away.team.id;
          var pHomePitcher = pGame.teams.home.probablePitcher;
          var pAwayPitcher = pGame.teams.away.probablePitcher;
          var pAwayAbbr = pGame.teams.away.team.abbreviation || pGame.teams.away.team.name || "AWAY";
          var pHomeAbbr = pGame.teams.home.team.abbreviation || pGame.teams.home.team.name || "HOME";
          var pGameLabel = pAwayAbbr + " @ " + pHomeAbbr;

          setResultsProgress("Scanning pitchers " + (pi+1) + "/" + dateGames.length + "...");

          var pTkRates = {};
          await Promise.all([
            getTeamSeasonStats(pHomeId).then(function(s){if(s) pTkRates[pHomeId]=s;}),
            getTeamSeasonStats(pAwayId).then(function(s){if(s) pTkRates[pAwayId]=s;})
          ]);

          if(pHomePitcher){
            var hpSeason = await getSeasonStats(pHomePitcher.id, "pitching");
            var oppKRate = pTkRates[pAwayId] ? pTkRates[pAwayId].kRate : 0.200;
            var hpWhiff = computeWhiffScore(pHomePitcher, hpSeason, null, oppKRate, []);
            var hpK9 = hpSeason ? parseFloat(hpSeason.strikeoutsPer9Inn)||0 : 0;
            var hpProjK = floorHalf((hpK9 * 5.5 / 9) * 0.88);
            allPitcherPicks.push({
              pitcher: pHomePitcher, team: pHomeAbbr, oppTeam: pAwayAbbr,
              side: "home", whiffScore: hpWhiff.score, seasonStat: hpSeason,
              projectedK: hpProjK, oppKRate: oppKRate,
              gamePk: pGame.gamePk, gameLabel: pGameLabel
            });
          }
          if(pAwayPitcher){
            var apSeason = await getSeasonStats(pAwayPitcher.id, "pitching");
            var oppKRate2 = pTkRates[pHomeId] ? pTkRates[pHomeId].kRate : 0.200;
            var apWhiff = computeWhiffScore(pAwayPitcher, apSeason, null, oppKRate2, []);
            var apK9 = apSeason ? parseFloat(apSeason.strikeoutsPer9Inn)||0 : 0;
            var apProjK = floorHalf((apK9 * 5.5 / 9) * 0.88);
            allPitcherPicks.push({
              pitcher: pAwayPitcher, team: pAwayAbbr, oppTeam: pHomeAbbr,
              side: "away", whiffScore: apWhiff.score, seasonStat: apSeason,
              projectedK: apProjK, oppKRate: oppKRate2,
              gamePk: pGame.gamePk, gameLabel: pGameLabel
            });
          }
        }
      }

      // Sort pitchers by whiff score
      allPitcherPicks.sort(function(a,b){ return b.whiffScore - a.whiffScore; });

      // Sort by edge score, take top 15
      allPicks.sort(function(a,b){ return b.edgeScore - a.edgeScore; });
      var top15 = allPicks.slice(0, 15);

      // Fetch box scores for the unique games in top 15 and pitcher picks
      setResultsProgress("Fetching box scores...");
      var uniqueGames = {};
      for(var p of top15) uniqueGames[p.gamePk] = true;
      for(var pp of allPitcherPicks) uniqueGames[pp.gamePk] = true;
      for(var wp of allWalkPicks) uniqueGames[wp.gamePk] = true;
      var boxScores = {};
      var bsFetches = Object.keys(uniqueGames).map(function(gpk){
        return getGameBoxScore(gpk).then(function(bs){ boxScores[gpk] = bs; });
      });
      await Promise.all(bsFetches);

      // Match each pick to their actual box score line
      for(var k=0; k<top15.length; k++){
        var pick = top15[k];
        var bs = boxScores[pick.gamePk];
        pick.actualStats = null;
        pick.fantasyScore = 0;
        if(bs){
          // Check both teams' batters
          var allPlayers = Object.assign({},
            bs.teams && bs.teams.home && bs.teams.home.players ? bs.teams.home.players : {},
            bs.teams && bs.teams.away && bs.teams.away.players ? bs.teams.away.players : {}
          );
          var playerKey = "ID" + pick.batter.id;
          var pData = allPlayers[playerKey];
          if(pData && pData.stats && pData.stats.batting){
            pick.actualStats = pData.stats.batting;
            pick.fantasyScore = computeFantasyScore(pick.actualStats);
          } else if(pData && pData.seasonStats && pData.seasonStats.batting){
            // Fallback: some box score formats nest differently
            pick.actualStats = pData.seasonStats.batting;
            pick.fantasyScore = computeFantasyScore(pick.actualStats);
          }
        }
      }

      // Match pitcher picks to actual box score
      for(var pk=0; pk<allPitcherPicks.length; pk++){
        var pPick = allPitcherPicks[pk];
        var pBs = boxScores[pPick.gamePk];
        pPick.actualStats = null;
        pPick.actualK = 0;
        pPick.actualIP = "0";
        pPick.actualLine = "";
        if(pBs){
          var pAllPlayers = Object.assign({},
            pBs.teams && pBs.teams.home && pBs.teams.home.players ? pBs.teams.home.players : {},
            pBs.teams && pBs.teams.away && pBs.teams.away.players ? pBs.teams.away.players : {}
          );
          var pPlayerKey = "ID" + pPick.pitcher.id;
          var ppData = pAllPlayers[pPlayerKey];
          if(ppData && ppData.stats && ppData.stats.pitching){
            var ps = ppData.stats.pitching;
            pPick.actualStats = ps;
            pPick.actualK = parseInt(ps.strikeOuts)||0;
            pPick.actualIP = ps.inningsPitched||"0";
            pPick.actualER = parseInt(ps.earnedRuns)||0;
            pPick.actualH = parseInt(ps.hits)||0;
            pPick.actualBB = parseInt(ps.baseOnBalls)||0;
            pPick.actualLine = pPick.actualIP + " IP, " + pPick.actualK + " K, " + (parseInt(ps.earnedRuns)||0) + " ER, " + (parseInt(ps.hits)||0) + " H";
          }
        }
        pPick.hitOver = pPick.actualStats ? (pPick.actualK >= pPick.projectedK) : false;
      }

      // Match walk picks to actual box score
      for(var wk=0; wk<allWalkPicks.length; wk++){
        var wPick = allWalkPicks[wk];
        var wBs = boxScores[wPick.gamePk];
        wPick.actualBB = 0;
        wPick.actualStats = null;
        wPick.gotWalk = false;
        if(wBs){
          var wAllPlayers = Object.assign({},
            wBs.teams && wBs.teams.home && wBs.teams.home.players ? wBs.teams.home.players : {},
            wBs.teams && wBs.teams.away && wBs.teams.away.players ? wBs.teams.away.players : {}
          );
          var wPlayerKey = "ID" + wPick.batter.id;
          var wData = wAllPlayers[wPlayerKey];
          if(wData && wData.stats && wData.stats.batting){
            wPick.actualStats = wData.stats.batting;
            wPick.actualBB = parseInt(wData.stats.batting.baseOnBalls)||0;
            wPick.gotWalk = wPick.actualBB >= 1;
          }
        }
      }

      // Pitcher summary stats (B grade = 55+ whiff score only)
      var pitcherOverCount = 0;
      var totalPitcherK = 0;
      var pitchersWithStats = 0;
      for(var pm=0; pm<allPitcherPicks.length; pm++){
        if(allPitcherPicks[pm].whiffScore >= 55 && allPitcherPicks[pm].actualStats){
          pitchersWithStats++;
          totalPitcherK += allPitcherPicks[pm].actualK;
          if(allPitcherPicks[pm].hitOver) pitcherOverCount++;
        }
      }

      // Walk summary stats (B grade = 55+ walk score only)
      var walkHitCount = 0;
      var bGradeWalks = 0;
      for(var wm=0; wm<allWalkPicks.length; wm++){
        if(allWalkPicks[wm].walkScore >= 55 && allWalkPicks[wm].actualStats){
          bGradeWalks++;
          if(allWalkPicks[wm].gotWalk) walkHitCount++;
        }
      }

      // Compute summary stats (B grade = 55+ edge score only for hit rate)
      var totalFantasy = 0;
      var hitCount = 0;
      var bGradeBatters = 0;
      for(var m=0; m<top15.length; m++){
        totalFantasy += top15[m].fantasyScore;
        if(top15[m].edgeScore >= 55){
          bGradeBatters++;
          if(top15[m].actualStats && (parseInt(top15[m].actualStats.hits)||0) > 0) hitCount++;
        }
      }

      setResultsData({
        picks: top15,
        pitcherPicks: allPitcherPicks,
        date: dateStr,
        usedSnapshot: usedSnapshot, snapshotSource: snapshotSource,
        avgFantasy: top15.length > 0 ? (totalFantasy / top15.length).toFixed(1) : "0",
        totalFantasy: totalFantasy,
        hitRate: bGradeBatters > 0 ? ((hitCount / bGradeBatters) * 100).toFixed(0) : "0",
        pitcherOverRate: pitchersWithStats > 0 ? ((pitcherOverCount / pitchersWithStats) * 100).toFixed(0) : "0",
        avgPitcherK: pitchersWithStats > 0 ? (totalPitcherK / pitchersWithStats).toFixed(1) : "0",
        totalPitcherK: totalPitcherK,
        pitchersWithStats: pitchersWithStats,
        pitcherOverCount: pitcherOverCount,
        walkPicks: allWalkPicks,
        walkHitRate: bGradeWalks > 0 ? ((walkHitCount / bGradeWalks) * 100).toFixed(0) : "0",
        walkHitCount: walkHitCount,
        bGradeWalks: bGradeWalks
      });

      // Auto-save to season history (state + localStorage)
      var newEntry = {
        date: dateStr,
        batterHitRate: bGradeBatters > 0 ? parseFloat(((hitCount / bGradeBatters) * 100).toFixed(1)) : 0,
        pitcherOverRate: pitchersWithStats > 0 ? parseFloat(((pitcherOverCount / pitchersWithStats) * 100).toFixed(1)) : 0,
        batterCount: bGradeBatters,
        pitcherCount: pitchersWithStats,
        walkHitRate: bGradeWalks > 0 ? parseFloat(((walkHitCount / bGradeWalks) * 100).toFixed(1)) : 0,
        walkCount: bGradeWalks
      };
      setSeasonHistory(function(prev){
        var filtered = prev.filter(function(e){ return e.date !== dateStr; });
        filtered.push(newEntry);
        filtered.sort(function(a,b){ return a.date.localeCompare(b.date); });
        // Persist to localStorage
        try{ localStorage.setItem("de_season_history", JSON.stringify(filtered)); }catch(e){}
        return filtered;
      });

      setResultsProgress("");
    }catch(e){
      setResultsProgress("Error: " + e.message);
    }
    setResultsLoading(false);
  }

  async function loadMatchups(game){
    setSelectedGame(game);
    setMatchups([]);
    setPitcherSeasonStats({});
    setPitcherExtras({});
    setGameWeather(null);
    setLoading(true);
    setError(null);
    setProgress("");
    try{
      var homeId=game.teams.home.team.id;
      var awayId=game.teams.away.team.id;
      var homePitcher=game.teams.home.probablePitcher;
      var awayPitcher=game.teams.away.probablePitcher;

      // Determine if day game
      var gameHour=new Date(game.gameDate).getHours();
      var isDayGame=gameHour<17;

      var both=await Promise.all([getRoster(homeId),getRoster(awayId)]);
      var homeRoster=both[0];
      var awayRoster=both[1];

      // Fetch pitcher season stats + extras (including venue) + team K rates in parallel
      var pitcherStats={};
      var pExtras={};
      var tkRates={};
      var pf=[];
      if(homePitcher){
        pf.push(getSeasonStats(homePitcher.id,"pitching").then(function(s){pitcherStats[homePitcher.id]=s;}));
        pf.push(fetchAllPitcherExtras(homePitcher.id,true,isDayGame,homeId).then(function(e){pExtras[homePitcher.id]=e;}));
      }
      if(awayPitcher){
        pf.push(getSeasonStats(awayPitcher.id,"pitching").then(function(s){pitcherStats[awayPitcher.id]=s;}));
        pf.push(fetchAllPitcherExtras(awayPitcher.id,false,isDayGame,homeId).then(function(e){pExtras[awayPitcher.id]=e;}));
      }
      // Fetch team K rates for both teams
      pf.push(getTeamSeasonStats(homeId).then(function(s){if(s) tkRates[homeId]=s;}));
      pf.push(getTeamSeasonStats(awayId).then(function(s){if(s) tkRates[awayId]=s;}));
      // Fetch weather for this game's venue
      var weatherData = null;
      var venueId = game.venue ? game.venue.id : null;
      if(venueId){
        pf.push(getGameWeather(venueId, game.gameDate).then(function(w){ weatherData = w; }));
      }
      await Promise.all(pf);
      setPitcherSeasonStats(pitcherStats);
      setPitcherExtras(pExtras);
      setTeamKRates(tkRates);
      setGameWeather(weatherData);

      var results=[];
      var done=0;
      var total=(homePitcher?awayRoster.length:0)+(awayPitcher?homeRoster.length:0);

      if(homePitcher){
        for(var i=0;i<awayRoster.length;i++){
          var batter=awayRoster[i];
          var r=await Promise.all([
            getBvPSplits(batter.person.id,homePitcher.id),
            getSeasonStats(batter.person.id,"hitting"),
            safeVenueStat(batter.person.id,homeId,false,"hitting"),
            getBatterKRateHistory(batter.person.id)
          ]);
          done++;
          setProgress("Querying "+done+"/"+total+" matchups...");
          if(r[0]&&(r[0].plateAppearances||0)>=1){
            var esResult=computeEdgeScore(r[0],r[1],r[0].plateAppearances,r[2],weatherData);
            results.push({batter:batter.person,pitcher:homePitcher,pitcherTeam:game.teams.home.team.name,
              batterTeam:game.teams.away.team.abbreviation||game.teams.away.team.name,
              side:"away",stat:r[0],seasonStat:r[1],venueStat:r[2],
              edgeScore:esResult.score,parkDelta:esResult.parkDelta,weatherDelta:esResult.weatherDelta,batterKHistory:r[3]});
          }
        }
      }
      if(awayPitcher){
        for(var j=0;j<homeRoster.length;j++){
          var batter2=homeRoster[j];
          var r2=await Promise.all([
            getBvPSplits(batter2.person.id,awayPitcher.id),
            getSeasonStats(batter2.person.id,"hitting"),
            safeVenueStat(batter2.person.id,homeId,true,"hitting"),
            getBatterKRateHistory(batter2.person.id)
          ]);
          done++;
          setProgress("Querying "+done+"/"+total+" matchups...");
          if(r2[0]&&(r2[0].plateAppearances||0)>=1){
            var esResult2=computeEdgeScore(r2[0],r2[1],r2[0].plateAppearances,r2[2],weatherData);
            results.push({batter:batter2.person,pitcher:awayPitcher,pitcherTeam:game.teams.away.team.name,
              batterTeam:game.teams.home.team.abbreviation||game.teams.home.team.name,
              side:"home",stat:r2[0],seasonStat:r2[1],venueStat:r2[2],
              edgeScore:esResult2.score,parkDelta:esResult2.parkDelta,weatherDelta:esResult2.weatherDelta,batterKHistory:r2[3]});
          }
        }
      }
      setMatchups(results);

      // Compute whiff scores for both pitchers
      var whiffResults = {};
      if(homePitcher && results.length > 0){
        var homeMatchups = results.filter(function(m){return m.pitcher.id === homePitcher.id;});
        var oppKRate = tkRates[awayId] ? tkRates[awayId].kRate : 0.200;
        var whiffRes = computeWhiffScore(homePitcher, pitcherStats[homePitcher.id], pExtras[homePitcher.id], oppKRate, homeMatchups);
        whiffRes.oppTeamKRate = oppKRate;
        whiffResults[homePitcher.id] = whiffRes;
      }
      if(awayPitcher && results.length > 0){
        var awayMatchups = results.filter(function(m){return m.pitcher.id === awayPitcher.id;});
        var oppKRate2 = tkRates[homeId] ? tkRates[homeId].kRate : 0.200;
        var whiffRes2 = computeWhiffScore(awayPitcher, pitcherStats[awayPitcher.id], pExtras[awayPitcher.id], oppKRate2, awayMatchups);
        whiffRes2.oppTeamKRate = oppKRate2;
        whiffResults[awayPitcher.id] = whiffRes2;
      }
      setWhiffScores(whiffResults);

      setProgress("");
    }catch(e){
      setError("Error loading matchup data: "+e.message);
    }
    setLoading(false);
  }

  var filtered = useMemo(function(){
    var f=matchups.filter(function(m){return (m.stat.plateAppearances||0)>=minPA;});
    if(expandedSide!=="both") f=f.filter(function(m){return m.side===expandedSide;});
    f.sort(function(a,b){
      if(sortBy==="edge") return (b.edgeScore||0)-(a.edgeScore||0);
      if(sortBy==="avg") return (parseFloat(b.stat.avg)||0)-(parseFloat(a.stat.avg)||0);
      if(sortBy==="ops") return (parseFloat(b.stat.ops)||0)-(parseFloat(a.stat.ops)||0);
      if(sortBy==="hr") return (b.stat.homeRuns||0)-(a.stat.homeRuns||0);
      if(sortBy==="pa") return (b.stat.plateAppearances||0)-(a.stat.plateAppearances||0);
      return 0;
    });
    return f;
  },[matchups,minPA,expandedSide,sortBy]);

  var hotMatchups=filtered.filter(function(m){return parseFloat(m.stat.avg)>=0.300;});
  var coldMatchups=filtered.filter(function(m){return parseFloat(m.stat.avg)<0.200;});

  var pitcherGroups = useMemo(function(){
    if(!selectedGame) return [];
    var groups=[];
    var hp=selectedGame.teams.home.probablePitcher;
    var ap=selectedGame.teams.away.probablePitcher;
    if(hp){
      var m=matchups.filter(function(x){return x.pitcher.id===hp.id;});
      groups.push({pitcher:hp,matchups:m,side:"home",team:selectedGame.teams.home.team.name,
        vsTeam:selectedGame.teams.away.team.name,seasonStat:pitcherSeasonStats[hp.id],
        extras:pitcherExtras[hp.id]||null});
    }
    if(ap){
      var m2=matchups.filter(function(x){return x.pitcher.id===ap.id;});
      groups.push({pitcher:ap,matchups:m2,side:"away",team:selectedGame.teams.away.team.name,
        vsTeam:selectedGame.teams.home.team.name,seasonStat:pitcherSeasonStats[ap.id],
        extras:pitcherExtras[ap.id]||null});
    }
    return groups;
  },[selectedGame,matchups,pitcherSeasonStats,pitcherExtras]);

  return(
    <div style={{fontFamily:"'DM Mono','Courier New',monospace",background:C.bg,height:"100vh",color:C.text,display:"flex",flexDirection:"column"}}>
      {/* ── Header ── */}
      <div style={{borderBottom:"1px solid "+C.border,padding:"14px 24px",display:"flex",alignItems:"center",justifyContent:"space-between",background:"#0d1220",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <button className="sidebar-toggle" onClick={function(){setSidebarOpen(!sidebarOpen);}} title={sidebarOpen?"Hide games sidebar":"Show games sidebar"}>
            {sidebarOpen?"\u2630":"\u2630"}
          </button>
          <div onClick={goHome} style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:26,letterSpacing:3,color:C.gold,cursor:"pointer"}}>⚾ DIAMOND EDGE</div>
          {(page==="game"||page==="results"||page==="season")&&(
            <button onClick={goHome} style={{padding:"4px 12px",fontSize:10,background:"transparent",color:C.muted,
              border:"1px solid "+C.border,borderRadius:4,cursor:"pointer",fontFamily:"'DM Mono',monospace",letterSpacing:1}}>
              ← HOME
            </button>
          )}
          {(page==="home"||page==="results"||page==="season")&&(
            <div style={{color:C.muted,fontSize:10,letterSpacing:2,paddingTop:4}}>MLB MATCHUP INTELLIGENCE</div>
          )}
        </div>
        {page==="game"&&selectedGame&&(
          <div style={{display:"flex",gap:2}}>
            <button className="tab-btn" onClick={function(){setViewMode("batter");}}
              style={{padding:"6px 16px",fontSize:10,letterSpacing:1,borderRadius:"6px 0 0 0",
                background:viewMode==="batter"?C.gold:"#0d1220",color:viewMode==="batter"?"#000":C.muted,
                border:"1px solid "+(viewMode==="batter"?C.gold:C.border)}}>
              BATTER EDGE
            </button>
            <button className="tab-btn" onClick={function(){setViewMode("pitcher");}}
              style={{padding:"6px 16px",fontSize:10,letterSpacing:1,borderRadius:"0",
                background:viewMode==="pitcher"?C.blue:"#0d1220",color:viewMode==="pitcher"?"#000":C.muted,
                border:"1px solid "+(viewMode==="pitcher"?C.blue:C.border)}}>
              PITCHER EDGE
            </button>
            <button className="tab-btn" onClick={function(){setViewMode("whiff");}}
              style={{padding:"6px 16px",fontSize:10,letterSpacing:1,borderRadius:"0 6px 6px 0",
                background:viewMode==="whiff"?C.purple:"#0d1220",color:viewMode==="whiff"?"#000":C.muted,
                border:"1px solid "+(viewMode==="whiff"?C.purple:C.border)}}>
              WHIFF EDGE
            </button>
          </div>
        )}
      </div>

      <div style={{display:"flex",flex:1,overflow:"hidden"}}>
        {/* ── Sidebar ── */}
        <div className={"sidebar"+(sidebarOpen?"":" collapsed")} style={{width:240,minWidth:sidebarOpen?240:0,borderRight:sidebarOpen?"1px solid "+C.border:"none",overflowY:"auto",padding:sidebarOpen?"12px 0":"0",flexShrink:0}}>
          {/* Home Link */}
          <button className="game-btn" onClick={goHome}
            style={{width:"calc(100% - 8px)",margin:"0 4px 8px",textAlign:"left",
              background:page==="home"?"#1a2234":"transparent",
              border:"1px solid "+(page==="home"?C.gold:"transparent"),
              borderRadius:6,padding:"9px 14px",cursor:"pointer",color:C.text,
              fontFamily:"'DM Mono',monospace"}}>
            <div style={{fontSize:13,fontWeight:500,letterSpacing:1,color:C.gold}}>⚡ TODAY'S EDGES</div>
            <div style={{fontSize:10,color:C.muted,marginTop:2}}>League-wide scanner</div>
          </button>

          {/* Results Link */}
          <button className="game-btn" onClick={function(){setPage("results");}}
            style={{display:"block",width:"calc(100% - 8px)",margin:"0 4px 8px",textAlign:"left",
              background:page==="results"?"#1a2234":"transparent",
              border:"1px solid "+(page==="results"?C.gold:"transparent"),
              borderRadius:6,padding:"9px 14px",cursor:"pointer",color:C.text,
              fontFamily:"'DM Mono',monospace"}}>
            <div style={{fontSize:13,fontWeight:500,letterSpacing:1,color:C.green}}>📊 YESTERDAY'S RESULTS</div>
            <div style={{fontSize:10,color:C.muted,marginTop:2}}>Track model performance</div>
          </button>

          <button className="game-btn" onClick={function(){setPage("season");}}
            style={{display:"block",width:"calc(100% - 8px)",margin:"0 4px 8px",textAlign:"left",
              background:page==="season"?"#1a2234":"transparent",
              border:"1px solid "+(page==="season"?C.gold:"transparent"),
              borderRadius:6,padding:"9px 14px",cursor:"pointer",color:C.text,
              fontFamily:"'DM Mono',monospace"}}>
            <div style={{fontSize:13,fontWeight:500,letterSpacing:1,color:C.purple}}>📈 SEASON RESULTS</div>

          <div style={{padding:"0 14px 10px",fontSize:10,letterSpacing:2,color:C.muted}}>GAMES</div>
          {gamesLoading&&<div style={{padding:"20px 14px",color:C.muted,fontSize:12}} className="loading-pulse">Loading schedule...</div>}
          {!gamesLoading&&games.length===0&&<div style={{padding:"20px 14px",color:C.muted,fontSize:11}}>No games scheduled today.</div>}
          {games.map(function(g){

            var time=new Date(g.gameDate).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",timeZoneName:"short"});
            var gameTopCount=allEdges.filter(function(e){return e.gamePk===g.gamePk&&e.edgeScore>=55;}).length;
            return(
              <button key={g.gamePk} className="game-btn" onClick={function(){setPage("game");loadMatchups(g);}}
                style={{width:"calc(100% - 8px)",margin:"0 4px",textAlign:"left",background:isSelected?"#1a2234":"transparent",border:"1px solid "+(isSelected?C.gold:"transparent"),borderRadius:6,padding:"9px 14px",cursor:"pointer",color:C.text,marginBottom:2,transition:"all 0.15s",fontFamily:"'DM Mono',monospace"}}>

                  <span style={{fontSize:13,fontWeight:500,letterSpacing:1}}>{away} <span style={{color:C.muted}}>@</span> {home}</span>
                  {gameTopCount>0&&<span style={{fontSize:9,color:C.green,fontWeight:600}}>{gameTopCount}⚡</span>}
                </div>
                <div style={{fontSize:10,color:C.muted,marginTop:2}}>{time}</div>
                <div style={{fontSize:10,color:C.subtext,marginTop:1}}>{awayP} / {homeP}</div>
              </button>
            );
          })}
        </div>

        {/* ── Main Panel ── */}
        <div style={{flex:1,overflowY:"auto"}}>

          {/* HOME PAGE */}
          {page==="home"&&(
            <HomePage
              games={games}
              onSelectGame={handleSelectGameFromHome}
              allEdges={allEdges}
              allWhiffScores={allWhiffScores}
              allWalkScores={allWalkScores}
              scanState={scanState}
              onStartScan={scanAllGames}
            />
          )}

          {/* GAME PAGE */}
          {page==="game"&&(
            <div style={{padding:20}}>
              {selectedGame&&(
                <>
                  <div style={{marginBottom:16}}>
                    <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:28,letterSpacing:3}}>
                      {selectedGame.teams.away.team.name} <span style={{color:C.muted,fontSize:18}}>@</span> {selectedGame.teams.home.team.name}
                    </div>
                    <div style={{display:"flex",gap:20,marginTop:6,fontSize:11,color:C.subtext,flexWrap:"wrap",alignItems:"center"}}>
                      <span>Away SP: <span style={{color:C.blue}}>{selectedGame.teams.away.probablePitcher?selectedGame.teams.away.probablePitcher.fullName:"TBD"}</span></span>
                      <span>Home SP: <span style={{color:C.blue}}>{selectedGame.teams.home.probablePitcher?selectedGame.teams.home.probablePitcher.fullName:"TBD"}</span></span>
                      {selectedGame.venue&&selectedGame.venue.name&&(
                        <span style={{color:C.orange}}>🏟 {selectedGame.venue.name}</span>
                      )}
                    </div>
                    {/* Weather Pills */}
                    {gameWeather&&(
                      <div style={{display:"flex",gap:10,marginTop:8,flexWrap:"wrap",alignItems:"center"}}>
                        <StatPill label="TEMP" value={gameWeather.temp+"°F"} color={gameWeather.temp>=85?C.red:gameWeather.temp<=50?C.blue:C.text}/>
                        <StatPill label="WIND" value={gameWeather.windSpeed+" mph"} color={gameWeather.windSpeed>=15?C.gold:C.text}/>
                        <StatPill label="WIND DIR" value={gameWeather.windLabel}
                          color={gameWeather.windLabel==="OUT"?C.green:gameWeather.windLabel==="IN"?C.red:C.subtext}/>
                        <StatPill label="HUMIDITY" value={gameWeather.humidity+"%"} color={C.text}/>
                        {gameWeather.windScoreAdj!==0&&(
                          <StatPill label="WIND EDGE" value={(gameWeather.windScoreAdj>0?"+":"")+gameWeather.windScoreAdj}
                            color={gameWeather.windScoreAdj>0?C.green:C.red}/>
                        )}
                      </div>
                    )}
                  </div>

                  {/* Controls */}
                  <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
                    <div style={{display:"flex",gap:5,alignItems:"center"}}>
                      <span style={{fontSize:10,color:C.muted,letterSpacing:1}}>MIN PA:</span>
                      {[1,5,10,15,20].map(function(n){return(
                        <button key={n} className="sort-btn" onClick={function(){setMinPA(n);}}
                          style={{padding:"4px 9px",fontSize:10,background:minPA===n?C.gold:C.card,color:minPA===n?"#000":C.text,border:"1px solid "+(minPA===n?C.gold:C.border),borderRadius:4,cursor:"pointer",fontFamily:"'DM Mono',monospace"}}>
                          {n}+
                        </button>
                      );})}
                    </div>
                    <div style={{display:"flex",gap:5,alignItems:"center"}}>
                      <span style={{fontSize:10,color:C.muted,letterSpacing:1}}>SORT:</span>
                      {["edge","avg","ops","hr","pa"].map(function(s){return(
                        <button key={s} className="sort-btn" onClick={function(){setSortBy(s);}}
                          style={{padding:"4px 9px",fontSize:10,background:sortBy===s?C.gold:C.card,color:sortBy===s?"#000":C.text,border:"1px solid "+(sortBy===s?C.gold:C.border),borderRadius:4,cursor:"pointer",textTransform:"uppercase",fontFamily:"'DM Mono',monospace"}}>
                          {s==="edge"?"⚡ EDGE":s}
                        </button>
                      );})}
                    </div>
                    <div style={{display:"flex",gap:5,alignItems:"center"}}>
                      <span style={{fontSize:10,color:C.muted,letterSpacing:1}}>SIDE:</span>
                      {[["both","Both"],["away","Away Bat"],["home","Home Bat"]].map(function(pair){return(
                        <button key={pair[0]} className="sort-btn" onClick={function(){setExpandedSide(pair[0]);}}
                          style={{padding:"4px 9px",fontSize:10,background:expandedSide===pair[0]?C.gold:C.card,color:expandedSide===pair[0]?"#000":C.text,border:"1px solid "+(expandedSide===pair[0]?C.gold:C.border),borderRadius:4,cursor:"pointer",fontFamily:"'DM Mono',monospace"}}>
                          {pair[1]}
                        </button>
                      );})}
                    </div>
                    <button className="sort-btn" onClick={function(){setShowSeason(!showSeason);}}
                      style={{padding:"4px 9px",fontSize:10,background:showSeason?C.purple:C.card,color:showSeason?"#000":C.text,border:"1px solid "+(showSeason?C.purple:C.border),borderRadius:4,cursor:"pointer",fontFamily:"'DM Mono',monospace",marginLeft:4}}>
                      {showSeason?"SEASON ✓":"SEASON"}
                    </button>
                    <button className="sort-btn" onClick={function(){setShowPark(!showPark);}}
                      style={{padding:"4px 9px",fontSize:10,background:showPark?C.orange:C.card,color:showPark?"#000":C.text,border:"1px solid "+(showPark?C.orange:C.border),borderRadius:4,cursor:"pointer",fontFamily:"'DM Mono',monospace",marginLeft:4}}>
                      {showPark?"🏟 PARK ✓":"🏟 PARK"}
                    </button>
                  </div>

                  {loading&&(
                    <div style={{textAlign:"center",padding:48,color:C.muted}}>
                      <div style={{fontSize:32,marginBottom:12}} className="loading-pulse">⚙️</div>
                      <div style={{fontSize:13,letterSpacing:2}}>LOADING MATCHUP DATA...</div>
                      <div style={{fontSize:11,marginTop:8,color:C.subtext}}>{progress||"Querying MLB Stats API..."}</div>
                      <div style={{width:200,height:3,background:C.border,borderRadius:2,margin:"12px auto 0",overflow:"hidden"}}>
                        <div style={{height:"100%",background:C.gold,borderRadius:2,transition:"width 0.3s",
                          width:progress?(parseInt(progress.match(/\d+/)[0]||0)/parseInt((progress.match(/\/(\d+)/)||[])[1]||1)*100)+"%":"10%"
                        }}/>
                      </div>
                    </div>
                  )}

                  {error&&(
                    <div style={{background:"#1f1010",border:"1px solid #7f1d1d",borderRadius:8,padding:16,color:"#fca5a5",fontSize:12}}>{error}</div>
                  )}

                  {!loading&&matchups.length===0&&!error&&(
                    <div style={{textAlign:"center",padding:48,color:C.muted,fontSize:13}}>
                      No matchups found. Probable pitchers may not be announced yet.
                    </div>
                  )}

                  {/* BATTER EDGE VIEW */}
                  {!loading&&filtered.length>0&&viewMode==="batter"&&(
                    <>
                      <TopEdgesBanner matchups={filtered}/>
                      {hotMatchups.length>0&&(
                        <div style={{marginBottom:20}} className="fade-in">
                          <div style={{fontSize:10,letterSpacing:2,color:C.green,marginBottom:8}}>🔥 HOT MATCHUPS <span style={{color:C.muted}}>(.300+ BvP AVG)</span></div>
                          <MatchupTable rows={hotMatchups} showEdge={true} showSeason={showSeason} showPark={showPark}/>
                        </div>
                      )}
                      <div style={{marginBottom:20}} className="fade-in">
                        <div style={{fontSize:10,letterSpacing:2,color:C.subtext,marginBottom:8}}>ALL QUALIFIED MATCHUPS ({filtered.length})</div>
                        <MatchupTable rows={filtered} showEdge={true} showSeason={showSeason} showPark={showPark}/>
                      </div>
                      {coldMatchups.length>0&&(
                        <div style={{marginBottom:20}} className="fade-in">
                          <div style={{fontSize:10,letterSpacing:2,color:C.red,marginBottom:8}}>🧊 COLD MATCHUPS <span style={{color:C.muted}}>(sub-.200 BvP AVG)</span></div>
                          <MatchupTable rows={coldMatchups} showEdge={true} showSeason={showSeason} showPark={showPark}/>
                        </div>
                      )}
                    </>
                  )}

                  {/* PITCHER EDGE VIEW */}
                  {!loading&&matchups.length>0&&viewMode==="pitcher"&&(
                    <div className="fade-in">
                      {pitcherGroups.map(function(pg,i){
                        var pgFiltered=pg.matchups.filter(function(m){return (m.stat.plateAppearances||0)>=minPA;});
                        var pgSorted=pgFiltered.slice().sort(function(a,b){
                          if(sortBy==="edge") return (b.edgeScore||0)-(a.edgeScore||0);
                          if(sortBy==="avg") return (parseFloat(b.stat.avg)||0)-(parseFloat(a.stat.avg)||0);
                          if(sortBy==="ops") return (parseFloat(b.stat.ops)||0)-(parseFloat(a.stat.ops)||0);
                          return 0;
                        });
                        return(
                          <div key={i} style={{marginBottom:28}}>
                            <PitcherSummaryCard pitcher={pg.pitcher} matchups={pgFiltered} seasonStat={pg.seasonStat} side={pg.side} extras={pg.extras}/>
                            {pgSorted.length>0?(
                              <>
                                <div style={{fontSize:10,letterSpacing:2,color:C.subtext,marginBottom:8}}>
                                  vs {pg.vsTeam} LINEUP ({pgSorted.length} matchups with {minPA}+ PA)
                                </div>
                                <MatchupTable rows={pgSorted} showEdge={true} showSeason={showSeason} showPark={showPark}/>
                              </>
                            ):(
                              <div style={{color:C.muted,fontSize:12,padding:16,textAlign:"center"}}>
                                No qualified matchups at {minPA}+ PA threshold
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}

                  {/* WHIFF EDGE VIEW */}
                  {!loading&&matchups.length>0&&viewMode==="whiff"&&(
                    <div className="fade-in">
                      {pitcherGroups.map(function(pg,i){
                        var whiffData = whiffScores[pg.pitcher.id];
                        return(
                          <div key={i} style={{marginBottom:28}}>
                            <WhiffCard pitcher={pg.pitcher} matchups={pg.matchups} seasonStat={pg.seasonStat} side={pg.side} extras={pg.extras} whiffData={whiffData}/>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </>
              )}
            </div>
          )}

          {/* RESULTS PAGE */}
          {page==="results"&&(
            <div style={{padding:20}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20,flexWrap:"wrap",gap:12}}>
                <div>
                  <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:28,letterSpacing:3}}>
                    📊 YESTERDAY'S RESULTS
                  </div>
                  {resultsData&&resultsData.usedSnapshot&&(
                    <div style={{fontSize:10,color:C.green,marginTop:4,letterSpacing:1}}>
                      ✓ {resultsData.snapshotSource==="cloud-results"?"CLOUD RESULTS — auto-processed overnight"
                        :resultsData.snapshotSource==="cloud"?"CLOUD SNAPSHOT — scores frozen before first pitch"
                        :"LOCAL SNAPSHOT — scores frozen before first pitch"}
                    </div>
                  )}
                  {resultsData&&!resultsData.usedSnapshot&&resultsData.picks&&resultsData.picks.length>0&&(
                    <div style={{fontSize:10,color:C.muted,marginTop:4,letterSpacing:1}}>

                    </div>

                <div style={{display:"flex",background:C.card,borderRadius:8,border:"1px solid "+C.border,overflow:"hidden"}}>

                      color:resultsTab==="batters"?"#000":C.muted}}>

                  </button>
                  <button onClick={function(){setResultsTab("pitchers");}}
                    style={{padding:"10px 28px",fontSize:13,fontWeight:600,letterSpacing:2,cursor:"pointer",

                      background:resultsTab==="pitchers"?C.purple:"transparent",
                      color:resultsTab==="pitchers"?"#000":C.muted}}>
                    PITCHERS
                  </button>
                  <button onClick={function(){setResultsTab("walks");}}
                    style={{padding:"10px 28px",fontSize:13,fontWeight:600,letterSpacing:2,cursor:"pointer",
                      fontFamily:"'Bebas Neue',sans-serif",border:"none",
                      background:resultsTab==="walks"?C.blue:"transparent",

                  </button>

              </div>

                          var labelDate=d.date.slice(5); // MM-DD
                          return React.createElement("g",{key:"pt-"+idx},
                            React.createElement("circle",{cx:x,cy:yB,r:4,fill:C.gold,stroke:"#0d1220",strokeWidth:2}),
                            React.createElement("circle",{cx:x,cy:yP,r:4,fill:C.purple,stroke:"#0d1220",strokeWidth:2}),
                            React.createElement("circle",{cx:x,cy:yScale(d.walkHitRate||0),r:4,fill:C.blue,stroke:"#0d1220",strokeWidth:2}),
                            React.createElement("text",{x:x,y:H-padB+16,fill:C.muted,fontSize:9,textAnchor:"middle",fontFamily:"'DM Mono',monospace",
                              transform:data.length>10?"rotate(-45,"+x+","+(H-padB+16)+")":""},labelDate),
                            React.createElement("text",{x:x,y:yB-10,fill:C.gold,fontSize:9,textAnchor:"middle",fontFamily:"'DM Mono',monospace"},d.batterHitRate.toFixed(0)+"%"),
                            React.createElement("text",{x:x,y:yP-10,fill:C.purple,fontSize:9,textAnchor:"middle",fontFamily:"'DM Mono',monospace"},d.pitcherOverRate.toFixed(0)+"%"),
                            React.createElement("text",{x:x,y:yScale(d.walkHitRate||0)-10,fill:C.blue,fontSize:9,textAnchor:"middle",fontFamily:"'DM Mono',monospace"},(d.walkHitRate||0).toFixed(0)+"%")
                          );
                        })}
                      </svg>
                    );
                  })()}

                  {/* Summary Stats */}
                  <div style={{display:"flex",gap:16,marginTop:20,flexWrap:"wrap"}}>
                    <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:6,padding:16,flex:"1",minWidth:150}}>
                      <div style={{fontSize:10,color:C.muted,letterSpacing:1,marginBottom:8}}>AVG BATTER HIT RATE</div>
                      <div style={{fontSize:24,fontWeight:600,color:C.gold}}>
                        {(seasonHistory.reduce(function(s,d){return s+d.batterHitRate;},0)/seasonHistory.length).toFixed(1)}%
                      </div>
                    </div>
                    <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:6,padding:16,flex:"1",minWidth:150}}>
                      <div style={{fontSize:10,color:C.muted,letterSpacing:1,marginBottom:8}}>AVG PITCHER HIT PROJ K %</div>
                      <div style={{fontSize:24,fontWeight:600,color:C.purple}}>
                        {(seasonHistory.reduce(function(s,d){return s+d.pitcherOverRate;},0)/seasonHistory.length).toFixed(1)}%
                      </div>
                    </div>
                    <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:6,padding:16,flex:"1",minWidth:150}}>
                      <div style={{fontSize:10,color:C.muted,letterSpacing:1,marginBottom:8}}>AVG WALK HIT RATE</div>
                      <div style={{fontSize:24,fontWeight:600,color:C.blue}}>
                        {(seasonHistory.reduce(function(s,d){return s+(d.walkHitRate||0);},0)/seasonHistory.length).toFixed(1)}%
                      </div>
                    </div>
                    <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:6,padding:16,flex:"1",minWidth:150}}>
                      <div style={{fontSize:10,color:C.muted,letterSpacing:1,marginBottom:8}}>DAYS TRACKED</div>
                      <div style={{fontSize:24,fontWeight:600,color:C.text}}>{seasonHistory.length}</div>
                    </div>
                  </div>

                  {/* Daily breakdown table */}
                  <div style={{marginTop:20,overflowX:"auto"}}>
                    <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
                      <thead>
                        <tr style={{borderBottom:"1px solid "+C.border,background:C.card}}>
                          <th style={{textAlign:"left",padding:"10px 8px",color:C.muted,fontWeight:500,letterSpacing:1}}>DATE</th>
                          <th style={{textAlign:"center",padding:"10px 8px",color:C.gold,fontWeight:500,letterSpacing:1}}>BATTER HIT %</th>
                          <th style={{textAlign:"center",padding:"10px 8px",color:C.purple,fontWeight:500,letterSpacing:1}}>PITCHER HIT PROJ K %</th>
                          <th style={{textAlign:"center",padding:"10px 8px",color:C.blue,fontWeight:500,letterSpacing:1}}>WALK HIT %</th>
                          <th style={{textAlign:"center",padding:"10px 8px",color:C.muted,fontWeight:500,letterSpacing:1}}>BATTERS</th>
                          <th style={{textAlign:"center",padding:"10px 8px",color:C.muted,fontWeight:500,letterSpacing:1}}>PITCHERS</th>
                        </tr>
                      </thead>
                      <tbody>
                        {seasonHistory.slice().reverse().map(function(d,idx){
                          return(
                            <tr key={d.date} style={{borderBottom:"1px solid "+C.border}}>
                              <td style={{padding:"8px",color:C.text}}>{d.date}</td>
                              <td style={{padding:"8px",textAlign:"center",fontWeight:600,color:d.batterHitRate>=60?C.green:d.batterHitRate>=40?C.gold:C.red}}>{d.batterHitRate.toFixed(1)}%</td>
                              <td style={{padding:"8px",textAlign:"center",fontWeight:600,color:d.pitcherOverRate>=60?C.green:d.pitcherOverRate>=40?C.purple:C.red}}>{d.pitcherOverRate.toFixed(1)}%</td>
                              <td style={{padding:"8px",textAlign:"center",fontWeight:600,color:(d.walkHitRate||0)>=60?C.green:(d.walkHitRate||0)>=40?C.blue:C.red}}>{(d.walkHitRate||0).toFixed(1)}%</td>
                              <td style={{padding:"8px",textAlign:"center",color:C.muted}}>{d.batterCount}</td>
                              <td style={{padding:"8px",textAlign:"center",color:C.muted}}>{d.pitcherCount}</td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      </div>

      {/* ── Footer ── */}
      <div style={{borderTop:"1px solid "+C.border,padding:"6px 24px",display:"flex",justifyContent:"space-between",fontSize:9,color:C.muted,background:"#0d1220",flexShrink:0}}>
        <span>Data via MLB Stats API · Career BvP splits + {new Date().getFullYear()} season stats</span>
        <span>Edge scores are weighted composites — not financial advice</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

// Register service worker for PWA
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
