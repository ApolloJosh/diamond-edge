/* ─── Weather Functions ─── */
async function fetchWeather(lat, lon, gameDate){
  try{
    var dateStr = gameDate ? new Date(gameDate).toISOString().slice(0,10) : new Date().toISOString().slice(0,10);
    var url = "https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon
      +"&hourly=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m"
      +"&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FChicago"
      +"&start_date="+dateStr+"&end_date="+dateStr;
    var resp = await fetch(url);
    var data = await resp.json();
    if(!data.hourly) return null;
    // Use ~7pm local (index 19) for night games, ~2pm (index 14) for day
    var gameHour = gameDate ? new Date(gameDate).getHours() : 19;
    var idx = gameHour < 17 ? 14 : 19;
    if(idx >= data.hourly.time.length) idx = data.hourly.time.length - 1;
    return {
      temp: Math.round(data.hourly.temperature_2m[idx]),
      humidity: Math.round(data.hourly.relative_humidity_2m[idx]),
      windSpeed: Math.round(data.hourly.wind_speed_10m[idx]),
      windDir: Math.round(data.hourly.wind_direction_10m[idx])
    };
  }catch(e){ return null; }
}

function computeWindEffect(windDir, windSpeed, stadiumBearing){
  // windDir = meteorological (direction wind comes FROM, in degrees)
  // stadiumBearing = direction from home plate to center field
  // "blowing out" = wind traveling FROM home plate TOWARD center field
  // Wind blows TO = (windDir + 180) % 360
  var windTo = (windDir + 180) % 360;
  var diff = windTo - stadiumBearing;
  // Normalize to -180..180
  if(diff > 180) diff -= 360;
  if(diff < -180) diff += 360;
  var absDiff = Math.abs(diff);

  var direction, factor;
  if(absDiff <= 45){
    direction = "OUT";
    // Scale: 0° diff = full effect, 45° = half
    factor = 1.0 - (absDiff / 90);
  } else if(absDiff >= 135){
    direction = "IN";
    factor = -(1.0 - ((180 - absDiff) / 90));
  } else {
    direction = "CROSS";
    factor = 0;
  }

  // Compute score adjustment: wind speed matters
  // Light wind (<5mph) = minimal effect, strong (>15mph) = big effect
  var magnitude = Math.min(windSpeed / 15, 1.5);
  var scoreAdj = Math.round(factor * magnitude * 8); // max ~±12

  return {direction: direction, scoreAdj: scoreAdj, windSpeed: windSpeed, windDir: windDir};
}

async function getGameWeather(venueId, gameDate){
  var venue = VENUE_DATA[venueId];
  if(!venue) return null;
  var raw = await fetchWeather(venue.lat, venue.lon, gameDate);
  if(!raw) return null;
  var isDome = venue.dome === true;
  var isRetractable = venue.retractable === true;
  var wind = isDome ? {direction:"DOME",scoreAdj:0} : computeWindEffect(raw.windDir, raw.windSpeed, venue.bearing);
  return {
    temp: raw.temp,
    humidity: raw.humidity,
    windSpeed: isDome ? 0 : raw.windSpeed,
    windDirDeg: raw.windDir,
    windLabel: isDome ? "DOME" : (isRetractable ? wind.direction+"*" : wind.direction),
    windScoreAdj: isDome ? 0 : wind.scoreAdj,
    venueName: venue.name,
    isDome: isDome,
    isRetractable: isRetractable
  };
}

/* ─── Helpers ─── */
function statColor(avg){
  if(!avg||avg==="---") return C.subtext;
  const v=parseFloat(avg);
  if(v>=0.350) return "#22c55e";
  if(v>=0.300) return "#86efac";
  if(v>=0.250) return C.text;
  if(v>=0.200) return "#fca5a5";
  return "#ef4444";
}
function fmtAvg(val){
  if(val===null||val===undefined||val==="") return "---";
  const v=parseFloat(val);
  if(isNaN(v)) return "---";
  return v.toFixed(3).replace(/^0/,"");
}
function fmtOps(val){
  if(val===null||val===undefined||val==="") return "---";
  const v=parseFloat(val);
  if(isNaN(v)) return "---";
  return v.toFixed(3);
}
function fmtEra(val){
  if(val===null||val===undefined||val==="") return "---";
  const v=parseFloat(val);
  if(isNaN(v)) return "---";
  return v.toFixed(2);
}
function eraColor(era){
  if(!era||era==="---") return C.subtext;
  const v=parseFloat(era);
  if(v<=2.50) return "#22c55e";
  if(v<=3.50) return "#86efac";
  if(v<=4.50) return C.text;
  if(v<=5.50) return "#fca5a5";
  return "#ef4444";
}

/* ─── Edge Score Engine ─── */
function computeEdgeScore(bvpStat, seasonStat, pa, venueStat, weather){
  if(!bvpStat) return {score:0, parkDelta:0, weatherDelta:0};
  let score = 50;
  const bvpAvg = parseFloat(bvpStat.avg)||0;
  const bvpOps = parseFloat(bvpStat.ops)||0;
  const bvpPA = parseInt(pa)||parseInt(bvpStat.plateAppearances)||0;
  score += (bvpAvg - 0.250) * 100;
  score += (bvpOps - 0.700) * 25;
  const sampleFactor = Math.min(bvpPA / 30, 1.5);
  score = 50 + (score - 50) * sampleFactor;
  const hrs = parseInt(bvpStat.homeRuns)||0;
  if(hrs >= 3) score += 8;
  else if(hrs >= 1) score += 4;
  const abs = parseInt(bvpStat.atBats)||1;
  const ks = parseInt(bvpStat.strikeOuts)||0;
  const kRate = ks/abs;
  if(kRate > 0.35) score -= 8;
  if(seasonStat){
    const sAvg = parseFloat(seasonStat.avg)||0;
    const sOps = parseFloat(seasonStat.ops)||0;
    if(sAvg >= 0.300) score += 6;
    else if(sAvg >= 0.270) score += 3;
    else if(sAvg < 0.200) score -= 5;
    if(sOps >= 0.850) score += 5;
    else if(sOps < 0.600) score -= 4;
  }
  // Ballpark factor — weighted by sample size (need 5+ games to apply)
  var parkDelta = 0;
  if(venueStat && venueStat.gamesPlayed >= 5){
    const vOps = parseFloat(venueStat.stat.ops)||0;
    const vFactor = Math.min(venueStat.gamesPlayed / 20, 1.0);
    var raw = 0;
    if(vOps >= 0.900) raw = 10;
    else if(vOps >= 0.800) raw = 6;
    else if(vOps >= 0.720) raw = 3;
    else if(vOps < 0.500) raw = -10;
    else if(vOps < 0.600) raw = -6;
    else if(vOps < 0.660) raw = -3;
    parkDelta = Math.round(raw * vFactor);
    score += parkDelta;
  }
  // Weather / wind factor (batter edge only)
  var weatherDelta = 0;
  if(weather && weather.windScoreAdj){
    weatherDelta = weather.windScoreAdj;
    score += weatherDelta;
  }
  // Temperature bonus: hot air = more carry
  if(weather && weather.temp){
    if(weather.temp >= 90) { weatherDelta += 3; score += 3; }
    else if(weather.temp >= 80) { weatherDelta += 1; score += 1; }
    else if(weather.temp <= 45) { weatherDelta -= 3; score -= 3; }
    else if(weather.temp <= 55) { weatherDelta -= 1; score -= 1; }
  }
  return {score:Math.max(0, Math.min(99, Math.round(score))), parkDelta:parkDelta, weatherDelta:weatherDelta};
}
function edgeGrade(score){
  if(score >= 80) return {grade:"A+",color:"#22c55e"};
  if(score >= 70) return {grade:"A",color:"#4ade80"};
  if(score >= 62) return {grade:"B+",color:"#86efac"};
  if(score >= 55) return {grade:"B",color:C.text};
  if(score >= 45) return {grade:"C",color:C.subtext};
  if(score >= 35) return {grade:"D",color:"#fca5a5"};
  return {grade:"F",color:"#ef4444"};
}
function pitcherEdgeScore(matchups, extras){
  if(!matchups||matchups.length===0) return 50;
  const totalPA = matchups.reduce((s,m)=>s+(parseInt(m.stat.plateAppearances)||0),0);
  const totalAB = matchups.reduce((s,m)=>s+(parseInt(m.stat.atBats)||0),0);
  const totalH = matchups.reduce((s,m)=>s+(parseInt(m.stat.hits)||0),0);
  const totalK = matchups.reduce((s,m)=>s+(parseInt(m.stat.strikeOuts)||0),0);
  const totalHR = matchups.reduce((s,m)=>s+(parseInt(m.stat.homeRuns)||0),0);
  const totalBB = matchups.reduce((s,m)=>s+(parseInt(m.stat.baseOnBalls)||0),0);
  if(totalAB===0) return 50;
  const avgAgainst = totalH/totalAB;
  const kRate = totalK/totalAB;
  const bbRate = totalBB/totalPA;
  const hrRate = totalHR/totalAB;
  let score = 50;
  score += (0.250 - avgAgainst) * 120;
  score += (kRate - 0.22) * 60;
  score += (0.08 - bbRate) * 40;
  score += (0.03 - hrRate) * 80;
  const sampleFactor = Math.min(totalPA / 60, 1.3);
  score = 50 + (score - 50) * sampleFactor;

  // Home/Road split bonus (extras.splitStat = the relevant home or away split)
  if(extras && extras.splitStat){
    var splitEra = parseFloat(extras.splitStat.era);
    if(!isNaN(splitEra)){
      if(splitEra <= 2.80) score += 6;
      else if(splitEra <= 3.50) score += 3;
      else if(splitEra >= 5.50) score -= 5;
      else if(splitEra >= 4.80) score -= 3;
    }
  }
  // Day/Night split bonus
  if(extras && extras.dayNightStat){
    var dnEra = parseFloat(extras.dayNightStat.era);
    if(!isNaN(dnEra)){
      if(dnEra <= 2.80) score += 4;
      else if(dnEra <= 3.50) score += 2;
      else if(dnEra >= 5.50) score -= 4;
      else if(dnEra >= 4.80) score -= 2;
    }
  }
  // Recent starts trend bonus
  if(extras && extras.lastThree){
    var l3era = parseFloat(extras.lastThree.era);
    if(!isNaN(l3era)){
      if(l3era <= 2.00) score += 7;
      else if(l3era <= 3.00) score += 4;
      else if(l3era <= 3.80) score += 1;
      else if(l3era >= 7.00) score -= 7;
      else if(l3era >= 5.50) score -= 4;
      else if(l3era >= 4.50) score -= 1;
    }
  }
  // Ballpark factor — how does this pitcher perform at this venue?
  var parkDelta = 0;
  if(extras && extras.venueStat && (extras.venueStat.gamesPlayed||0) >= 3){
    var vEra = parseFloat(extras.venueStat.stat.era);
    if(!isNaN(vEra)){
      var vFactor = Math.min((extras.venueStat.gamesPlayed||0) / 10, 1.0);
      var raw = 0;
      if(vEra <= 2.50) raw = 10;
      else if(vEra <= 3.25) raw = 6;
      else if(vEra <= 3.80) raw = 3;
      else if(vEra >= 7.00) raw = -10;
      else if(vEra >= 5.50) raw = -6;
      else if(vEra >= 4.80) raw = -3;
      parkDelta = Math.round(raw * vFactor);
      score += parkDelta;
    }
  }
  return {score:Math.max(0, Math.min(99, Math.round(score))), parkDelta:parkDelta};
}

function computeWhiffScore(pitcher, seasonStat, extras, oppTeamKRate, matchups){
  if(!pitcher) return {score:50, factors:{}};
  var score = 50;
  var factors = {};

  // 1. Pitcher K/9
  var k9 = parseFloat(seasonStat && seasonStat.strikeoutsPer9Inn)||0;
  if(k9 >= 10.0) factors.pitcherK9 = 12;
  else if(k9 >= 9.0) factors.pitcherK9 = 8;
  else if(k9 >= 8.0) factors.pitcherK9 = 4;
  else if(k9 < 6.0) factors.pitcherK9 = -8;
  else if(k9 < 7.0) factors.pitcherK9 = -4;
  else factors.pitcherK9 = 0;
  score += factors.pitcherK9;

  // 2. Opposing team K rate
  if(oppTeamKRate >= 0.260) factors.oppTeamK = 10;
  else if(oppTeamKRate >= 0.240) factors.oppTeamK = 6;
  else if(oppTeamKRate >= 0.220) factors.oppTeamK = 3;
  else if(oppTeamKRate < 0.180) factors.oppTeamK = -8;
  else if(oppTeamKRate < 0.200) factors.oppTeamK = -4;
  else factors.oppTeamK = 0;
  score += factors.oppTeamK;

  // 3. BvP K rate vs this lineup
  var totalAB = 0, totalK = 0;
  if(matchups && Array.isArray(matchups)){
    for(var m of matchups){
      totalAB += parseInt(m.stat.atBats)||0;
      totalK += parseInt(m.stat.strikeOuts)||0;
    }
  }
  var bvpKRate = totalAB > 0 ? (totalK / totalAB) : 0;
  if(bvpKRate >= 0.30) factors.bvpK = 10;
  else if(bvpKRate >= 0.25) factors.bvpK = 6;
  else if(bvpKRate >= 0.20) factors.bvpK = 3;
  else if(bvpKRate < 0.12) factors.bvpK = -8;
  else if(bvpKRate < 0.15) factors.bvpK = -4;
  else factors.bvpK = 0;
  score += factors.bvpK;

  // 4. Park ERA as K-friendliness proxy
  factors.parkK = 0;
  if(extras && extras.venueStat && (extras.venueStat.gamesPlayed||0) >= 3){
    var parkEra = parseFloat(extras.venueStat.stat.era)||0;
    if(parkEra <= 3.00) factors.parkK = 4;
    else if(parkEra >= 5.00) factors.parkK = -4;
  }
  score += factors.parkK;

  // 5. Home/Road split K/9
  factors.splitK = 0;
  if(extras && extras.splitStat){
    var splitK9 = parseFloat(extras.splitStat.strikeoutsPer9Inn)||0;
    if(splitK9 >= 9.5) factors.splitK = 4;
    else if(splitK9 <= 6.5) factors.splitK = -4;
  }
  score += factors.splitK;

  // 6. Recent starts K/9
  factors.recentK = 0;
  if(extras && extras.lastThree){
    var l3K9 = parseFloat(extras.lastThree.kPer9)||0;
    if(l3K9 >= 10.0) factors.recentK = 6;
    else if(l3K9 >= 9.0) factors.recentK = 3;
    else if(l3K9 < 6.0) factors.recentK = -6;
    else if(l3K9 < 7.0) factors.recentK = -3;
  }
  score += factors.recentK;

  return {score:Math.max(0, Math.min(99, Math.round(score))), factors:factors, bvpKRate:bvpKRate};
}

function whiffGrade(score){
  if(score >= 80) return {grade:"A+",color:"#c084fc"};
  if(score >= 70) return {grade:"A",color:"#d8b4fe"};
  if(score >= 62) return {grade:"B+",color:"#e9d5ff"};
  if(score >= 55) return {grade:"B",color:C.purple};
  if(score >= 45) return {grade:"C",color:C.subtext};
  if(score >= 35) return {grade:"D",color:"#fca5a5"};
  return {grade:"F",color:"#ef4444"};
}

function walkGrade(score){
  if(score >= 80) return {grade:"A+",color:"#06b6d4"};
  if(score >= 70) return {grade:"A",color:"#22d3ee"};
  if(score >= 62) return {grade:"B+",color:"#67e8f9"};
  if(score >= 55) return {grade:"B",color:C.blue};
  if(score >= 45) return {grade:"C",color:C.subtext};
  if(score >= 35) return {grade:"D",color:"#fca5a5"};
  return {grade:"F",color:"#ef4444"};
}

/* ─── Walk Score Engine ─── */
async function getBatterRecentBBRate(playerId){
  try{
    var year=new Date().getFullYear();
    var both=await Promise.all([
      fetchJSON(BASE+"/people/"+playerId+"/stats?stats=gameLog&group=hitting&season="+year),
      fetchJSON(BASE+"/people/"+playerId+"/stats?stats=gameLog&group=hitting&season="+(year-1))
    ]);
    var games=[];
    for(var sg of (both[1].stats||[])){
      if(sg.group&&sg.group.displayName==="hitting"){
        for(var sp of (sg.splits||[])) games.push(sp);
      }
    }
    for(var sg2 of (both[0].stats||[])){
      if(sg2.group&&sg2.group.displayName==="hitting"){
        for(var sp2 of (sg2.splits||[])) games.push(sp2);
      }
    }
    var recent=games.slice(-10);
    if(recent.length===0) return null;
    var totalPA=0, totalBB=0;
    for(var g of recent){
      var s=g.stat||{};
      totalPA+=parseInt(s.plateAppearances)||0;

function computeWalkScore(bvpStat, batterSeasonStat, batterRecentBB, batterCareerBB, pitcherSeasonStat, pitcherRecentBB, pitcherCareerBB){
  var score = 50;
  var factors = {};

  // 1. BvP walk history (weight: high)
  var bvpPA = parseInt(bvpStat.plateAppearances)||0;
  var bvpBB = parseInt(bvpStat.baseOnBalls)||0;
  var bvpBBRate = bvpPA > 0 ? (bvpBB / bvpPA) : 0;
  if(bvpBBRate >= 0.18) factors.bvpBB = 12;
  else if(bvpBBRate >= 0.14) factors.bvpBB = 8;
  else if(bvpBBRate >= 0.10) factors.bvpBB = 4;
  else if(bvpBBRate < 0.04) factors.bvpBB = -8;
  else if(bvpBBRate < 0.06) factors.bvpBB = -4;
  else factors.bvpBB = 0;
  // Sample size dampener
  var sampleFactor = Math.min(bvpPA / 20, 1.2);
  factors.bvpBB = Math.round(factors.bvpBB * sampleFactor);
  score += factors.bvpBB;

  // 2. Batter recent BB% trend (last 10 games) (weight: high)
  factors.batterRecent = 0;
  if(batterRecentBB){
    var brRate = batterRecentBB.bbRate;
    if(brRate >= 0.14) factors.batterRecent = 10;
    else if(brRate >= 0.11) factors.batterRecent = 6;
    else if(brRate >= 0.09) factors.batterRecent = 3;
    else if(brRate < 0.04) factors.batterRecent = -8;
    else if(brRate < 0.06) factors.batterRecent = -4;
    else factors.batterRecent = 0;
  }
  score += factors.batterRecent;

  // 3. Batter season BB% (weight: medium)
  factors.batterSeason = 0;
  if(batterSeasonStat){
    var sPa = parseInt(batterSeasonStat.plateAppearances)||0;
    var sBb = parseInt(batterSeasonStat.baseOnBalls)||0;
    var sBBRate = sPa > 0 ? (sBb / sPa) : 0;
    if(sBBRate >= 0.13) factors.batterSeason = 6;
    else if(sBBRate >= 0.10) factors.batterSeason = 3;
    else if(sBBRate < 0.05) factors.batterSeason = -5;
    else if(sBBRate < 0.07) factors.batterSeason = -2;
    else factors.batterSeason = 0;
  }
  score += factors.batterSeason;

  // 4. Batter career BB% (weight: low — stabilizing factor)
  factors.batterCareer = 0;
  if(batterCareerBB){
    var cRate = batterCareerBB.bbRate;
    if(cRate >= 0.12) factors.batterCareer = 4;
    else if(cRate >= 0.10) factors.batterCareer = 2;
    else if(cRate < 0.05) factors.batterCareer = -4;
    else if(cRate < 0.07) factors.batterCareer = -2;
    else factors.batterCareer = 0;
  }
  score += factors.batterCareer;

  // 5. Pitcher recent BB% trend (last 5 starts) (weight: high)
  factors.pitcherRecent = 0;
  if(pitcherRecentBB){
    var prRate = pitcherRecentBB.bbRate;
    if(prRate >= 0.12) factors.pitcherRecent = 10;
    else if(prRate >= 0.09) factors.pitcherRecent = 6;
    else if(prRate >= 0.07) factors.pitcherRecent = 3;
    else if(prRate < 0.03) factors.pitcherRecent = -8;
    else if(prRate < 0.05) factors.pitcherRecent = -4;
    else factors.pitcherRecent = 0;
  }
  score += factors.pitcherRecent;

  // 6. Pitcher season BB% (weight: medium)
  factors.pitcherSeason = 0;
  if(pitcherSeasonStat){
    var pBB9 = parseFloat(pitcherSeasonStat.baseOnBallsPer9Inn)||0;
    if(pBB9 >= 4.5) factors.pitcherSeason = 8;
    else if(pBB9 >= 3.5) factors.pitcherSeason = 4;
    else if(pBB9 >= 2.8) factors.pitcherSeason = 1;
    else if(pBB9 < 1.5) factors.pitcherSeason = -6;
    else if(pBB9 < 2.0) factors.pitcherSeason = -3;
    else factors.pitcherSeason = 0;
  }
  score += factors.pitcherSeason;

  // 7. Pitcher career BB tendency (weight: low — stabilizer)
  factors.pitcherCareer = 0;
  if(pitcherCareerBB){
    var pcBB9 = pitcherCareerBB.bb9||0;
    if(pcBB9 >= 4.0) factors.pitcherCareer = 4;
    else if(pcBB9 >= 3.2) factors.pitcherCareer = 2;
    else if(pcBB9 < 1.8) factors.pitcherCareer = -4;
    else if(pcBB9 < 2.2) factors.pitcherCareer = -2;
    else factors.pitcherCareer = 0;
  }
  score += factors.pitcherCareer;

  return {score:Math.max(0, Math.min(99, Math.round(score))), factors:factors, bvpBBRate:bvpBBRate};
}

function walkGrade(score){

/* ─── PrizePicks Fantasy Score Calculator ─── */
function computeFantasyScore(boxStats){
  if(!boxStats) return 0;
  var score = 0;
  var hits = parseInt(boxStats.hits)||0;
  var doubles = parseInt(boxStats.doubles)||0;
  var triples = parseInt(boxStats.triples)||0;
  var homeRuns = parseInt(boxStats.homeRuns)||0;
  var runs = parseInt(boxStats.runs)||0;
  var rbi = parseInt(boxStats.rbi)||0;
  var walks = parseInt(boxStats.baseOnBalls)||0;
  var hbp = parseInt(boxStats.hitByPitch)||0;
  var sb = parseInt(boxStats.stolenBases)||0;

  // Singles = Hits - Doubles - Triples - HomeRuns
  var singles = hits - doubles - triples - homeRuns;
  if(singles < 0) singles = 0;

  score += singles * 3;
  score += doubles * 5;
  score += triples * 8;
  score += homeRuns * 10;
  score += runs * 2;
  score += rbi * 2;
  score += walks * 2;
  score += hbp * 2;
  score += sb * 5;

  return score;
}

// Floor to nearest 0.5 (e.g. 6.7 → 6.5, 5.3 → 5.0)
function floorHalf(n){ return Math.floor(n * 2) / 2; }

/* ─── K Prop Confidence Engine ─── */
function computeKPropConfidence(line, whiffData, seasonStat, extras){
  if(!whiffData) return null;
  // Use last 10 starts K/9 and avg IP as primary source (more reliable early in season)
  var recentStarts = extras ? extras.lastThree : null;
  var k9 = 0;
  var expectedIP = 5.5;
  if(recentStarts && recentStarts.kPer9){
    k9 = parseFloat(recentStarts.kPer9)||0;
  } else if(seasonStat && seasonStat.strikeoutsPer9Inn){
    k9 = parseFloat(seasonStat.strikeoutsPer9Inn)||0;
  }
  if(recentStarts && recentStarts.avgIP){
    expectedIP = parseFloat(recentStarts.avgIP)||5.5;
  } else if(seasonStat && seasonStat.inningsPitched && seasonStat.gamesStarted){
    var totalIP = parseFloat(seasonStat.inningsPitched)||0;
    var gs = parseInt(seasonStat.gamesStarted)||1;
    expectedIP = totalIP / gs;
  }
  if(k9 === 0) return null;
  // Project Ks: k9 * (expectedIP / 9) with regression adjustment
  // K/9 overstates actual Ks because pitcher efficiency drops later in outings
  // and early hooks / pitch counts limit deep-game Ks. Apply 0.88 deflator.
  var rawProjectedK = k9 * (expectedIP / 9);
  var projectedK = rawProjectedK * 0.88;

  // Whiff score modifier: score > 60 = boost, < 40 = drag
  // Reduced swing to ±15% to prevent over-inflation on high-whiff arms
  var whiffMod = (whiffData.score - 50) / 50; // -1 to ~+1
  var adjustedK = projectedK * (1 + whiffMod * 0.15);

  // How far above/below the line
  var margin = adjustedK - line;

  // Convert margin to confidence (stars 1-5)
  // margin >= 2.5 → 5 stars, margin ~1.5 → 4, margin ~0.5 → 3, margin ~-0.5 → 2, below → 1
  var stars;
  if(margin >= 2.0) stars = 5;
  else if(margin >= 1.2) stars = 4.5;
  else if(margin >= 0.7) stars = 4;
  else if(margin >= 0.3) stars = 3.5;
  else if(margin >= -0.2) stars = 3;
  else if(margin >= -0.7) stars = 2.5;
  else if(margin >= -1.2) stars = 2;
  else if(margin >= -2.0) stars = 1.5;
  else stars = 1;

  return {
    stars: stars,
    projectedK: floorHalf(adjustedK),
    rawProjectedK: floorHalf(projectedK),
    expectedIP: expectedIP.toFixed(1),
    margin: margin.toFixed(1),
    line: line
  };
}

function starDisplay(stars){
  var full = Math.floor(stars);
  var half = stars % 1 >= 0.5;
  var empty = 5 - full - (half ? 1 : 0);
  var result = "";
  for(var i=0;i<full;i++) result += "★";
  if(half) result += "½";
  for(var i=0;i<empty;i++) result += "☆";
  return result;
}

function starColor(stars){
  if(stars >= 4.5) return "#22c55e";
  if(stars >= 4) return "#4ade80";
  if(stars >= 3.5) return "#86efac";
  if(stars >= 3) return C.gold;
  if(stars >= 2.5) return C.orange;
  if(stars >= 2) return "#fca5a5";
  return "#ef4444";
}

/* Parse MLB innings pitched notation: "6.2" = 6 and 2/3 innings */
function parseIP(ip){
  var s=String(ip);
  var parts=s.split(".");
  var full=parseInt(parts[0])||0;
  var thirds=parts.length>1?(parseInt(parts[1])||0):0;
  return full+(thirds/3);
}
async function getVenueStat(playerId, homeTeamId, isPlayerHome, group){
  group=group||"hitting";
  if(!homeTeamId) return null;
  try{
    // Fetch career data: last 15 seasons in parallel to cover full career
    var currentYear=new Date().getFullYear();
    var years=[];
    for(var y=currentYear;y>=currentYear-14;y--) years.push(y);
    var fetches=years.map(function(yr){
      return fetch(BASE+"/people/"+playerId+"/stats?stats=gameLog&group="+group+"&season="+yr)
        .then(function(r){return r.ok?r.json():{stats:[]};})
        .catch(function(){return {stats:[]};});
    });
    var allData=await Promise.all(fetches);
    var venueGames=[];
    for(var d=0;d<allData.length;d++){
      var data=allData[d];
      for(var sg of (data.stats||[])){
        if(sg.group&&sg.group.displayName===group){
          for(var sp of (sg.splits||[])){
            var atVenue=false;
            if(isPlayerHome&&sp.isHome) atVenue=true;
            else if(!isPlayerHome&&!sp.isHome){
              var oppId=sp.opponent&&(sp.opponent.id||sp.opponent);
              if(oppId&&String(oppId)===String(homeTeamId)) atVenue=true;
            }
            if(atVenue&&sp.stat) venueGames.push(sp.stat);
          }
        }
      }
    }
    if(venueGames.length===0) return null;
    if(group==="hitting"){
      var tAB=0,tH=0,tHR=0,tBB=0,tK=0,tRBI=0,tPA=0,t2B=0,t3B=0,tHBP=0,tSF=0;
      for(var g of venueGames){
        tAB+=parseInt(g.atBats)||0;
        tH+=parseInt(g.hits)||0;
        tHR+=parseInt(g.homeRuns)||0;
        tBB+=parseInt(g.baseOnBalls)||0;
        tK+=parseInt(g.strikeOuts)||0;
        tRBI+=parseInt(g.rbi)||0;
        tPA+=(parseInt(g.plateAppearances)||parseInt(g.atBats))||0;
        t2B+=parseInt(g.doubles)||0;
        t3B+=parseInt(g.triples)||0;
        tHBP+=parseInt(g.hitByPitch)||0;
        tSF+=parseInt(g.sacFlies)||0;
      }
      var avg=tAB>0?(tH/tAB):0;
      var denom=tAB+tBB+tHBP+tSF;
      var obp=denom>0?((tH+tBB+tHBP)/denom):0;
      var tb=tH+t2B+(t3B*2)+(tHR*3);
      var slg=tAB>0?(tb/tAB):0;
      var ops=obp+slg;
      return {stat:{gamesPlayed:venueGames.length,atBats:tAB,hits:tH,homeRuns:tHR,
        baseOnBalls:tBB,strikeOuts:tK,rbi:tRBI,plateAppearances:tPA,
        avg:avg.toFixed(3),obp:obp.toFixed(3),slg:slg.toFixed(3),ops:ops.toFixed(3)},
        gamesPlayed:venueGames.length};
    }else{
      var tIP=0,tHp=0,tER=0,tBBp=0,tKp=0,tHRp=0;
      for(var g of venueGames){
        tIP+=parseIP(g.inningsPitched);
        tHp+=parseInt(g.hits)||0;
        tER+=parseInt(g.earnedRuns)||0;
        tBBp+=parseInt(g.baseOnBalls)||0;
        tKp+=parseInt(g.strikeOuts)||0;
        tHRp+=parseInt(g.homeRuns)||0;
      }
      var era=tIP>0?((tER/tIP)*9):0;
      var whip=tIP>0?((tHp+tBBp)/tIP):0;
      return {stat:{gamesPlayed:venueGames.length,era:era.toFixed(2),whip:whip.toFixed(2),
        inningsPitched:tIP.toFixed(1),hits:tHp,earnedRuns:tER,
        baseOnBalls:tBBp,strikeOuts:tKp,homeRuns:tHRp},
        gamesPlayed:venueGames.length};
    }
  }catch(e){return null;}
}

async function getPitcherRecentStarts(pitcherId){

    // Aggregate

    for(var g of recent){

      totalHR+=parseInt(s.homeRuns)||0;
    }
    var era=totalIP>0?((totalER/totalIP)*9):0;
    var whip=totalIP>0?((totalH+totalBB)/totalIP):0;
    var kPer9=totalIP>0?((totalK/totalIP)*9):0;
    var avgIP=recent.length>0?(totalIP/recent.length):0;
    return {
      games:recent,
      agg:{era:era.toFixed(2), whip:whip.toFixed(2), kPer9:kPer9.toFixed(1),
           ip:totalIP.toFixed(1), er:totalER, h:totalH, bb:totalBB, k:totalK, hr:totalHR,
           starts:recent.length, avgIP:avgIP.toFixed(1)}
    };
  }catch(e){return {games:[], agg:null};}
}

async function fetchAllPitcherExtras(pitcherId, isHome, isDayGame, homeTeamId){
  var results=await Promise.all([
    getPitcherHomeRoadSplits(pitcherId),
    getPitcherDayNightSplits(pitcherId),
    getPitcherRecentStarts(pitcherId),
    homeTeamId ? safeVenueStat(pitcherId, homeTeamId, isHome, "pitching") : Promise.resolve(null)
  ]);
  var hrSplits=results[0];
  var dnSplits=results[1];
  var l3Data=results[2];
  var venueStat=results[3];
  var splitStat=isHome?hrSplits.home:hrSplits.away;
  var dayNightStat=isDayGame?dnSplits.day:dnSplits.night;
  return {
    splitStat:splitStat,
    dayNightStat:dayNightStat,
    lastThree:l3Data.agg,
    lastThreeGames:l3Data.games,
    homeSplit:hrSplits.home,
    awaySplit:hrSplits.away,
    daySplit:dnSplits.day,
    nightSplit:dnSplits.night,
    venueStat:venueStat
  };
}

function TrendArrow({bvpVal, seasonVal}){
  if(!bvpVal||!seasonVal||bvpVal==="---"||seasonVal==="---") return null;
  const bvp=parseFloat(bvpVal);
  const ssn=parseFloat(seasonVal);
  if(isNaN(bvp)||isNaN(ssn)) return null;
  const diff=ssn-bvp;
  if(Math.abs(diff)<0.020) return <span className="trend-arrow" style={{color:C.muted}}>▸</span>;
  if(diff>0) return <span className="trend-arrow" style={{color:C.green}}>▲</span>;
  return <span className="trend-arrow" style={{color:C.red}}>▼</span>;
}

            <SplitDetailRow label="Day" stat={extras.daySplit}/>
            <SplitDetailRow label="Night" stat={extras.nightSplit}/>
          </div>
          {/* Recent Starts */}
          <div style={{marginBottom:12}}>
            <div style={{fontSize:9,letterSpacing:2,color:C.gold,marginBottom:6}}>LAST {l3?l3.starts:10} STARTS {l3?("— "+l3.ip+" IP, "+fmtEra(l3.era)+" ERA"):""}</div>
            {extras.lastThreeGames&&extras.lastThreeGames.length>0?(
              extras.lastThreeGames.map(function(g,gi){return <LastThreeGameRow key={gi} game={g}/>;})
            ):(
              <div style={{fontSize:10,color:C.muted}}>No recent game log data</div>
            )}
          </div>
          {/* Ballpark Factor */}
          <div>
            <div style={{fontSize:9,letterSpacing:2,color:C.orange,marginBottom:6}}>🏟 BALLPARK FACTOR</div>
            {venueStatP&&venueStatP.gamesPlayed>=1?(
              <div>
                <SplitDetailRow label={"At Park ("+venueStatP.gamesPlayed+" GS)"} stat={venueStatP.stat}/>
                {pParkDelta!==0&&(
                  <div style={{fontSize:10,color:pParkDelta>0?C.green:C.red,marginTop:4}}>
                    Score impact: <strong>{pParkDelta>0?"+":""}{pParkDelta} pts</strong>
                    {pParkDelta>0?" — pitches well here":" — struggles at this park"}
                    {venueStatP.gamesPlayed<10&&" (small sample — "+venueStatP.gamesPlayed+" GS)"}
                  </div>
                )}
                {pParkDelta===0&&(
                  <div style={{fontSize:10,color:C.muted,marginTop:4}}>Neutral park factor — not enough differential to adjust score</div>
                )}
              </div>
            ):(
              <div style={{fontSize:10,color:C.muted}}>No venue-specific data for this pitcher</div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* ─── Matchup Table (Enhanced) ─── */
function MatchupTable({rows, showEdge, showSeason, showGame, showPark}){
  var baseHeaders = ["BATTER","TEAM","vs PITCHER","PA","AB","H","HR","RBI","BB","K","AVG","OBP","SLG","OPS"];
  if(showGame) baseHeaders = ["BATTER","TEAM","vs PITCHER","GAME","PA","AB","H","HR","RBI","BB","K","AVG","OBP","SLG","OPS"];
  var headers = showEdge ? ["EDGE"].concat(baseHeaders) : baseHeaders;
  var seasonHeaders = showSeason ? ["szAVG","szOPS"] : [];
  var parkHeaders = showPark ? ["pkG","pkAVG","pkOPS","pkΔ"] : [];
  var allHeaders = headers.concat(seasonHeaders).concat(parkHeaders);

  return(
    <div style={{borderRadius:8,overflow:"hidden",border:"1px solid "+C.border}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
        <thead>
          <tr style={{background:"#0d1220",borderBottom:"1px solid "+C.border}}>
            {allHeaders.map(function(h){return(
              <th key={h} style={{padding:"8px 10px",textAlign:h==="BATTER"||h==="vs PITCHER"||h==="GAME"?"left":"center",fontSize:10,letterSpacing:1,color:h==="EDGE"?C.gold:h.startsWith("sz")?C.purple:h.startsWith("pk")?C.orange:C.muted,fontWeight:400,whiteSpace:"nowrap"}}>{h}</th>
            );})}
          </tr>
        </thead>
        <tbody>
          {rows.map(function(m,i){return(
            <tr key={i} className="matchup-row fade-in" style={{borderBottom:"1px solid "+C.border,background:i%2===0?C.card:"#0f1825",transition:"background 0.1s",cursor:"default",animationDelay:i*30+"ms"}}>
              {showEdge&&(
                <td style={{padding:"9px 10px"}}><EdgeBadge score={m.edgeScore||0}/></td>
              )}
              <td style={{padding:"9px 10px",fontWeight:500}}>{m.batter.fullName}</td>
              <td style={{padding:"9px 10px",color:C.subtext,fontSize:11}}>{m.batterTeam}</td>
              <td style={{padding:"9px 10px",color:C.blue}}>{m.pitcher.fullName}</td>
              {showGame&&(
                <td style={{padding:"9px 10px",color:C.subtext,fontSize:10}}>{m.gameLabel||""}</td>
              )}
              <td style={{padding:"9px 10px",textAlign:"center"}}>{m.stat.plateAppearances||0}</td>
              <td style={{padding:"9px 10px",textAlign:"center"}}>{m.stat.atBats||0}</td>
              <td style={{padding:"9px 10px",textAlign:"center"}}>{m.stat.hits||0}</td>
              <td style={{padding:"9px 10px",textAlign:"center",color:(m.stat.homeRuns||0)>0?C.gold:C.text}}>{m.stat.homeRuns||0}</td>
              <td style={{padding:"9px 10px",textAlign:"center"}}>{m.stat.rbi||0}</td>
              <td style={{padding:"9px 10px",textAlign:"center"}}>{m.stat.baseOnBalls||0}</td>
              <td style={{padding:"9px 10px",textAlign:"center",color:(m.stat.strikeOuts||0)>=5?C.red:C.text}}>{m.stat.strikeOuts||0}</td>
              <td style={{padding:"9px 10px",textAlign:"center",fontWeight:600,color:statColor(m.stat.avg),fontFamily:"'Bebas Neue',sans-serif",fontSize:15,letterSpacing:1}}>
                {fmtAvg(m.stat.avg)}
              </td>
              <td style={{padding:"9px 10px",textAlign:"center",color:statColor(m.stat.obp)}}>{fmtAvg(m.stat.obp)}</td>
              <td style={{padding:"9px 10px",textAlign:"center",color:statColor(m.stat.slg)}}>{fmtAvg(m.stat.slg)}</td>
              <td style={{padding:"9px 10px",textAlign:"center",fontWeight:600,color:statColor(parseFloat(m.stat.ops)/2)}}>{fmtOps(m.stat.ops)}</td>
              {showSeason&&(
                <>
                  <td style={{padding:"9px 10px",textAlign:"center",color:C.purple,fontSize:11}}>
                    {m.seasonStat?fmtAvg(m.seasonStat.avg):<span style={{color:C.muted}}>---</span>}
                    <TrendArrow bvpVal={m.stat.avg} seasonVal={m.seasonStat?m.seasonStat.avg:null}/>
                  </td>
                  <td style={{padding:"9px 10px",textAlign:"center",color:C.purple,fontSize:11}}>
                    {m.seasonStat?fmtOps(m.seasonStat.ops):<span style={{color:C.muted}}>---</span>}
                    <TrendArrow bvpVal={m.stat.ops} seasonVal={m.seasonStat?m.seasonStat.ops:null}/>
                  </td>
                </>
              )}
              {showPark&&(
                <>
                  <td style={{padding:"9px 10px",textAlign:"center",color:C.orange,fontSize:11}}>
                    {m.venueStat&&m.venueStat.gamesPlayed>=1?m.venueStat.gamesPlayed:<span style={{color:C.muted}}>---</span>}
                  </td>
                  <td style={{padding:"9px 10px",textAlign:"center",color:C.orange,fontSize:11}}>
                    {m.venueStat&&m.venueStat.gamesPlayed>=1?fmtAvg(m.venueStat.stat.avg):<span style={{color:C.muted}}>---</span>}
                  </td>
                  <td style={{padding:"9px 10px",textAlign:"center",color:m.venueStat&&m.venueStat.gamesPlayed>=5?statColor(parseFloat(m.venueStat.stat.ops||0)/2):C.muted,fontSize:11,fontWeight:m.venueStat&&m.venueStat.gamesPlayed>=5?600:400}}>
                    {m.venueStat&&m.venueStat.gamesPlayed>=1?fmtOps(m.venueStat.stat.ops):<span style={{color:C.muted}}>---</span>}
                  </td>
                  <td style={{padding:"9px 10px",textAlign:"center",fontSize:11}}>
                    {m.parkDelta&&m.parkDelta!==0?(
                      <span style={{color:m.parkDelta>0?C.green:C.red,fontWeight:600}}>
                        {m.parkDelta>0?"+":""}{m.parkDelta}
                      </span>
                    ):<span style={{color:C.muted}}>—</span>}
                  </td>
                </>
              )}
            </tr>
          );})}
        </tbody>
      </table>
    </div>
  );
}

function TopEdgesBanner({matchups}){
  var top = matchups.slice().sort(function(a,b){return (b.edgeScore||0)-(a.edgeScore||0);}).slice(0,5);
  if(top.length===0) return null;
  return(
    <div className="fade-in" style={{background:"linear-gradient(135deg,#1a1a2e 0%,#16213e 100%)",border:"1px solid "+C.gold+"30",borderRadius:10,padding:16,marginBottom:20}}>
      <div style={{fontSize:10,letterSpacing:2,color:C.gold,marginBottom:10}}>TOP EDGES</div>
      <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
        {top.map(function(m,i){
          var eg=edgeGrade(m.edgeScore||0);
          return(
            <div key={i} style={{background:"#0a0e1a80",borderRadius:8,padding:"8px 14px",border:"1px solid "+C.border,minWidth:160}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                <span style={{fontWeight:600,fontSize:12}}>{m.batter.fullName}</span>

              </div>
              <div style={{fontSize:10,color:C.subtext}}>

              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

                      onMouseOut={function(e){e.currentTarget.style.background="transparent";}}

                      <td style={{padding:"10px 8px"}}>
                        <span style={{padding:"2px 8px",borderRadius:4,fontSize:11,fontWeight:700,
                          background:wg.color+"18",border:"1px solid "+wg.color+"40",color:wg.color}}>

                      </td>
                      <td style={{padding:"10px 8px",color:C.text,fontWeight:500}}>{w.pitcher.fullName}</td>
                      <td style={{padding:"10px 8px",color:C.muted}}>{w.team||"—"}</td>
                      <td style={{padding:"10px 8px",color:C.subtext}}>{w.oppTeam||"—"}</td>
                      <td style={{padding:"10px 8px",textAlign:"center",color:k9>=9?C.green:k9>=7?C.text:C.muted}}>{k9.toFixed(1)}</td>
                      <td style={{padding:"10px 8px",textAlign:"center",color:C.text}}>{pIP.toFixed(1)}</td>
                      <td style={{padding:"10px 8px",textAlign:"center",fontWeight:700,fontSize:14,color:C.gold}}>{pK%1===0?pK.toFixed(1):pK}</td>
                      <td style={{padding:"10px 8px",color:C.muted,fontSize:10}}>{w.gameLabel||"—"}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {scanState==="done"&&topEdges.length===0&&topWhiffs.length===0&&(
        <div className="fade-in" style={{textAlign:"center",padding:40,color:C.muted}}>
          <div style={{fontSize:32,marginBottom:12}}>👀</div>
          <div style={{fontSize:14,letterSpacing:1}}>No matchups scored B or above today.</div>
          <div style={{fontSize:11,marginTop:6,color:C.subtext}}>Try selecting individual games to explore all edges, or check back closer to game time for updated probable pitchers.</div>
        </div>
      )}

      {/* Today's Games Quick Grid */}
      {games.length>0&&(
        <div style={{marginBottom:24}}>
          <div style={{fontSize:10,letterSpacing:2,color:C.muted,marginBottom:10}}>TODAY'S GAMES — CLICK TO EXPLORE</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill, minmax(200px, 1fr))",gap:8}}>
            {games.map(function(g){
              var away=g.teams.away.team.abbreviation;
              var home=g.teams.home.team.abbreviation;
              var awayP=g.teams.away.probablePitcher?g.teams.away.probablePitcher.fullName:"TBD";
              var homeP=g.teams.home.probablePitcher?g.teams.home.probablePitcher.fullName:"TBD";
              var time=new Date(g.gameDate).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
              var gameEdges=allEdges.filter(function(e){return e.gamePk===g.gamePk&&e.edgeScore>=55;});
              return(
                <button key={g.gamePk} className="home-card" onClick={function(){onSelectGame(g.gamePk);}}
                  style={{background:C.card,border:"1px solid "+C.border,borderRadius:8,padding:12,
                    cursor:"pointer",textAlign:"left",color:C.text,fontFamily:"'DM Mono',monospace",transition:"all 0.15s"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:14,fontWeight:600,letterSpacing:1}}>{away} @ {home}</span>
                    {gameEdges.length>0&&(
                      <span style={{fontSize:10,color:C.green,fontWeight:600}}>{gameEdges.length} edges</span>
                    )}
                  </div>
                  <div style={{fontSize:10,color:C.muted,marginTop:4}}>{time}</div>
                  <div style={{fontSize:9,color:C.subtext,marginTop:2}}>{awayP.split(" ").pop()} / {homeP.split(" ").pop()}</div>
                </button>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function ScanProgress({games, allEdges}){
  var gamesWithPitchers = games.filter(function(g){return g.teams.home.probablePitcher||g.teams.away.probablePitcher;});
  var scannedGames = {};
  allEdges.forEach(function(e){scannedGames[e.gamePk]=true;});
  var scannedCount = Object.keys(scannedGames).length;
  var total = gamesWithPitchers.length||1;
  var pct = Math.round(scannedCount/total*100);
  var topCount = allEdges.filter(function(e){return e.edgeScore>=55;}).length;

  return(
    <div style={{background:C.card,border:"1px solid "+C.border,borderRadius:10,padding:16}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:C.muted,marginBottom:8}}>
        <span>Scanning {scannedCount}/{total} games</span>
        <span style={{color:C.green}}>{topCount} edges found so far</span>
      </div>
      <div style={{height:6,background:C.border,borderRadius:3,overflow:"hidden"}}>
        <div style={{height:"100%",width:pct+"%",background:"linear-gradient(90deg,"+C.gold+","+C.green+")",
          borderRadius:3,transition:"width 0.4s ease-out"}}/>
      </div>
    </div>
  );
}

/* ─── Main App ─── */
function App(){

  // Load season history from localStorage on startup

  const [resultsTab, setResultsTab] = _s("batters"); // "batters" | "pitchers" | "walks"

  // League-wide scan state
  const [allEdges,setAllEdges]=_s([]);
